<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccwatch · map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234ec9a5'/%3E%3C/svg%3E">
<style>
  /* The same palette and the same words as the table view and the terminal.
     A second visualisation that invents its own vocabulary for the same states
     is a second thing to learn, and two things to keep in sync. */
  :root {
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --ink:#e6e9ef; --dim:#8b93a3;
    --ok:#4ec9a5; --warn:#e3b341; --bad:#f07171; --block:#c586e8; --info:#5fa8e8;
    --ground:#12161d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#eef1f5; --panel:#fff; --line:#dfe3ea; --ink:#1a1d23; --dim:#6b7280;
            --ok:#0f8a63; --warn:#8a5d00; --bad:#c0392b; --block:#7c3aed; --info:#1f6fb2;
            --ground:#f6f8fb; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
           padding:.9rem 1.1rem; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  h1 span { color:var(--dim); font-weight:400; }
  nav a { color:var(--dim); text-decoration:none; margin-right:.75rem; font-size:12px; }
  nav a.on { color:var(--ink); font-weight:600; }
  .gauges { display:flex; gap:1.1rem; margin-left:auto; align-items:baseline; flex-wrap:wrap; }
  .g-label { color:var(--dim); } .g-val { font-weight:600; }
  .g-reset { color:var(--dim); font-size:11px; }
  .stale { color:var(--warn); }
  #hostwarn { display:none; padding:.45rem 1.1rem; background:color-mix(in srgb, var(--bad) 14%, transparent);
              border-bottom:1px solid var(--bad); color:var(--bad); font-size:12px; }
  #hostwarn.on { display:block; }
  /* data-model.md §5's FeedCondition, rendered: (a)/(b) share this banner
     because both replace the volatile readings with a stated reason; (c) is
     a second, additive line (R1); (d) a third — all three are absent, not
     empty, when the feed is trusted and sessions exist. */
  #trust { display:none; padding:.45rem 1.1rem; font-size:12px; }
  #trust.on { display:block; }
  #trust .main.down { color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
  #trust .main.warming { color:var(--dim); }
  #trust .main { display:block; }
  #trust .unreadable { display:block; color:var(--warn); }
  #trust .emptymsg { display:block; color:var(--dim); }

  /* The map itself. A single inline SVG holds a `<g id="camera">` that every
     district/building/zone/figure — and, from a later entry, the wires — is a
     child of, all in world units authored by web/plots.js. Nothing here reads
     getBoundingClientRect() to position anything; the camera's own transform
     is the only place screen pixels enter the picture. A force-directed graph
     was the other option and is worse here: with a dozen nodes it moves every
     time you look at it, and "did that agent move or did I misremember" is not
     a question a monitoring view should raise. */
  #wrap { position:relative; padding:1.1rem; }
  #world { width:100%; height:calc(100vh - 8rem); display:block; }
  .hit { fill:transparent; }
  .district .hit { stroke:var(--line); stroke-width:1; fill:var(--ground); }
  .building .hit { stroke:var(--line); stroke-width:.6; fill:var(--panel); }
  .zone .hit { stroke:var(--line); stroke-width:.4; fill:none; stroke-dasharray:1.5; }
  .dlabel { font-size:7px; fill:var(--ink); font-weight:600; }
  .blabel { font-size:5px; fill:var(--ink); }
  .zlabel { font-size:4px; fill:var(--dim); }
  .norepo-badge { font-size:4px; fill:var(--warn); }
  .wreck-badge { font-size:4px; fill:var(--bad); }
  .deploy-badge { font-size:4px; fill:var(--ok); }
  .building.has-unfinished .hit { stroke:var(--bad); }

  .agent { cursor:default; }
  .agent.clickable { cursor:pointer; }
  .agent.clickable:hover .hit { fill:rgba(255,255,255,.06); }
  .figure { display:block; overflow:visible; }
  .alabel { font-size:3.6px; fill:var(--dim); text-anchor:middle; }
  .agent.sev4 .alabel { fill:var(--block); font-weight:600; }
  .agent.sev3 .alabel { fill:var(--bad); }
  .agent.sev2 .alabel { fill:var(--ink); }

  /* Motion is meaning here, not decoration: it is only ever applied to a state
     that is actually changing, so a still figure is a still session. */
  @keyframes bob   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-2.5px)} }
  @keyframes wave  { 0%,100%{transform:rotate(-16deg)}  50%{transform:rotate(16deg)} }
  @keyframes throb { 0%,100%{opacity:.35}               50%{opacity:1} }
  @keyframes tilt  { 0%,100%{transform:rotate(-2deg)}   50%{transform:rotate(2deg)} }
  .busy .body { animation:bob .9s ease-in-out infinite; }
  .waiting .arm { animation:wave .7s ease-in-out infinite; transform-origin:8px 2px; }
  .waiting .bubble { animation:throb 1.1s ease-in-out infinite; }
  .hung .body { animation:tilt 3.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .busy .body, .waiting .arm, .waiting .bubble, .hung .body { animation:none; }
  }

  /* Wreckage: an unfinished run left lying in the territory it belongs to. */
  .wreck { margin-top:.55rem; border-top:1px dashed var(--line); padding-top:.45rem;
           display:flex; flex-direction:column; gap:.25rem; }
  .wreck div { font-size:11px; color:var(--bad); display:flex; gap:.4rem; }
  .wreck .feat { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wreck .cost { margin-left:auto; color:var(--dim); }

  .legend { display:flex; gap:1rem; flex-wrap:wrap; padding:.2rem 1.1rem 1.4rem;
            color:var(--dim); font-size:11px; }
  .legend b { font-weight:600; }
  footer { padding:0 1.1rem 2rem; color:var(--dim); font-size:11px; }

  /* The inspector: the conversation, then the reply box. Reading before
     writing is the normal order — you rarely want to message an agent without
     first seeing what it is doing. */
  #reply { position:fixed; right:1rem; bottom:1rem; top:4.5rem;
           background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:.7rem; display:none; flex-direction:column; gap:.5rem;
           box-shadow:0 8px 40px rgba(0,0,0,.5); z-index:10; width:min(560px,94vw); }
  #reply.on { display:flex; }
  #ihead { display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap;
           padding-bottom:.5rem; border-bottom:1px solid var(--line); }
  #iname { font-weight:600; }
  #imeta { color:var(--dim); font-size:11px; }
  #iclose { margin-left:auto; }
  #convo { flex:1; overflow-y:auto; font-size:12px; display:flex;
           flex-direction:column; gap:.5rem; padding:.2rem 0; }
  .turn { display:grid; grid-template-columns:64px 1fr; gap:.5rem; }
  .turn .who { color:var(--dim); font-size:10px; text-align:right; padding-top:.1rem; }
  .turn .what { white-space:pre-wrap; word-break:break-word; }
  .turn.said .who { color:var(--info); }
  .turn.said.peer .who { color:var(--block); }
  .turn.assistant .who { color:var(--ok); }
  .turn.system .what, .turn.tool_result .what { color:var(--dim); }
  .turn.system .what { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                       overflow:hidden; }

  /* Rendered markdown. `pre-wrap` comes OFF here — the renderer has turned the
     newlines into blocks, and leaving it on doubles every gap. Everything is
     scoped under .md so an unrendered turn keeps its old appearance exactly. */
  .turn .what.md { white-space:normal; }
  .what.md > *:first-child { margin-top:0; }
  .what.md > *:last-child { margin-bottom:0; }
  .what.md p { margin:.35rem 0; }
  /* ⚠️ Not dimmed. The first cut rendered h5/h6 in --dim, and a heading paler
     than the paragraph under it reads as less important than the paragraph —
     the opposite of what the model meant by it. Size and weight carry the
     level; the colour stays the reading colour. */
  .what.md h4, .what.md h5, .what.md h6 {
    margin:.6rem 0 .3rem; font-weight:600; line-height:1.25; color:var(--ink); }
  .what.md h4 { font-size:14px; }
  .what.md h5 { font-size:13px; }
  .what.md h6 { font-size:12px; }
  .what.md ul, .what.md ol { margin:.3rem 0; padding-left:1.2rem; }
  .what.md li { margin:.1rem 0; }
  .what.md li > ul, .what.md li > ol { margin:.1rem 0; }
  .what.md code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
                  background:var(--ground); border:1px solid var(--line);
                  border-radius:3px; padding:0 .2rem; }
  /* A pasted file is wider than a 560px drawer, so the block scrolls on its own
     axis. Without this one code block widens the whole inspector and every
     turn above it reflows to match. */
  .what.md pre { margin:.4rem 0; padding:.4rem .5rem; background:var(--ground);
                 border:1px solid var(--line); border-radius:4px;
                 overflow-x:auto; max-height:16rem; overflow-y:auto; }
  .what.md pre code { background:none; border:0; padding:0; font-size:11px;
                      white-space:pre; }
  .what.md blockquote { margin:.35rem 0; padding-left:.5rem;
                        border-left:2px solid var(--line); color:var(--dim); }
  .what.md hr { border:0; border-top:1px solid var(--line); margin:.5rem 0; }
  .what.md del { color:var(--dim); }
  /* A URL is shown, never linked — see the note at the top of md.js. Dimmed so
     it reads as provenance rather than as something to click. */
  .what.md .mdurl { color:var(--dim); word-break:break-all; }
  /* ccwatch's own reduction of a tool use or result, not the model's words. */
  .what.md .mdmeta { color:var(--dim); white-space:pre-wrap; margin:.2rem 0; }
  #ifoot { display:flex; gap:.5rem; align-items:center; }
  /* Kill: styled as the destructive action it is, and two-step. A single click
     that ends a four-day-old session mid-task is not an affordance, it is a
     trap. */
  #killbar { display:none; flex-direction:column; gap:.35rem; font-size:11px;
             border-top:1px solid var(--line); padding-top:.45rem; }
  #killbar.on { display:flex; }
  #killbar .danger { background:none; border:1px solid var(--bad); color:var(--bad);
                     font:inherit; font-size:11px; padding:.15rem .5rem;
                     border-radius:3px; cursor:pointer; align-self:flex-start; }
  #killbar .danger:hover { background:color-mix(in srgb, var(--bad) 18%, transparent); }
  #killconfirm { display:none; flex-direction:column; gap:.3rem;
                 border:1px solid var(--bad); border-radius:4px; padding:.45rem; }
  #killconfirm.on { display:flex; }
  #killconfirm .row { display:flex; gap:.4rem; align-items:center; }
  #killconfirm b { color:var(--bad); }
  #killout { font-size:11px; }
  #killout.killed { color:var(--ok); } #killout.refused { color:var(--warn); }
  #killout.failed { color:var(--bad); }
  /* The pending question. Given the most prominent place in the inspector
     because it is the reason the session stopped, and the reason you opened
     this panel. */
  #ask { border:1px solid var(--block); border-radius:6px; padding:.55rem .6rem;
         display:none; flex-direction:column; gap:.4rem;
         background:color-mix(in srgb, var(--block) 8%, transparent); }
  #ask.on { display:flex; }
  #ask .q { font-weight:600; color:var(--block); }
  #ask ol { margin:0; padding-left:1.3rem; display:flex; flex-direction:column; gap:.3rem; }
  #ask li::marker { color:var(--block); }
  #ask .odesc { color:var(--dim); font-size:11px; }
  /* Stated, not implied: a sent message is queued behind the dialog, it does
     not answer it. Claiming otherwise would be the worst kind of lie this
     tool could tell — you would think an agent was unblocked when it is not. */
  #ask .how { font-size:11px; color:var(--dim); border-top:1px solid var(--line);
              padding-top:.35rem; }
  #ask code { background:var(--bg); border:1px solid var(--line); border-radius:3px;
              padding:0 .25rem; user-select:all; }
  #reply input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink);
                 font:inherit; padding:.4rem .55rem; border-radius:4px; }
  #reply input:focus { outline:none; border-color:var(--info); }
  #reply button { background:var(--info); border:0; color:#fff; font:inherit;
                  padding:.4rem .85rem; border-radius:4px; cursor:pointer; }
  #reply button.ghost { background:none; border:1px solid var(--line); color:var(--dim); }
  #reply button:disabled { opacity:.5; cursor:default; }
  #replyOut { font-size:11px; }
  #replyOut.delivered { color:var(--ok); } #replyOut.queued { color:var(--warn); }
  #replyOut.failed { color:var(--bad); }
  .empty { color:var(--dim); padding:1rem; }
</style>
</head>
<body>
<header>
  <h1>ccwatch <span id="counts"></span></h1>
  <nav><a href="/">table</a><a href="/map" class="on">map</a></nav>
  <div class="gauges" id="gauges"></div>
</header>
<div id="trust"></div>
<div id="hostwarn"></div>
<div id="wrap">
  <svg id="world" viewBox="0 0 408 408">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4"
        markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="var(--info)"/></marker></defs>
    <g id="camera"></g>
  </svg>
</div>
<div class="legend" id="legend"></div>
<div id="reply">
  <div id="ihead">
    <span id="iname"></span><span id="imeta"></span>
    <button class="ghost" id="iclose">close</button>
  </div>
  <div id="ask"></div>
  <div id="convo"></div>
  <div id="killbar"></div>
  <div id="ifoot">
    <input id="replyText" placeholder="message…" autocomplete="off">
    <button id="replySend">send</button>
  </div>
  <span id="replyOut"></span>
</div>
<footer id="foot"></footer>
<!-- Served straight off the web directory by the static fallback in `serve`, so
     it needs no route of its own. The path is absolute because this page
     answers on both /map and /map.html and one src should mean one file. -->
<script src="/md.js"></script>
<script src="/plots.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => { if (s == null) return "-"; s = Math.max(0, s);
  return s < 60 ? Math.floor(s)+"s" : s < 3600 ? Math.floor(s/60)+"m"
       : s < 86400 ? Math.floor(s/3600)+"h" : Math.floor(s/86400)+"d"; };
const SEND_TOKEN = "__CCWATCH_SEND_TOKEN__";
const CAN_SEND = SEND_TOKEN && !SEND_TOKEN.startsWith("__");
// Set from the server, which only enables it when started with --allow-kill.
let CAN_KILL = false;
// The single VOLATILE gate (data-model.md §5, FR-029): true only when the
// feed is fully trusted. Every reading in the withheld set — the context
// fill inside a figure, `ctx NN%`/`NN MB` in a figure's title, every gauge
// percentage, the host memory-pressure figures — reads this flag rather than
// deciding independently, so there is exactly one place to extend it.
let VOLATILE = true;

// Built once at load, never touched by a refresh (FR-020): CAN_SEND is known
// before the first tick, so there is nothing here a snapshot could change.
$("legend").innerHTML = [
  `<span><b style="color:var(--block)">raised arm</b> blocked on you — click to read the question</span>`,
  `<span><b style="color:var(--bad)">tilted, ?</b> says busy but has gone quiet</span>`,
  `<span><b style="color:var(--ok)">bobbing</b> working</span>`,
  `<span><b style="color:var(--info)">outline</b> alive, nothing to corroborate it</span>`,
  `<span><b style="color:var(--dim)">z</b> idle</span>`,
  `<span>fill level inside the body = context used</span>`,
  CAN_SEND ? `<span>click an agent to read its conversation and reply</span>`
           : `<span>click an agent to read its conversation (read-only)</span>`,
].join("");

// One mapping from status to appearance, so the figure, the label colour and
// the territory border can never disagree about how bad something is.
const KIND = {
  waiting:          {cls:"waiting", sev:4, colour:"var(--block)"},
  "HUNG?":          {cls:"hung",    sev:3, colour:"var(--bad)"},
  "HUNG!!":         {cls:"hung",    sev:3, colour:"var(--bad)"},
  "SDK STALE?":     {cls:"hung",    sev:3, colour:"var(--bad)"},
  "NO TRANSCRIPT":  {cls:"hung",    sev:3, colour:"var(--bad)"},
  busy:             {cls:"busy",    sev:2, colour:"var(--ok)"},
  sdk:              {cls:"busy",    sev:2, colour:"var(--ok)"},
  "sdk-ts":         {cls:"quiet",   sev:1, colour:"var(--info)"},
  shell:            {cls:"quiet",   sev:1, colour:"var(--info)"},
  unknown:          {cls:"quiet",   sev:1, colour:"var(--dim)"},
  idle:             {cls:"idle",    sev:0, colour:"var(--dim)"},
};
const kindOf = r => KIND[r.token] || {cls:"quiet", sev:r.sev, colour:"var(--dim)"};

// A little standing figure. Drawn as SVG rather than an emoji so the colour
// tracks the status and the parts can be animated independently — the raised
// arm on a session that is blocked on you is the whole point of this view.
// Built with svgEl rather than an innerHTML template string (FR-016/V1/V2):
// this is the figure primitive's art, assembled fresh into a detached node
// each call and handed to updateFigure() to attach — no innerHTML assignment
// anywhere on the page's refresh path except the one turn body.
function figure(r, w, h) {
  const k = kindOf(r);
  const c = k.colour;
  const ctx = VOLATILE && r.context && r.context.used_percentage != null
            ? Math.min(100, Math.max(0, r.context.used_percentage)) : null;
  // Context fill is drawn as a level inside the body: a session close to
  // compacting is worth seeing before it happens.
  const fillH = ctx == null ? 0 : (14 * ctx / 100);
  const svg = svgEl("svg", {class: "figure", viewBox: "0 0 40 44",
    width: w || 40, height: h || 44, "aria-hidden": "true"});
  const body = svgEl("g", {class: "body"});
  if (k.cls === "waiting") {
    const bubble = svgEl("g", {class: "bubble"});
    bubble.appendChild(svgEl("rect", {x: 24, y: 1, width: 14, height: 11, rx: 3, fill: c, opacity: .22}));
    const bang = svgEl("text", {x: 31, y: 9.5, "text-anchor": "middle", "font-size": 8, fill: c});
    bang.textContent = "!";
    bubble.appendChild(bang);
    body.appendChild(bubble);
  }
  if (k.cls === "idle") {
    const z = svgEl("text", {x: 30, y: 9, "font-size": 7, fill: "var(--dim)"});
    z.textContent = "z";
    body.appendChild(z);
  }
  body.appendChild(svgEl("circle", {cx: 20, cy: 12, r: 5.4, fill: "none", stroke: c, "stroke-width": 1.6}));
  if (k.cls === "hung") {
    const q = svgEl("text", {x: 20, y: 15, "text-anchor": "middle", "font-size": 7, fill: c});
    q.textContent = "?";
    body.appendChild(q);
  }
  body.appendChild(svgEl("rect", {
    x: 14.6, y: 19, width: 10.8, height: 15, rx: 4,
    fill: k.cls === "quiet" ? "none" : c, "fill-opacity": k.cls === "quiet" ? 0 : .16,
    stroke: c, "stroke-width": 1.6,
  }));
  if (ctx != null) {
    body.appendChild(svgEl("rect", {
      x: 15.6, y: 20 + (14 - fillH), width: 8.8, height: fillH, rx: 2,
      fill: ctx >= 80 ? "var(--bad)" : ctx >= 60 ? "var(--warn)" : c, opacity: .55,
    }));
  }
  const arm = svgEl("g", {class: "arm"});
  arm.appendChild(svgEl("line", {
    x1: 25.4, y1: 22, x2: k.cls === "waiting" ? 31 : 29, y2: k.cls === "waiting" ? 13 : 27,
    stroke: c, "stroke-width": 1.6, "stroke-linecap": "round",
  }));
  body.appendChild(arm);
  body.appendChild(svgEl("line", {x1: 14.6, y1: 22, x2: 10.5, y2: 27, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  body.appendChild(svgEl("line", {x1: 17.5, y1: 34, x2: 16, y2: 42, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  body.appendChild(svgEl("line", {x1: 22.5, y1: 34, x2: 24, y2: 42, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  svg.appendChild(body);
  return svg;
}

// Within a territory the project prefix is redundant and eats the width that
// would otherwise show what distinguishes one agent from another.
// Inside a territory the repo name is redundant and eats the width that would
// otherwise show what distinguishes one agent from another. Session names are
// derived from the DIRECTORY, which may differ from the repo, so both are
// tried.
function shortName(r) {
  const cands = [r.project, (r.repo || "").split("/").pop(),
                 (r.cwd || "").split("/").filter(Boolean).pop()]
                .filter(Boolean).sort((a, b) => b.length - a.length);
  for (const p of cands)
    if (r.name.startsWith(p + "-")) return r.name.slice(p.length + 1);
  return r.name;
}

// The one and only thing this file may hand plots.js: strings identifying who
// something is (data-model.md §2). No sev/psev/token/quiet/waited/context/
// rss_mb/cost/age/pipeline/deploys, and no row order, may reach this tree.
const NO_REPO = "no repo";

function buildWorldModel(s) {
  const districts = {};      // org -> {org, isNoRepo, buildings: {slug -> ...}}
  const districtsByKey = {}; // "d|<org>" -> {org, isNoRepo}
  const buildingsByKey = {}; // "b|<org>|<slug>" -> {slug, label, hasRemote, unfinished, deploys}
  const zonesByKey = {};     // "z|<slug>|<branch>" -> {branch}
  const figuresByKey = {};   // "f|<slug>|<branch>|<sid>" -> row
  const buildingBySlugRepo = {}; // row.repo -> building, for exact deploy matching

  function ensureDistrict(org, isNoRepo) {
    if (!districts[org]) {
      districts[org] = {org, isNoRepo, buildings: {}};
      districtsByKey["d|" + org] = {org, isNoRepo};
    }
    return districts[org];
  }
  function ensureBuilding(d, slug, label, hasRemote) {
    if (!d.buildings[slug]) {
      d.buildings[slug] = {slug, label, hasRemote, zones: {}, unfinished: [], deploys: []};
      buildingsByKey["b|" + d.org + "|" + slug] = d.buildings[slug];
    }
    return d.buildings[slug];
  }
  function ensureZone(b, slug, branchKey) {
    if (!b.zones[branchKey]) {
      b.zones[branchKey] = {branch: branchKey, figures: []};
      zonesByKey["z|" + slug + "|" + branchKey] = b.zones[branchKey];
    }
    return b.zones[branchKey];
  }

  for (const r of (s.sessions || [])) {
    const hasRemote = !!r.repo;
    const org = hasRemote ? r.repo.split("/")[0] : NO_REPO;
    const slug = r.repo || ("dir:" + (r.cwd || "?"));
    const label = r.repo || r.project || slug;
    const branchKey = r.branch || "?";
    const d = ensureDistrict(org, !hasRemote);
    const b = ensureBuilding(d, slug, label, hasRemote);
    const z = ensureZone(b, slug, branchKey);
    z.figures.push({sid: r.sid});
    figuresByKey["f|" + slug + "|" + branchKey + "|" + r.sid] = r;
    if (r.repo) buildingBySlugRepo[r.repo] = b;
  }
  for (const u of (s.unfinished || [])) {
    const hasRemote = !!u.repo;
    const org = hasRemote ? u.repo.split("/")[0] : NO_REPO;
    // No `cwd` on an unfinished-run row — `project` is the only directory
    // hint it carries (data-model.md §2's cwd rule applies to live rows).
    const slug = u.repo || ("dir:" + (u.project || "?"));
    const label = u.repo || u.project || slug;
    const d = ensureDistrict(org, !hasRemote);
    const b = ensureBuilding(d, slug, label, hasRemote);
    b.unfinished.push(u);
    if (u.repo) buildingBySlugRepo[u.repo] = b;
  }
  // Exact match on owner/name — see the note this replaces at the old
  // territory()/tick() call site: matching on a directory basename let a
  // deploy on acme/checkout-api silently never find its building.
  for (const dep of ((s.deploys && s.deploys.runs) || [])) {
    const b = buildingBySlugRepo[dep.repo];
    if (b) b.deploys.push(dep);
  }

  const tree = Object.keys(districts).map(org => {
    const d = districts[org];
    return {
      org: d.org,
      buildings: Object.keys(d.buildings).map(slug => {
        const b = d.buildings[slug];
        return {
          slug: b.slug,
          zones: Object.keys(b.zones).map(br => {
            const z = b.zones[br];
            return {branch: z.branch, figures: z.figures};
          }),
        };
      }),
    };
  });

  return {tree, districtsByKey, buildingsByKey, zonesByKey, figuresByKey};
}

const SVGNS = "http://www.w3.org/2000/svg";

// The one reconciliation primitive (research.md D4): create/update/remove by
// identity key, never a wholesale rebuild. `key` namespaces the index kept on
// `parentEl` (`camera` holds four kinds of child — district/building/zone/
// figure — reconciled by three separate calls sharing one parent, so each
// gets its own slice rather than one call's absentees deleting another's
// children). `make()` returns a freshly created element; `update(el, model)`
// writes attributes/text onto an existing one. Anything indexed under `key`
// whose identity is missing from `wanted` is removed.
function reconcile(parentEl, wanted, key, make, update) {
  if (!parentEl._reconcileIndex) parentEl._reconcileIndex = {};
  if (!parentEl._reconcileIndex[key]) parentEl._reconcileIndex[key] = {};
  const index = parentEl._reconcileIndex[key];
  for (const id in index) {
    if (!wanted.hasOwnProperty(id)) {
      index[id].remove();
      delete index[id];
    }
  }
  for (const id in wanted) {
    const model = wanted[id];
    let el = index[id];
    if (!el) {
      el = make(id, model);
      index[id] = el;
      parentEl.appendChild(el);
    }
    update(el, model);
  }
}

function titleBits(r) {
  const bits = [r.token];
  if (r.questions && r.questions.length) bits.push("ASKS: " + r.questions[0].question);
  if (r.waited != null) bits.push(`${r.note} ${dur(r.waited)}`);
  else if (r.note) bits.push(r.note);
  if (r.pipeline) bits.push(`${r.pipeline.phase}/${r.pipeline.crashed ? "CRASHED" : r.pipeline.status}`);
  bits.push(`age ${dur(r.age)}`);

    bits.push(`ctx ${Math.floor(r.context.used_percentage)}%`);

// Message lines are drawn between the two figures involved, wherever they are —
// including across territories, which is the case worth seeing. Positioned

    stroke: "var(--info)", "stroke-opacity": ".5", "stroke-width": "1"}));

  return g;

function updateWire(g, {p, q, count}) {
  // Bowed, so A→B and B→A are two visible lines rather than one overdrawn.
  const mx = (p.x + q.x)/2, my = (p.y + q.y)/2;
  const dx = q.x - p.x, dy = q.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const bow = Math.min(48, len * 0.18);
  const cx = mx - (dy/len) * bow, cy = my + (dx/len) * bow;
  const w = Math.min(3.2, 0.7 + Math.log2(1 + count) * 0.7);
  const path = g.querySelector("path");
  path.setAttribute("d", `M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`);
  path.setAttribute("stroke-width", w);

  // line is clutter that buries the edge that actually has traffic. Placed
  // near the SENDER rather than at the apex: the apex lands in the middle of
  // whatever the line crosses, which was reliably a territory's own text.
  if (count > 1) {
    const t = 0.22;   // quadratic Bézier at t, close to the source
    const lx = (1-t)*(1-t)*p.x + 2*(1-t)*t*cx + t*t*q.x;
    const ly = (1-t)*(1-t)*p.y + 2*(1-t)*t*cy + t*t*q.y;
    circle.setAttribute("cx", lx); circle.setAttribute("cy", ly);
    circle.style.display = ""; text.style.display = "";
    text.setAttribute("x", lx); text.setAttribute("y", ly + 3);

function wires(peers, placed) {
  const camera = $("camera");
  const wanted = {};

  if (peers && peers.edges && placed) {
    const centreByName = {};
    for (const k in placed.figuresByKey) {
      const row = placed.figuresByKey[k];
      const geo = placed.world.figures[k];
      if (row && geo) centreByName[row.name] = {x: geo.cx, y: geo.cy};
    }
    for (const e of peers.edges) {
      const p = centreByName[e.from], q = centreByName[e.to];
      // Only edges where BOTH ends are on the map. A line to a session that
      // has exited would be a line to nowhere, and the peers panel in the
      // table view already lists those.
      if (!p || !q || e.from === e.to) continue;
      wanted[`${e.from}->${e.to}`] = {p, q, count: e.count};
      drawn++;
    }
  }
  reconcile(camera, wanted, "wire", makeWire, updateWire);
  return drawn;

// A session killed by the OS leaves the same trace as one that exited
// cleanly, so without this the dashboard can say an agent is gone but not why.
// Built once, updated in place (FR-016/V1): the bold lead-in never changes,
// only the trailing text node does.
const hostwarnEls = (function () {
  const el = $("hostwarn");
  if (!el) return null;

  const rest = document.createTextNode("");
  el.append(lead, rest);
  return {el, rest};

function hostwarn(h) {
  if (!hostwarnEls) return;

  el.className = "on";
  // Every memory figure here is in the VOLATILE set (data-model.md §5): the

      + " The OS may kill sessions, and a killed session looks exactly like a clean exit.";

  const share = h.sessions_mb != null
    ? ` Sessions account for ${h.sessions_mb}MB of it (${h.idle_mb || 0}MB of that idle).` : "";
  rest.textContent = ` — swap ${h.swap_used_pct}% used `
    + `(${h.swap_used_mb}/${h.swap_total_mb}MB), ${h.ram_free_mb}MB RAM free. `

  span.querySelector(".g-label").textContent = g.name;
  const val = span.querySelector(".g-val");

  val.style.color = band(g.x.used_percentage);

})();

    note.textContent = "usage not reporting — run ccwatch install-statusline";

  // instead of, the reading's own staleness window below.

    note.className = "stale"; note.style.display = "";
    note.textContent = "usage: withheld while the feed is unreliable";
    return;

  // screen is read as current whatever is printed beside it — a fixture left
  // over from an earlier run showed 52% while the real figure was 7%.
  if (u.age > (u.stale_after || 600)) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "stale"; note.style.display = "";
    note.textContent = `usage: last reading ${dur(u.age)} old — not shown`;
    return;

  const now = Date.now() / 1000;
  const wanted = {};
  if (u.five_hour) wanted["5h"] = {name: "5h", x: u.five_hour, now};
  if (u.seven_day) wanted["7d"] = {name: "7d", x: u.seven_day, now};
  if (u.seven_day_opus) wanted["7dop"] = {name: "7d opus", x: u.seven_day_opus, now};

// ---- inspector -------------------------------------------------------------
let target = null;

// The one and only setInterval in this file, shared by every periodic thing
// on the page (the roster poll and the open conversation's own cadence) so a
// hidden (backgrounded) tab does no periodic work of any kind.
const timers = {};
function every(name, ms, fn) {
  if (timers[name]) clearInterval(timers[name]);
  timers[name] = setInterval(fn, ms);
}
function clearEvery(name) {
  if (timers[name]) { clearInterval(timers[name]); timers[name] = null; }
}

const WHO = {said:"you", assistant:"claude", system:"system", tool_result:"result"};

// Which turns are markdown. What Claude and you write is; a system reminder and
// a "← 4821 bytes" result are not — they are already-reduced machine text, and
// running them through a markdown pass would find headings in XML-ish tags and
// emphasis in file paths, inventing structure that was never in the transcript.
const MD = {assistant:true, said:true};

// ⚠️ Falls back to escaped plain text if md.js failed to load — text intact,
// pre-wrap kept, because a missing renderer must not present itself as a
// session with nothing to say. The class comes off the SAME condition as the
// rendering: tagging a plain-text turn as markdown would drop its newlines.
const isMd = t => !!(MD[t.kind] && window.CCWATCH_MD);

// A message slot for the empty/error states, kept out of the "turn" index so
// reconcile()'s removal pass never touches it. Built once; toggled, not
// replaced.
const convoMsgEl = (function () {
  const box = $("convo");
  const el = document.createElement("div"); el.className = "dim"; el.style.display = "none";
  box.appendChild(el);
  return el;
})();
function setConvoMessage(text, isError) {
  convoMsgEl.textContent = text;
  convoMsgEl.style.color = isError ? "var(--bad)" : "";
  convoMsgEl.style.display = "";
}
function clearConvoMessage() {
  convoMsgEl.style.display = "none";
  convoMsgEl.textContent = "";
}

// One <div class="turn"> per transcript entry, reconciled by identity
// (research.md D4) so an open text selection or a scrolled-to position
// survives a refresh instead of being rebuilt wholesale. `.what`'s single
// remaining innerHTML write is the escape-first-then-tag path Constitution X
// requires (V2) — the container is reconciled, the body is not.
function makeTurn() {
  const div = document.createElement("div");
  const who = document.createElement("div"); who.className = "who";
  const what = document.createElement("div"); what.className = "what";
  div.append(who, what);
  return div;
}
function updateTurn(div, t) {
  const who = t.origin === "peer" ? (t.from || "peer") : (WHO[t.kind] || t.kind);
  div.className = "turn " + t.kind + (t.origin === "peer" ? " peer" : "");
  div.querySelector(".who").textContent = who;
  const what = div.querySelector(".what");
  what.className = "what" + (isMd(t) ? " md" : "");
  if (isMd(t)) what.innerHTML = CCWATCH_MD.render(t.text || "");
  else what.textContent = t.text || "";
}

function renderConvo(data) {
  const box = $("convo");
  if (!data || !data.turns || !data.turns.length) {
    reconcile(box, {}, "turn", makeTurn, updateTurn);
    setConvoMessage("No transcript yet. Embedded-SDK sessions never write one.");
    return;
  }
  clearConvoMessage();
  // No scroll-position save/restore: reconciliation never removes a turn
  // still in `wanted`, so the browser's own scroll position is never
  // disturbed by a refresh in the first place (research.md D4).
  const wanted = {};
  const seenAt = {};
  data.turns.forEach(t => {
    const dupKey = t.timestamp + "|" + t.kind;
    seenAt[dupKey] = (seenAt[dupKey] || 0) + 1;
    wanted["at|" + t.kind + "|" + t.timestamp + "|" + seenAt[dupKey]] = t;
  });
  reconcile(box, wanted, "turn", makeTurn, updateTurn);
}

async function loadConvo() {
  if (!target) return;
  const box = $("convo");
  try {
    const res = await fetch(`/api/transcript?sid=${encodeURIComponent(target.sid)}&n=40`,
                            {cache:"no-store"});
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      reconcile(box, {}, "turn", makeTurn, updateTurn);
      setConvoMessage(j.error || "no transcript");
      return;
    }
    renderConvo(await res.json());
  } catch (e) {
    reconcile(box, {}, "turn", makeTurn, updateTurn);
    setConvoMessage("could not read the transcript: " + e.message, true);
  }
}

// One question <li> per option, reconciled by index (the option list is the
// one genuinely variable-length part of the ask panel).
function makeQuestion() {
  const div = document.createElement("div");
  const q = document.createElement("div"); q.className = "q";
  const ol = document.createElement("ol");
  div.append(q, ol);
  return div;
}
function makeOption() {
  const li = document.createElement("li");
  const desc = document.createElement("div"); desc.className = "odesc";
  li.append(document.createTextNode(""), desc);
  return li;
}
function updateOption(li, o) {
  li.childNodes[0].textContent = o.label;
  const desc = li.querySelector(".odesc");
  desc.textContent = o.description || "";
  desc.style.display = o.description ? "" : "none";
}
function updateQuestion(div, q) {
  div.querySelector(".q").textContent = q.question;
  const ol = div.querySelector("ol");
  const wanted = {};
  (q.options || []).forEach((o, i) => { wanted["o" + i] = o; });
  reconcile(ol, wanted, "opt", makeOption, updateOption);
}

// Built once, updated in place (FR-016/V1): `dialogNote`/`dialogHow` cover
// the no-recorded-question case, `qlist`/`qHow` the normal one — exactly one
// pair is ever visible, toggled by `style.display` rather than by replacing
// either subtree.
const askEls = (function () {
  const box = $("ask");
  const dialogNote = document.createElement("div"); dialogNote.className = "q";
  const dialogHow = document.createElement("div"); dialogHow.className = "how";
  dialogHow.textContent = "No question is recorded in the transcript, so this is a dialog "
    + "(a permission prompt, for example). Its text is only in that session's terminal.";
  const qlist = document.createElement("div");
  const qHow = document.createElement("div"); qHow.className = "how";
  const qHowB = document.createElement("b"); qHowB.textContent = "queued behind it";
  qHow.append(
    document.createTextNode("This is a dialog: it can only be answered in that session's own"
      + " terminal. A message sent from here is "),
    qHowB,
    document.createTextNode(" and read once the dialog is resolved — it does not answer it."));
  box.append(dialogNote, dialogHow, qlist, qHow);
  [dialogNote, dialogHow, qlist, qHow].forEach(el => { el.style.display = "none"; });
  return {box, dialogNote, dialogHow, qlist, qHow};
})();
function renderAsk(row) {
  const {box, dialogNote, dialogHow, qlist, qHow} = askEls;
  const qs = row && row.questions;
  if (!qs || !qs.length) {
    qlist.style.display = "none"; qHow.style.display = "none";
    reconcile(qlist, {}, "q", makeQuestion, updateQuestion);
    // A waiting session with no recorded question is a different kind of
    // dialog — a permission prompt, say — whose text lives only in the TUI.
    // Saying so beats an empty box that looks like a loading failure.
    if (row && row.sev === 4) {
      box.className = "on";
      dialogNote.style.display = ""; dialogHow.style.display = "";
      dialogNote.textContent = "Waiting on you: " + (row.note || "input needed");
    } else {
      box.className = "";
      dialogNote.style.display = "none"; dialogHow.style.display = "none";
    }
    return;
  }
  box.className = "on";
  dialogNote.style.display = "none"; dialogHow.style.display = "none";
  qlist.style.display = ""; qHow.style.display = "";
  const wanted = {};
  qs.forEach((q, i) => { wanted["q" + i] = q; });
  reconcile(qlist, wanted, "q", makeQuestion, updateQuestion);
}

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding.
// Built once, listeners attached once (FR-016/V1): only the text content
// changes per render. `killEls.row` is the closure `killgo`'s listener reads,
// updated on every renderKill() call rather than re-bound.
const killEls = (function () {
  const bar = $("killbar");
  if (!bar) return null;
  const startBtn = document.createElement("button");
  startBtn.className = "danger"; startBtn.id = "killstart";
  const confirmDiv = document.createElement("div"); confirmDiv.id = "killconfirm";
  const desc = document.createElement("div");
  const nameB = document.createElement("b");
  const memB = document.createElement("b");
  const resumeCode = document.createElement("code");
  const phaseB = document.createElement("b");
  const phaseWrap = document.createElement("span"); phaseWrap.style.display = "none";
  phaseWrap.append(document.createTextNode(" It is running spec-run phase "), phaseB,
    document.createTextNode(" — killing it aborts a paid model call."));
  const busyText = document.createTextNode("");
  desc.append(
    document.createTextNode("Killing "), nameB, document.createTextNode(" frees "), memB,
    document.createTextNode(". The conversation is kept — reopen it with "),
    resumeCode, document.createTextNode("."), phaseWrap, busyText);
  const row = document.createElement("div"); row.className = "row";
  const goBtn = document.createElement("button");
  goBtn.className = "danger"; goBtn.id = "killgo"; goBtn.textContent = "yes, kill it";
  const noBtn = document.createElement("button");
  noBtn.className = "ghost"; noBtn.id = "killno"; noBtn.textContent = "cancel";
  const out = document.createElement("span"); out.id = "killout";
  row.append(goBtn, noBtn, out);
  confirmDiv.append(desc, row);
  bar.append(startBtn, confirmDiv);
  startBtn.addEventListener("click", () => confirmDiv.classList.add("on"));
  noBtn.addEventListener("click", () => confirmDiv.classList.remove("on"));
  goBtn.addEventListener("click", () => doKill(killEls.row));
  return {bar, startBtn, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText, out, row: null};
})();

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding.
function renderKill(row) {
  if (!killEls) return;
  const {bar, startBtn, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText, out} = killEls;
  if (!CAN_KILL || !row) { bar.className = ""; confirmDiv.classList.remove("on"); return; }
  killEls.row = row;
  bar.className = "on";
  const mem = row.rss_mb != null ? `${row.rss_mb}MB` : "an unknown amount";
  startBtn.textContent = `kill this session (frees ${mem})`;
  nameB.textContent = row.name;
  memB.textContent = mem;
  resumeCode.textContent = `claude --resume ${row.sid}`;
  if (row.pipeline && row.pipeline.status === "running") {
    phaseWrap.style.display = ""; phaseB.textContent = row.pipeline.phase;
  } else {
    phaseWrap.style.display = "none";
  }
  busyText.textContent = row.token === "busy"
    ? " It is mid-turn, so a tool call may be left half-applied." : "";
  out.className = ""; out.textContent = "";
}

async function doKill(row) {
  const out = $("killout");
  out.className = ""; out.textContent = "killing…";
  try {
    const res = await fetch("/api/kill", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: row.sid}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    // A refusal is shown verbatim: it explains what would have been lost, and
    // reducing it to "failed" would throw away the only useful part.
    out.textContent = j.state === "killed"
      ? `killed — ${row.rss_mb != null ? row.rss_mb + "MB" : "memory"} released`
      : (j.detail || j.error || "failed");
    if (j.state === "killed") setTimeout(closeReply, 1200);
  } catch (e) { out.className = "failed"; out.textContent = e.message; }
}

function openReply(sid, name, row) {
  target = {sid, name};
  $("iname").textContent = name;
  $("imeta").textContent = row
    ? [row.repo, row.branch, row.token].filter(Boolean).join(" · ") : "";
  renderAsk(row);
  renderKill(row);
  $("replyOut").textContent = ""; $("replyOut").className = "";
  reconcile($("convo"), {}, "turn", makeTurn, updateTurn);
  setConvoMessage("reading the transcript…");
  $("ifoot").style.display = CAN_SEND ? "flex" : "none";
  $("reply").classList.add("on");
  loadConvo();
  // Followed live while open, on its own slower cadence — the transcript is
  // read from disk per request and is much heavier than the roster poll.
  every("convo", 5000, loadConvo);
  if (CAN_SEND) $("replyText").focus();
}
function closeReply() {
  target = null;
  clearEvery("convo");
  $("reply").classList.remove("on");
  $("replyText").value = "";
}
async function doSend() {
  if (!target) return;
  const msg = $("replyText").value.trim();
  if (!msg) return;
  const btn = $("replySend"), out = $("replyOut");
  btn.disabled = true; out.className = "";
  out.textContent = "sending, then checking it arrived…";
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: target.sid, message: msg}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    out.textContent = j.state === "delivered" ? "delivered — it has the message"
                    : j.state === "queued" ? "queued — mid-turn, it will read this next turn"
                    : (j.error || j.detail || "failed");
    if (j.state === "delivered" || j.state === "queued") $("replyText").value = "";
  } catch (e) { out.className = "failed"; out.textContent = e.message; }
  btn.disabled = false;
}
$("replySend").addEventListener("click", doSend);
$("iclose").addEventListener("click", closeReply);
$("replyText").addEventListener("keydown", e => {
  if (e.key === "Enter") doSend();
  if (e.key === "Escape") closeReply();
});
let lastRows = {};
document.addEventListener("click", e => {
  const a = e.target.closest(".agent[data-sid]");
  // Clicking is worth doing even in --read-only: seeing the conversation is
  // the more common reason to click an agent than messaging it.
  if (a) openReply(a.dataset.sid, a.dataset.name, lastRows[a.dataset.sid]);
});

// ---- world coordinates ------------------------------------------------------
// The one persisted record (data-model.md §4). Storage calls are injected so a
// throwing localStorage — private mode, a full origin quota — cannot take the
// map down; plots.js itself flips `persistence` to "unavailable" once rather
// than retrying every frame.
const PLOTS_KEY = "ccwatch.map.plots.v1";
if (window.CCWATCH_PLOTS) {
  CCWATCH_PLOTS.load(function () {
    try { return localStorage.getItem(PLOTS_KEY); } catch (e) { return null; }
  });
}

// Full rebuild of the world each tick: reconciliation (create/update/remove by
// identity key, nothing rebuilt wholesale) is a later phase's work. What this
// phase guarantees is that the *coordinates* handed to whatever draws them
// never move except on first placement — that guarantee lives entirely in
// plots.js and is unaffected by how the DOM is currently populated.
function drawWorld(s) {
  if (!window.CCWATCH_PLOTS) return null;
  const model = buildWorldModel(s);
  const placed = CCWATCH_PLOTS.place({districts: model.tree, now: Math.floor(Date.now() / 1000)});
  CCWATCH_PLOTS.save(function (v) {
    try { localStorage.setItem(PLOTS_KEY, v); } catch (e) { /* unavailable — plots.js records it */ }
  }, placed.liveKeys);

  const camera = $("camera");
  const districtWanted = {};
  for (const k in placed.world.districts)
    districtWanted[k] = {geo: placed.world.districts[k], meta: model.districtsByKey[k]};
  reconcile(camera, districtWanted, "district", makeDistrict, updateDistrict);

  const buildingWanted = {};
  for (const k in placed.world.buildings)
    buildingWanted[k] = {geo: placed.world.buildings[k], meta: model.buildingsByKey[k]};
  reconcile(camera, buildingWanted, "building", makeBuilding, updateBuilding);

  const zoneWanted = {};
  for (const k in placed.world.zones)
    zoneWanted[k] = {geo: placed.world.zones[k], meta: model.zonesByKey[k]};
  reconcile(camera, zoneWanted, "zone", makeZone, updateZone);

  const figureWanted = {};
  for (const k in placed.world.figures) {
    const row = model.figuresByKey[k];
    if (row) figureWanted[k] = {geo: placed.world.figures[k], row};
  }
  reconcile(camera, figureWanted, "figure", makeFigure, updateFigure);

  // Recomputed only when the occupied set changes (placed.sig) or on resize
  // (see applyFit's own caller below) — never on every tick, since fit() is
  // pure geometry over an extent that mostly doesn't move (FR-019, FR-038).
  if (placed.sig !== lastFit.sig) {
    lastFit = {sig: placed.sig, extent: placed.extent};
    applyFit(placed.extent);
  }
  // Carried alongside `placed` so wires() can resolve a session name to its
  // figure's world centre without re-walking the payload (T052).
  placed.figuresByKey = model.figuresByKey;
  return placed;
}

// ---- fit ---------------------------------------------------------------
// The world's viewBox is fixed to the SVG element's own pixel size (so 1
// world unit == 1 screen px), and `<g id="camera">` carries the
// translate+scale that centres the occupied extent in it — never the SVG's
// own viewBox scaling, which can't express the max-scale clamp (F2).
let lastFit = {sig: null, extent: null};
function applyFit(extent) {
  const world = $("world");
  const vw = world.clientWidth, vh = world.clientHeight;
  if (!vw || !vh) return;
  world.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
  const {k, tx, ty} = CCWATCH_PLOTS.fit(extent, vw, vh);
  $("camera").setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);
}

// ---- draw ------------------------------------------------------------------
// data-model.md §5 — the page's trust model. Computed fresh every tick from
// the read outcome and the payload fields it produced, and from nothing
// else: there is no flag to latch and no reload needed to clear one
// (FR-032, R7). `fetchFailure` is the thrown message when the read itself
// failed (a network error or `!res.ok`); otherwise it is null and `s` is a
// parsed body.
function computeFeedCondition(s, fetchFailure) {
  const ca = (s && s.collected_at) || {};
  const dataAge = ca.snapshot != null ? (Date.now() / 1000 - ca.snapshot) : null;
  const unreadable = s ? s.parse_failed : null;
  if (fetchFailure)
    return {trust: "feed_down", reason: fetchFailure, dataAge, unreadable, empty: false};
  if (s.warming)
    return {trust: "warming", reason: null, dataAge: null, unreadable, empty: false};
  if (s.snapshot_ok === false)
    return {trust: "feed_down", reason: s.snapshot_error || s.error || "snapshot failed",
            dataAge, unreadable, empty: false};
  return {
    trust: "ok", reason: null, dataAge, unreadable,
    empty: !s.error && (s.sessions || []).length === 0,
  };
}

// Built once, updated in place (FR-016/V1): sentence (a)/(b) share one node
// because only one of them can be true at a time; (c) and (d) are separate,
// additive nodes (R1) — `renderTrust` toggles each independently rather than
// replacing the whole panel.
const trustEls = (function () {
  const root = $("trust");
  const main = document.createElement("span"); main.className = "main";
  const unreadable = document.createElement("span"); unreadable.className = "unreadable";
  const emptyMsg = document.createElement("span"); emptyMsg.className = "emptymsg";
  root.append(main, unreadable, emptyMsg);
  return {root, main, unreadable, emptyMsg};
})();
function renderTrust(cond) {
  const {root, main, unreadable, emptyMsg} = trustEls;
  if (cond.trust === "feed_down") {
    main.className = "main down";
    main.textContent = `the feed is down: ${cond.reason} — is \`ccwatch serve\` still running? `
      + `showing session data from ${dur(cond.dataAge)} ago`;
  } else if (cond.trust === "warming") {
    main.className = "main warming";
    main.textContent = "taking the first snapshot — no session data has been collected yet";
  } else {
    main.className = "main"; main.textContent = "";
  }
  // R5: absent or null prints nothing, never `0`.
  unreadable.textContent = cond.unreadable > 0
    ? `${cond.unreadable} registry file(s) could not be read — run: ccwatch doctor` : "";
  // (d), verbatim (contracts/page-render.md §1) — never printed alongside
  // (a) or (c) since `empty` is only ever true when `trust === "ok"` (R6).
  emptyMsg.textContent = cond.empty
    ? "No live sessions. After a reboot, run ccwatch resume." : "";
  root.className = (main.textContent || unreadable.textContent || emptyMsg.textContent) ? "on" : "";
}

// The age of the data, not the age of the request: computed from the
// absolute collected_at instants in the body we hold, never from a stored
// `ages` value, so a repaint after a 304 or a resumed collection still shows
// the true elapsed time rather than freezing it at the moment the body
// arrived.
// Built once, updated in place (FR-016/V1): four persistent nodes — the
// three normal bits (updated-at, staleness, edge count) each with their own
// leading " · " separator so an absent bit leaves no dangling dot.
const footEls = (function () {
  const root = $("foot");
  const updated = document.createTextNode("");
  const staleSep = document.createTextNode("");
  const stale = document.createElement("span"); stale.className = "stale";
  const edgesSep = document.createTextNode("");
  const edges = document.createElement("span");
  root.append(updated, staleSep, stale, edgesSep, edges);
  return {root, updated, staleSep, stale, edgesSep, edges};
})();
function repaintFooter(cond) {
  // Nothing has ever been collected: the trust banner (b) says so and there
  // is nothing else to state here.
  if (cond.trust === "warming") {
    footEls.updated.textContent = "";
    footEls.staleSep.textContent = ""; footEls.stale.textContent = "";
    footEls.edgesSep.textContent = ""; footEls.edges.textContent = "";
    return;
  }
  footEls.updated.textContent = "updated " + new Date().toLocaleTimeString();
  // R3: marked stale with the measured age, recomputed every repaint —
  // shared with the (a)/(c) trust sentences' own `dataAge`.
  if (cond.dataAge > 10) {
    footEls.staleSep.textContent = " · ";
    footEls.stale.textContent = `sessions ${dur(cond.dataAge)} behind`;
  } else {
    footEls.staleSep.textContent = "";
    footEls.stale.textContent = "";
  }
  const total = (lastBody && lastBody.peers && lastBody.peers.edges)
    ? lastBody.peers.edges.length : 0;
  const drawn = lastDrawn;
  if (total > drawn) {
    footEls.edgesSep.textContent = " · ";
    footEls.edges.textContent = `${drawn}/${total} message edges drawn — the rest involve sessions`
            + ` that have exited (see the table view)`;
  } else {
    footEls.edgesSep.textContent = "";
    footEls.edges.textContent = "";
  }
}

// Draws (or redraws) from whatever body is currently trusted enough to show —
// a fresh one on a successful tick, or the retained one on a failed/warming
// tick — with `VOLATILE` set first so every primitive it calls withholds (or
// restores) the same readings this same tick (FR-032, R4, R7).
function applyFeed(s, cond) {
  VOLATILE = cond.trust === "ok";
  CAN_KILL = !!s.can_kill;

  // Keyed by identity (data-model.md §2), not by project/severity, so the
  // map does not reorder or reshape itself for any reason other than an
  // identity actually appearing or disappearing.
  lastRows = {};
  for (const r of (s.sessions || [])) lastRows[r.sid] = r;
  // If the inspector is open, keep its question panel current — a dialog
  // answered elsewhere should stop being shown here.
  if (target && lastRows[target.sid]) {
    renderAsk(lastRows[target.sid]);
    const row = lastRows[target.sid];
    $("imeta").textContent = [row.repo, row.branch, row.token].filter(Boolean).join(" · ");
  }

  // R2/R8: districts/buildings/zones stay drawn through (a)/(b)/(c) — a
  // failure never presents as an empty city. In (b) there is nothing yet to
  // have drawn, which `buildWorldModel`'s `s.sessions || []` already covers.
  const placed = drawWorld(s);
  const buildingCount = placed ? Object.keys(placed.world.buildings).length : 0;
  updateGauges(s.usage);
  hostwarn(s.host);
  const drawn = wires(s.peers, placed) || 0;

  updateCounts(s, buildingCount);

  lastDrawn = drawn;
  renderTrust(cond);
  repaintFooter(cond);
}

let lastEtag = null, lastBody = null, lastDrawn = 0;
async function tick() {
  try {
    const res = await fetch("/api/state", lastEtag ? {headers: {"If-None-Match": lastEtag}} : {});
    if (res.status === 304) {
      if (lastBody) applyFeed(lastBody, computeFeedCondition(lastBody, null));
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastEtag = res.headers.get("ETag");
    const s = await res.json();
    lastBody = s;
    applyFeed(s, computeFeedCondition(s, null));
  } catch (e) {
    // A dead feed is stated, not left to look like an empty city (R2): the
    // last trusted body, if any, is redrawn with every VOLATILE reading
    // withheld rather than dropped from the page entirely.
    const cond = computeFeedCondition(lastBody, e.message);
    if (lastBody) applyFeed(lastBody, cond);
    else { VOLATILE = false; renderTrust(cond); }
  }
}
// A page that becomes visible fires once immediately rather than waiting out
// whatever was left of the old interval. A hidden (backgrounded) tab does no
// periodic work of any kind — including the open conversation's own cadence.
function resume() {
  if (document.hidden) {
    clearEvery("tick");
    clearEvery("convo");
    return;
  }
  tick();
  every("tick", 3000, tick);
  // The transcript inspector, if open, follows the same visibility rule.
  if (target) every("convo", 5000, loadConvo);
}
document.addEventListener("visibilitychange", resume);
resume();
// A resize refits the same extent alone — no refetch, no coordinate moves
// (research.md D9, FR-049). Not while hidden — a backgrounded tab does not
// resize.
addEventListener("resize", () => {
  if (!document.hidden && lastFit.extent) applyFit(lastFit.extent);
});
</script>
</body>
</html>
