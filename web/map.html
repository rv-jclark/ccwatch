<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccwatch · map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234ec9a5'/%3E%3C/svg%3E">
<style>
  /* The same palette and the same words as the table view and the terminal.
     A second visualisation that invents its own vocabulary for the same states
     is a second thing to learn, and two things to keep in sync. */
  :root {
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --ink:#e6e9ef; --dim:#8b93a3;
    --ok:#4ec9a5; --warn:#e3b341; --bad:#f07171; --block:#c586e8; --info:#5fa8e8;
    --ground:#12161d;
    /* The pixel art's outline and eyes, and the grass behind the owner blocks
       (a data: URL painted from web/sprites.js at load, so no image is ever
       fetched). */
    --px-line:#07080b; --px-cast:rgba(0,0,0,.45);
    --grass:var(--px-grass-dark, none); --floor:var(--px-floor-dark, none);
    --hedge:var(--px-hedge-dark, none); --rug:var(--px-rug-dark, none);
    --wall:var(--px-wall-dark, none); --wall-scorched:var(--px-wallScorched-dark, none);
    --rugfield:var(--px-rugfield-dark, transparent);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#eef1f5; --panel:#fff; --line:#dfe3ea; --ink:#1a1d23; --dim:#6b7280;
            --ok:#0f8a63; --warn:#8a5d00; --bad:#c0392b; --block:#7c3aed; --info:#1f6fb2;
            --ground:#f6f8fb; --px-line:#1a1d23; --px-cast:rgba(60,48,30,.18);
            --grass:var(--px-grass-light, none); --floor:var(--px-floor-light, none);
            --hedge:var(--px-hedge-light, none); --rug:var(--px-rug-light, none);
            --wall:var(--px-wall-light, none); --wall-scorched:var(--px-wallScorched-light, none);
            --rugfield:var(--px-rugfield-light, transparent); }
    /* ⚠️ Two text tokens darkened on the board, and only there. Printed on
       the daylight grass, --dim measured 4.49:1 — under the 4.5 that small
       text needs — and --ok about 4.1 on every ground (it was 4.4 on the old
       white panel, so already short). tests/run.sh computes every text
       token against every ground in web/sprites.js, so a palette change
       that makes a label unreadable fails there, not in somebody's eyes.
       ⚠️ On #board, not #boardinner: the suite finds #boardinner's layout
       rule as the FIRST `#boardinner {` in the file, and this one, above it,
       took its place and failed the wire overlay's positioning check. */
    #board { --dim:#5f6673; --ok:#0c7a57; }
  }
  * { box-sizing:border-box; }
  /* ⚠️ The page fills the viewport and does NOT scroll; the map takes whatever
     height the chrome leaves. `#world` used to be `calc(100vh - 8rem)`, and
     8rem was a guess at the chrome that ignored three of its four parts — the
     host-pressure banner (which only appears sometimes, so the guess was wrong
     only sometimes), the legend and the footer. Measured: 223px of chrome
     against a 128px allowance, so the page scrolled by 258px and the map was
     shorter than the space available to it. A flex column cannot be wrong
     about a height it never has to predict.

     ⚠️ The chrome is now the same height whatever the machine is doing, which
     is a separate property and is asserted separately (verify-ui). The
     sometimes-appearing banners are gone: the conditions they carried live in
     the header's alert control and its popover, neither of which is in this
     column's flow. See the top of web/alerts.js for what each banner cost the
     board, measured. */
  html, body { height:100%; }
  /* ⚠️ The board is laid out in `rem` — `.agent` is 4.4rem wide, the gaps and
     the card padding likewise — so the root size is the one knob that fits
     more agents into a small window without touching a single layout rule.
     At 13px a figure is 57px instead of 70px, which is one more per row at
     overlay width; at 12px, two. Anything sized in `px` deliberately does not
     scale with it: borders stay 1px and the smallest labels keep their
     legibility floor rather than shrinking into noise. */
  @media (max-width:720px) { html { font-size:12px; } }
  @media (max-width:520px) { html { font-size:11px; } }

  /* ⚠️ The dense board, for the overlay. The root size above only reaches what
     is written in `rem`, and every LABEL on this board is in `px` — 14px for
     an owner, 12px for a repo, 10px for a branch — so they stayed full size
     while the layout around them shrank, which is why an org heading looked
     enormous next to a 12px board. These are the px ones, explicitly.
     8px is the floor and it is deliberate: `.alabel` is a two-character
     session suffix, and the whole reading is in the modal and the table. Going
     below that trades a fact for a pixel. */
  /* ⚠️ Every selector here is qualified with `#boardinner`, and that is not
     tidiness. This block sits ABOVE the base rules it overrides, and a bare
     `.dlabel { font-size:11px }` loses to the `.dlabel { font-size:14px }`
     further down the sheet — same specificity, later wins. Measured: the owner
     heading stayed at 14px with this whole block in force. The header made the
     identical mistake once (see `header .gauges`) and was fixed the same way,
     for the stated reason that specificity cannot be undone by moving a rule
     whereas source order can. */
  @media (max-width:720px) {
    #boardinner .dlabel { font-size:11px; }
    #boardinner .blabel { font-size:10px; }
    #boardinner .zlabel { font-size:9px; }
    #boardinner .alabel { font-size:8px; }
    #boardinner .norepo-badge,
    #boardinner .wreck-badge,
    #boardinner .deploy-badge { font-size:9px; }
    #boardinner .wire text { font-size:8px; }
    /* And the space between things, which at this size is most of the board.
       A single grid column too: `minmax(min(280px,100%), 1fr)` already gives
       one at 470px, but saying so stops the 280px floor deciding anything. */
    #board #boardinner { gap:.5rem; }
    /* The frames at 1x, still whole pixels: a 32px wall is a seventh of an
       overlay-width card. */
    #boardinner .district { padding:.35rem .4rem; border-width:7px 3px 3px;
                            border-image-width:7px 3px 3px; background-size:16px 16px; }
    #boardinner .building { border-width:16px 4px 4px; border-image-width:16px 4px 4px;
                            background-size:16px 16px; box-shadow:0 2px 0 var(--px-cast); }
    #boardinner .zone { border-width:2px; border-image-width:2px; }
    #boardinner .dhead { margin-bottom:.3rem; gap:.4rem; }
    /* ⚠️ The track floor drops to 150px so repos SHARE a row. The base rule
       reserves 280px per card, and two of those do not fit in a 470px overlay,
       so every repo took a row of its own — `rv-jclark/ccwatch` and
       `rv-jclark/speckit-pipeline` stacked when they had room to sit side by
       side. (An earlier version of this block said `1fr`, which forced the
       single column outright; that was mine, and it was worse.)
       150px is what a card needs to stay useful: three figures per row at
       3.2rem plus its padding. The slug and the branch ellipsise instead —
       identity truncates, which is the same trade the roster rows make, and
       the status words and measurements inside never do. */
    #boardinner .buildings {
      gap:.35rem;
      grid-template-columns:repeat(auto-fit, minmax(min(150px, 100%), 1fr));
    }
    #boardinner .building { padding:.3rem .35rem; }  /* frame: see above */
    /* The branch floor drops with the figures, for the reason the repo floor
       does above: 7.75rem is still two 3.2rem figures and the rug round them. */
    #boardinner .zones { gap:.25rem;
      grid-template-columns:repeat(auto-fit, minmax(min(7.75rem, 100%), 1fr)); }
    #boardinner .zone { padding-left:.3rem; }
    #boardinner .figures { gap:.1rem; }
    #boardinner .agent { width:3.2rem; padding:.05rem .1rem .1rem; }
    /* No .figure override: it is sized in rem, so the 12px root above already
       makes it 24px here, which is what "denser" means for the art. */
  }
  @media (max-width:520px) {
    #boardinner .dlabel { font-size:10px; }
    #boardinner .blabel { font-size:9px; }
    #boardinner .agent { width:3rem; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         display:flex; flex-direction:column;
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header, #idlemsg, #foot { flex:none; }
  /* min-height:0 so the map can be SHORTER than its content wants; without it
     a flex item refuses to shrink below its intrinsic height and the overflow
     comes straight back. */
  #stage { flex:1 1 auto; min-height:0; }
  #wrap { flex:1 1 auto; min-width:0; display:flex; }
  /* ⚠️ Two columns, not one wrapping flex row. The meter has to sit level
     with the title, and it also must not move the board when a reading is
     withheld; a shared flex row gives you either but not both, because
     whether the meter fits beside the title depends on what is in it. A grid
     decides the columns up front: the title, the view switcher and the alert
     control on the left, the meter on the right, both starting at the top so
     their first lines are level. The header is then as tall as the taller
     column, the meter's column has a reserved minimum, and nothing wraps
     between the two. */
  header { display:grid; grid-template-columns:minmax(0, 1fr) auto;
           align-items:start; gap:1rem; position:relative;
           padding:.9rem 1.1rem; border-bottom:1px solid var(--line); }
  .hleft { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
           min-width:0; }
  /* ⚠️ Below 1000px the two columns stack into rows, and that number is not
     the roster's 720px breakpoint on purpose: the meter's column reserves
     45em (see .gauges), so between 720px and 1000px the title's column would
     be squeezed to a couple of hundred pixels and wrap into five or six
     lines. Stacked, each row's height is still independent of the reading,
     which is the property being protected. */
  @media (max-width:1000px) {
    header { grid-template-columns:minmax(0, 1fr); }
    /* ⚠️ And the width reservation goes with the columns. 45em is 585px, so
       keeping it at 420px would make the header wider than the window — and
       `body` is overflow:hidden here, so the far end would be clipped and
       unreachable rather than scrollable. A reservation that hides a reading
       is worse than the shift it prevents. */
    /* ⚠️ `header .gauges`, not `.gauges`. The plain selector lost to the
       `.gauges` rule further down the stylesheet — same specificity, later
       wins — so the reservation stayed in force at 420px and the header
       measured 603px of content in a 420px window. Specificity rather than
       source order, so moving either rule cannot bring the bug back. */
    header .gauges { min-width:0; }
  }
  /* ⚠️ Below the roster's breakpoint the alert slot leaves the flow entirely.
     In a ~470px overlay there is no arrangement that keeps all three of: no
     reserved row, the condition stated in words, and a header height that does
     not depend on the machine. `min-width:12ch` buys the third by wrapping the
     slot onto a line of its own IN BOTH STATES — so a quiet machine pays a row
     out of ~630px for a control that is usually hidden. Dropping the
     reservation instead lets the trigger ellipsise into whatever the title
     line has left, which at this width can be nothing: an alert that shrinks
     to invisible is the failure-as-an-absence of constitution IV.
     Out of flow resolves it, and it is what rule 12 already asks for: the
     chip is positioned over the header's first line, so it costs no row in
     either state and its arrival cannot move the board. It keeps its WORDS —
     the severity word leads the trigger's own text, ellipsised — and the whole
     sentence stays in the popover, the `title` attribute and the accessible
     name. Never a bare glyph, and never a hover as the only route to it. */
  @media (max-width:720px) {
    /* ⚠️ The chip is out of flow, so it reserves nothing — and the nav ran
       UNDER it: "show agents" was half-hidden behind "! host under memory
       press…". Out of flow fixed the height problem and created an overlap
       one, so the space has to be given back explicitly. `.hleft` reserves
       exactly the chip's own maximum, so they cannot collide whatever the
       alert says, and the reservation is a constant — it does not depend on
       whether anything is wrong, which is the property that keeps the
       header's height independent of the machine. */
    #alertslot { position:absolute; right:.7rem; top:.5rem;
                 max-width:min(40%, 20ch); min-width:0; z-index:2; }
    .hleft { padding-right:min(40%, 20ch); }
    /* And the header itself is tighter. At overlay size its padding and the
       gap between its rows were a visible fraction of the window. */
    header { padding:.45rem .7rem; gap:.35rem; }
    .hleft { gap:.5rem; }
    /* ⚠️ And the counts go, to make room for it. They are the one thing in
       this header that is repeated verbatim two lines down — the roster's own
       title says "agents · 19" and stays visible even when the roster is
       folded — so this loses no fact, where clipping the alert would. */
    #counts { display:none; }
  }
  /* ⚠️ The alert slot's size must not depend on what is in it. A slot that
     collapsed when the machine was quiet would let the trigger's arrival
     re-wrap the header — the same reflow the banners were removed to stop,
     moved up one element.
     ⚠️ But it must not demand a fixed width either, which is what it did
     first: `width:min(30ch, 34vw)` is 234px at this font, and the header's
     free space between the view switcher and the right-aligned gauges was
     measured at 75px on a six-session fixture at 1180px. So the reservation
     itself wrapped the header — 52px to 86px, permanently, taking 35px off the
     board. That trades an intermittent shove for a constant one, which is not
     a fix.
     `flex:1 1 0` asks for nothing and grows into whatever the line has left,
     so the slot is the same width whether it holds a trigger or not, at any
     viewport — and when the line is too crowded even for `min-width`, it wraps
     in BOTH states, so the header's height still does not depend on the
     machine. The button inside ellipsises; the whole sentence is in the
     popover, the title and the accessible name. */
  #alertslot { flex:1 1 0; min-width:12ch; display:flex;
               align-items:baseline; }
  /* Hidden, not removed (see above). visibility:hidden also takes it out of
     the tab order and out of the accessibility tree, so there is no empty
     control to land on — a quiet machine has no alert control at all as far
     as a reader or a keyboard is concerned (principle XII). */
  #alertslot.quiet #alertbtn { visibility:hidden; }
  #alertbtn { max-width:100%; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; background:none; font:inherit; font-size:11px;
              line-height:1.2; padding:.1rem .45rem; border-radius:4px;
              cursor:pointer; border:1px solid currentColor; }
  /* Severity is a word in the trigger's own text; these only tint it. */
  #alertbtn.bad { color:var(--bad); }
  #alertbtn.warn { color:var(--warn); }
  #alertbtn.info { color:var(--dim); }
  /* The popover. A <dialog> in the top layer, anchored under its trigger at
     open time rather than at a guessed offset from the top of the page, for
     the reason the map key is one: the browser supplies the focus move, the
     focus restore, Escape, and a stacking context above everything — and
     `dialog:not([open])` means the closed panel occupies nothing. It is
     position:fixed and margin:0 so it cannot contribute to the flex column's
     height either open or closed. */
  /* ⚠️ `left:auto`. The UA stylesheet gives a dialog `left:0; right:0`, so
     setting only `right` leaves the box stretched from the left edge and
     `max-width` then resolves it at x=0 — the panel rendered hard against the
     left of the window instead of under its trigger, 288px away from it.
     Found by looking at a screenshot; the geometric check now asserts the
     panel's right edge tracks the trigger's. */
  dialog#alertmodal { position:fixed; left:auto; margin:0; max-width:min(560px, 92vw);
           background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:.7rem; color:var(--ink);
           box-shadow:0 8px 40px rgba(0,0,0,.5); overflow:auto; }
  dialog#alertmodal[open] { display:flex; flex-direction:column; gap:.5rem; }
  #alertmodal::backdrop { background:rgba(0,0,0,.35); }
  #alerthead { display:flex; align-items:baseline; justify-content:space-between;
               gap:.6rem; padding-bottom:.4rem; border-bottom:1px solid var(--line); }
  #alertmodal button.ghost { background:none; border:1px solid var(--line);
               color:var(--dim); font:inherit; font-size:11px; padding:.1rem .45rem;
               border-radius:4px; cursor:pointer; }
  #alertlist { display:flex; flex-direction:column; gap:.45rem; font-size:12px; }
  /* Each sentence wraps rather than truncating: these are the measurements
     behind the verdicts, and a clipped measurement is worse than a long line
     (principle II). */
  .alertitem { overflow-wrap:anywhere; }
  .alertitem.bad { color:var(--bad); }
  .alertitem.warn { color:var(--warn); }
  .alertitem.info { color:var(--dim); }
  /* Not an alert: the machine is idle. It says so in flow, where it can only
     ever appear when there is nothing on the board to push down. */
  #idlemsg { display:none; padding:.45rem 1.1rem; font-size:12px; color:var(--dim); }
  #idlemsg.on { display:block; }
  h1 { font-size:15px; margin:0; }
  h1 span { color:var(--dim); font-weight:400; }
  nav a { color:var(--dim); text-decoration:none; margin-right:.75rem; font-size:12px; }
  nav a.on { color:var(--ink); font-weight:600; }
  /* ⚠️ The meter's height is RESERVED, whether or not there is a reading in
     it. A usage reading is withheld whenever it goes stale (past
     CCWATCH_USAGE_STALE) or the feed stops being trusted, and it comes back on
     the next good snapshot — so without this the header measured 89px with a
     reading and 52px without one, and the board shifted 37px up and back down
     every time a statusline went quiet for ten minutes. That is the banner
     problem again, one element over: a view whose geometry depends on whether
     a reading arrived cannot be compared against itself.
     4.8em, in em so the reservation scales with the text rather than being
     pinned to one font size. Measured: the block is 57.6px here (13px font)
     and 64.0px in the table view (14px font), so the same 4.8em clears both
     with a few px to spare — 4.5em did not, and left the table view moving by
     1px. It is a floor, not a height: at narrow widths the gauges still wrap
     and the header still grows, in every usage state alike. verify-ui
     asserts the consequence on both views, which is what makes a measured
     number here safe. */
  /* ⚠️ The meter's own column is the header's second grid column (see the
     header rule), so it is level with the title and cannot wrap around it.
     It took three attempts to get here, and the two that failed are worth
     keeping: reserving the height alone left the header at 127px with a
     reading and 90px without, because what changed was whether the blocks
     WRAPPED and not the height of a row; giving the meter a row of its own
     fixed that and left an 85px gap under the title, which reads as a
     mistake. Columns decide the layout up front, so neither can happen.
     Measured across the three usage states — a reading, a withheld stale
     reading, and no usage at all — the header comes out the same height at
     1180px and at 900px. Below roughly 720px the columns stack and the three
     blocks wrap among THEMSELVES, and there the guarantee stops holding:
     measured 248px with a reading against 187px without, at 420px.
     Stabilising that would mean reserving ~180px of a phone screen for a
     meter that is usually one line, which is a worse trade than the shift.
     The boundary is stated here and in docs/DESIGN.md rather than papered over,
     and verify-ui asserts the two widths where it does hold. */
  /* ⚠️ min-WIDTH as well as min-height, and this was the third fix, not the
     second. With the column sized to its contents, a withheld reading made it
     297px instead of 576px — which widened the title's column beside it, so
     the title re-wrapped and the header still changed height: measured 108px
     with a reading against 92px without, at 900px. The height was stable and
     the WIDTH was not.
     45em against a meter measured at 44.3em here (576px at 13px) and 43.4em
     in the table view (607px at 14px), so one value clears both. Reserving
     the widest state is the point: the column is then the same width whether
     it holds three gauges or a one-line note, and nothing beside it re-wraps. */
  .gauges { display:flex; gap:1.1rem; align-items:flex-start;
            flex-wrap:wrap; justify-content:flex-end;
            min-height:4.8em; min-width:45em; }
  /* ⚠️ Narrow, a gauge lays itself out across the FULL width instead of
     stacking three lines in a right-aligned column: the numbers on the left of
     the first line, when it resets pushed to the right of it, and the bars
     spanning the second. That is one line saved out of a ~630px overlay, and
     the reset instant stops sitting under a 78px bar with the rest of the
     width empty beside it.
     Grid areas rather than reordering the DOM: the source order is head, bars,
     reset — the order it is read in — and `grid-template-areas` places them
     without touching it, so the tab order and the reading order stay as they
     were. */
  @media (max-width:720px) {
    header .gauges { width:100%; gap:.3rem; min-height:2.9em; }
    header .g-gauge { display:grid; width:100%;
                      grid-template-columns:1fr auto;
                      grid-template-areas:"head reset" "bars bars";
                      column-gap:.5rem; }
    header .g-head   { grid-area:head; }
    header .g-reset  { grid-area:reset; justify-self:end; align-self:baseline;
                       white-space:nowrap; }
    header .g-barrow { grid-area:bars; }
  }
  .g-label { color:var(--dim); } .g-val { font-weight:600; }
  .g-reset { color:var(--dim); font-size:11px; }
  /* One gauge: the numbers, then the two bars, then when it resets. */
  .g-gauge { display:flex; flex-direction:column; gap:2px; }
  .g-head { display:flex; gap:.4rem; align-items:baseline; }
  /* ⚠️ The two bars share one width and one scale, stacked with the
     consumption on top and the clock directly beneath it. That is the whole
     instrument: 41% used means nothing until you can see whether 41% of the
     window has gone with it. Different widths, or side by side, and the
     comparison stops being a glance. */
  .g-barrow { display:flex; align-items:center; gap:.4rem; }
  .g-bars { display:flex; flex-direction:column; gap:2px; width:78px; flex:none; }
  .g-bar { height:4px; border-radius:2px; overflow:hidden;
           background:color-mix(in srgb, var(--ink) 14%, transparent); }
  .g-bar > i { display:block; height:100%; }
  /* Severity by threshold, as everywhere else. The word is on the number
     beside it, so the colour is never carrying this alone. */
  .g-used.ok > i   { background:var(--ok); }
  .g-used.warn > i { background:var(--warn); }
  .g-used.bad > i  { background:var(--bad); }
  /* The clock bar is deliberately neutral: it is a reference, not a verdict,
     and colouring it would invite reading the pair as two severities. */
  .g-time > i { background:var(--dim); }
  .g-elapsed { color:var(--dim); }
  .g-pace { color:var(--warn); font-weight:600; }
  .stale { color:var(--warn); }

  /* The map itself: a scrolling column of owner sections, each holding a grid
     of repo cards, each holding its branches and the figures standing in them.
     Ordinary block layout, so the browser does the placement and the browser's
     own scrollbar does the navigation.

     ⚠️ This replaced a pan-and-zoom SVG camera, and the reason was not
     performance — it was that the camera could not be relied on to show you
     your agents. Measured on a real eight-session machine: the default view
     had 1 of 4 territories fully visible and 2 of 8 sessions entirely
     off-screen, one of them the session running ccwatch itself. `verify-ui`
     was green throughout, because what it asserted was that *an* agent was
     visible. A view whose honest reading is "some of your agents are somewhere
     off to the bottom-right" is worth less than a list. Flow layout cannot
     lose a territory: everything is in the scroll content, and the scrollbar
     says how much of it there is.

     A force-directed graph was considered for the original and is still worse:
     with a dozen nodes it moves every time you look at it, and "did that agent
     move or did I misremember" is not a question a monitoring view should
     raise. Alphabetical order in flow answers it permanently. */
  #wrap { position:relative; padding:0; }
  /* The one scroll container, and the only scrollbar on the page — `body` is
     still `overflow:hidden`. min-height:0 lets a flex child that scrolls
     shrink below its content; the declaration that actually keeps the PAGE
     from scrolling is #stage's, measured — removing this one alone did not
     reproduce a page scroll, removing #stage's did. overscroll-behavior keeps
     a wheel that reaches the end from turning into a page or history gesture.

     ⚠️ `overflow:auto`, on BOTH axes, not `overflow-x:hidden`. The layout below
     is built so nothing overflows sideways — min-width:0 and an ellipsis on
     every long label, and a grid whose columns collapse to one at narrow
     widths — but if something ever does, `hidden` would clip it and the
     clipped part would be unreachable at every scroll position. That is a
     failure presenting as an absence, which is the thing this tool is not
     allowed to do. `auto` shows a scrollbar instead: the same bug, but
     visible and navigable. verify-ui asserts that at its own width nothing
     actually overflows, so the fallback stays a fallback. */
  #board { flex:1 1 auto; min-width:0; min-height:0; overflow:auto;
           overscroll-behavior:contain; padding:1.1rem; }
  #board:focus-visible { outline:2px solid var(--info); outline-offset:-2px; }
  /* position:relative is load-bearing: #wires is positioned against this box,
     so it scrolls with the content for free and needs no scroll listener.
     Being out of flow, it never feeds back into this box's own size. */
  #boardinner { position:relative; display:flex; flex-direction:column; gap:1.1rem; }

  /* The wire overlay. pointer-events:none so it never swallows a click meant
     for a figure underneath it. */
  #wires { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  .wire path { stroke-width:calc(var(--wire-w, 1) * 1px); }
  /* Drawn only for the figures being looked at (web/comms.js), so this is
     the one place age is shown: today's traffic strong, older history faint
     but present, because hovering a figure asked for all of it. */
  .wire path { opacity:.32; }
  .wire.recent path { opacity:.85; }
  .wire text { font-size:9px; }

  /* An owner: the outermost grouping, one per org, plus "no repo". */
  /* The world, in the three-quarter view of a 16-bit Zelda: every frame is a
     9-slice painted by web/sprites.js, and every one is TALLER AT THE TOP,
     because only a north wall shows its face. Each is drawn at exactly 2x its
     art (the slice numbers are art pixels, the widths are twice them), so a
     pixel of hedge is the same size as a pixel of character.
     ⚠️ Decoration on flow layout, never a scene the layout is fitted into.
     A border-image paints round whatever box the browser produced, so the
     board is still the scrolling list that cannot lose a session.

     An owner is a field of grass fenced by a hedge. The grass is texture,
     not contrast: its two shades are a few percent apart because the owner's
     name and summary are printed on top of it. */
  .district { border:solid transparent; border-width:14px 6px 6px;
              border-image:var(--hedge) 7 3 3 3 / 14px 6px 6px repeat;
              background-color:var(--ground); background-image:var(--grass);
              background-size:32px 32px; background-clip:padding-box;
              image-rendering:pixelated; padding:.55rem .75rem .7rem; }
  .dhead { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap;
           margin-bottom:.6rem; }
  .dlabel { font-size:14px; color:var(--ink); font-weight:600; }
  /* ⚠️ Always rendered, not only when zoomed out. This aggregate used to be
     the far-zoom *substitute* for the detail, so at every other zoom the
     session count, the worst status and the unfinished-run summary were simply
     not on the page. They are facts about the territory at any scale. */
  .dsummary { font-size:11px; color:var(--dim); }
  /* ⚠️ auto-fit, not auto-fill. auto-fill keeps the empty columns it created,
     so an owner with one repo rendered a ~400px card beside ~400px of nothing
     — and since most owners here have exactly one repo, half the width of the
     view was dead space. auto-fit collapses the empty tracks and the single
     card takes the row. Card widths then differ between owner sections, which
     is the trade and is fine: each section is its own visual unit, and the
     alternative was spending half the viewport to make them line up.
     min(280px,100%) so a narrow window gets one full-width column rather than
     a 280px card with the rest of the row hanging off the side. */
  .buildings { display:grid; gap:.6rem;
               grid-template-columns:repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }

  /* A repo. */
  /* A repo is a room in cutaway: its brick north wall and the wall's shadow
     across the top, stone caps round the rest, planks underfoot. */
  .building { border:solid transparent; border-width:32px 8px 8px;
              border-image:var(--wall) 16 4 4 4 / 32px 8px 8px repeat;
              /* The room's shadow on the grass to its south, one art pixel
                 deep: what makes it stand ON the field rather than float. */
              box-shadow:0 4px 0 var(--px-cast);
              background-color:var(--panel); background-image:var(--floor);
              background-size:32px 32px; background-clip:padding-box;
              image-rendering:pixelated;
              padding:.5rem .6rem; min-width:0; }
  /* ⚠️ An unfinished run is carried by the wall's SHAPE — cracked, scorched
     bricks — not by a red outline, which a border-image cannot draw anyway:
     `border-color` is ignored under one, so the old rule would have silently
     stopped meaning anything. The words (the wreck badges) are unchanged. */
  .building.has-unfinished { border-image-source:var(--wall-scorched); }
  .bhead { display:flex; align-items:baseline; gap:.4rem; }
  /* min-width:0 with the ellipsis: a repo slug is long, and must not widen the
     grid track past the column it was given. */
  .blabel { font-size:12px; color:var(--ink); min-width:0; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; }
  .norepo-badge { font-size:10px; color:var(--warn); margin-left:auto; flex:none; }
  .badges { display:flex; flex-direction:column; gap:.1rem; margin:.25rem 0; }
  .wreck-badge { font-size:10px; color:var(--bad); }
  .deploy-badge { font-size:10px; color:var(--ok); }

  /* A branch, and the figures standing in it. */
  /* ⚠️ A grid, not a flex column. As a column every branch took the full
     width of its room whatever it held, so a repo with four branches of one
     agent each was four stacked rugs of mostly empty floor — the same dead
     space auto-fit removed one level up, in `.buildings`. auto-fit for the
     same reason as there: a repo with one branch still gets one full-width
     rug. 10.5rem is two figures side by side (2 x 4.4rem, the gap, the rug's
     padding and border) so a rug never narrows to one figure per line; the
     branch name ellipsises first. Rugs in a row share the tallest one's
     height, which is the trade for them lining up. */
  .zones { display:grid; gap:.4rem;
           grid-template-columns:repeat(auto-fit, minmax(min(10.5rem, 100%), 1fr)); }
  /* A branch is a rug on the floor. Its field is a flat colour, not a
     pattern, because the branch's name is printed on it. */
  .zone { border:4px solid transparent; border-image:var(--rug) 2 / 4px repeat;
          background:var(--rugfield); background-clip:padding-box;
          image-rendering:pixelated; padding:.2rem .4rem .25rem; }
  .zlabel { font-size:10px; color:var(--dim); overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; }
  .figures { display:flex; flex-wrap:wrap; gap:.15rem; }

  /* ⚠️ A real <button>. As an SVG `<g role="button" tabindex="0">` this needed
     a hand-rolled focus ring — an SVG group takes no outline — and a keydown
     handler to make Enter and Space do what the role already promised. A
     button needs neither, and cannot get either wrong. */
  /* ⚠️ The width is set by the LABEL, not by the 34px of figure art. At 3.1rem
     it fitted the drawing and clipped the name: `agents-ba` and `agents-62`
     both rendered as `agents…`, which is worse than no label, because two
     different sessions became indistinguishable at a glance. 4.4rem fits the
     eleven characters these names actually run to. */
  .agent { appearance:none; background:none; border:1px solid transparent;
           border-radius:5px; padding:.1rem .15rem .2rem; cursor:pointer;
           color:inherit; font:inherit; display:flex; flex-direction:column;
           align-items:center; width:4.4rem; position:relative; }
  /* The comms marker (web/comms.js, web/sprites.js ENVELOPE). ⚠️ Absolute,
     over the figure's right shoulder, never in the button's flow: it comes
     and goes on its own every couple of minutes, and a figure that grew a row
     when a message arrived would push its whole rug down while somebody was
     reading it (principle XII). pointer-events:none so a click on it is a
     click on the figure. 14x10 is the 7x5 grid at 2x, matching the figure. */
  .agent .comms { position:absolute; top:0; right:.25rem; width:.875rem;
                  height:.625rem; overflow:visible; pointer-events:none; }
  .agent:hover { background:rgba(255,255,255,.06); }
  .agent:focus-visible { outline:2px solid var(--info); outline-offset:1px; }
  /* The selection mark (contracts/page-roster.md §6): a dashed ring, so it
     reads as "picked in the roster" rather than as a status of its own. */
  .agent.selected { border-color:var(--info); border-style:dashed; }
  /* ⚠️ Sized so the art scales with the root size. `figure()` creates the SVG
     with width/height attributes of 32x40, and a viewBox means a CSS size
     overrides them — without this the labels and gaps shrank on a small
     screen while the figures themselves stayed exactly as big, which is most
     of why the board did not get denser.
     ⚠️ In rem, not em. This was 2.125em, commented as "34x38 at the default
     16px root", and it never was: an em here is the BUTTON's font, which is
     the body's 13px, so the figure was 27.6px. verify-ui measured 26px for
     2em. 2rem x 2.5rem is the 16x20 sprite at exactly 2x on the default root
     — a whole number of screen pixels per art pixel, which is what keeps
     pixel art from looking smeared — and verify-ui asserts it. */
  .figure { display:block; overflow:visible; width:2rem; height:2.5rem; }
  .alabel { font-size:9px; color:var(--dim); max-width:100%; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; }
  .agent.sev4 .alabel { color:var(--block); font-weight:600; }
  .agent.sev3 .alabel { color:var(--bad); }
  .agent.sev2 .alabel { color:var(--ink); }

  /* ⚠️ The map key's control lives in the HEADER, not floating over the board.
     As the last survivor of the camera's button cluster it kept that cluster's
     `position:absolute; bottom:1.6rem`, and once the board scrolled under it,
     it sat on top of whatever happened to be at the bottom-left — measured,
     it covered two `implement/CRASHED` badges on a card that had them. A
     floating control needs a reason to float, and a help button that is always
     in the same place does not have one. In the header it cannot overlap
     anything and does not scroll away either. */
  #keyhelp { background:none; border:1px solid var(--line); color:var(--ink);
             font:inherit; font-size:11px; line-height:1.2; padding:.1rem .45rem;
             border-radius:4px; cursor:pointer; margin-left:.1rem; }

  /* There is no level-of-detail rule any more, and that is the point. The old
     map hid buildings, zones, agents and labels below a zoom threshold, which
     is how it shipped a default view that set `display:none` on every figure
     on the page. Nothing here hides a session at any window size. */

  /* Motion is meaning here, not decoration: it is only ever applied to a state
     that is actually changing, so a still figure is a still session.

     ⚠️ `step-end`, not `ease-in-out`. These animate `transform` on an SVG <g>,
     and Chrome cannot promote an SVG group to its own composited layer — so a
     tweened figure re-rasters the whole SVG subtree on the main thread every
     frame, for as long as any session is busy. Measured on an idle map with 3
     busy figures: 4.1% of a core in the renderer plus 3.7% in the GPU process,
     against a 1.5% floor with the animations off. `step-end` holds each pose
     instead of interpolating it, so the style changes twice a cycle rather
     than ~54 times, and the same page costs 2.8% — the motion survives, the
     frame production does not.
     The cost is a cliff, not a slope: 3 animated figures and 7 measured the
     same (4.3% + 3.8%), because the price is 60fps frame production at all,
     not the number of things moving. So thinning out the animations buys
     nothing and only losing the tween does — which is why this is not tuned
     by dropping a rule or slowing a duration. `tilt` at 3.4s cost exactly what
     `bob` at .9s did.

     Every pose is a whole number of art pixels — `1px` here is one cell of
     the 16x20 grid, since an SVG child's px are viewBox units — and nothing
     rotates. A rotated sprite is resampled, and pixel art resampled is a
     blur; a sprite moved by one cell is still pixel art. That is why the
     suspected hang sways a pixel where the old stick figure tilted. */
  @keyframes bob   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-1px)} }
  @keyframes wave  { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-1px)} }
  @keyframes throb { 0%,100%{opacity:.35}               50%{opacity:1} }
  @keyframes sway  { 0%,100%{transform:translateX(0)}   50%{transform:translateX(-1px)} }
  .busy .body { animation:bob .9s step-end infinite; }
  .waiting .arm { animation:wave .7s step-end infinite; }
  .waiting .bubble { animation:throb 1.1s step-end infinite; }
  .hung .body { animation:sway 3.4s step-end infinite; }
  /* A one-cell hop, stepped like everything above and for the same measured
     reason: a tween here would put the board back on 60fps frame production. */
  .comms .env { animation:bob 1.3s step-end infinite; }
  @media (prefers-reduced-motion: reduce) {
    .busy .body, .waiting .arm, .waiting .bubble, .hung .body, .comms .env { animation:none; }
  }

  /* Wreckage: an unfinished run left lying in the territory it belongs to. */
  .wreck { margin-top:.55rem; border-top:1px dashed var(--line); padding-top:.45rem;
           display:flex; flex-direction:column; gap:.25rem; }
  .wreck div { font-size:11px; color:var(--bad); display:flex; gap:.4rem; }
  .wreck .feat { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wreck .cost { margin-left:auto; color:var(--dim); }

  /* ⚠️ A column inside the key dialog, not a strip under the map. As a strip it
     held 73px of viewport permanently to explain something a reader needs once
     and then knows — and the map, which is the thing you actually look at, was
     73px shorter for the whole session because of it. */
  dialog#keymodal { max-width:min(560px, 92vw); background:var(--panel);
           border:1px solid var(--line); border-radius:8px; padding:.8rem;
           color:var(--ink); box-shadow:0 8px 40px rgba(0,0,0,.5); }
  dialog#keymodal[open] { display:flex; flex-direction:column; gap:.6rem; }
  #keymodal::backdrop { background:rgba(0,0,0,.55); }
  #keyhead { display:flex; align-items:baseline; justify-content:space-between;
             gap:.6rem; padding-bottom:.4rem; border-bottom:1px solid var(--line); }
  #keyhelp { min-width:1.9rem; }
  .legend { display:flex; flex-direction:column; gap:.35rem; padding:0;
            color:var(--dim); font-size:11px; }
  .legend b { font-weight:600; }
  footer { padding:0 1.1rem 2rem; color:var(--dim); font-size:11px; }

  /* The inspector: the conversation, then the reply box. Reading before
     writing is the normal order — you rarely want to message an agent without
     first seeing what it is doing. A native <dialog> supplies the focus move,
     the focus trap and the inert background (FR-036, FR-039, D3) — none of
     that is reimplemented here. */
  /* ⚠️ `[open]`. Without it this rule's `display:flex` overrode the user-agent's
     `dialog:not([open]) { display:none }`, so the closed panel rendered in the
     document flow below the map — a chat window sitting under the fold that
     could be seen and not used, and 176px of the page scroll. A <dialog> is
     the one element whose visibility is not this stylesheet's business. */
  dialog#agentmodal { max-width:min(760px, 92vw); max-height:88vh;
           background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:.7rem; gap:.5rem;
           color:var(--ink); box-shadow:0 8px 40px rgba(0,0,0,.5); width:min(560px,94vw); }
  dialog#agentmodal[open] { display:flex; flex-direction:column; }
  #agentmodal::backdrop { background:rgba(0,0,0,.55); }
  #ihead { display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap;
           padding-bottom:.5rem; border-bottom:1px solid var(--line); }
  #iname { font-weight:600; }
  #istatus { color:var(--dim); font-size:11px; }
  #iclose { margin-left:auto; }
  /* #ifeed restates the same feed condition the page prints above the map
     (data-model.md §6) — its own words, never a colour alone. */
  #ifeed .main { display:block; }
  #ifeed .main.down { color:var(--bad); }
  #ifeed .main.warming { color:var(--dim); }
  #ifeed .unreadable { display:block; color:var(--warn); }
  #igone { display:none; color:var(--bad); }
  #igone.on { display:block; }
  /* Two columns — the label is the <dt>, so a reading is never announced
     without what it is (principle VII). */
  #istats { display:grid; grid-template-columns:auto 1fr; gap:.15rem .6rem;
            font-size:12px; margin:0; }
  #istats dt { color:var(--dim); }
  #istats dd { margin:0; }
  #convo { flex:1; overflow-y:auto; font-size:12px; display:flex;
           flex-direction:column; gap:.5rem; padding:.2rem 0; }
  .turn { display:grid; grid-template-columns:64px 1fr; gap:.5rem; }
  .turn .who { color:var(--dim); font-size:10px; text-align:right; padding-top:.1rem; }
  .turn .what { white-space:pre-wrap; word-break:break-word; }
  .turn.said .who { color:var(--info); }
  .turn.said.peer .who { color:var(--block); }
  .turn.assistant .who { color:var(--ok); }
  .turn.system .what, .turn.tool_result .what { color:var(--dim); }
  .turn.system .what { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                       overflow:hidden; }

  /* Rendered markdown. `pre-wrap` comes OFF here — the renderer has turned the
     newlines into blocks, and leaving it on doubles every gap. Everything is
     scoped under .md so an unrendered turn keeps its old appearance exactly. */
  .turn .what.md { white-space:normal; }
  .what.md > *:first-child { margin-top:0; }
  .what.md > *:last-child { margin-bottom:0; }
  .what.md p { margin:.35rem 0; }
  /* ⚠️ Not dimmed. The first cut rendered h5/h6 in --dim, and a heading paler
     than the paragraph under it reads as less important than the paragraph —
     the opposite of what the model meant by it. Size and weight carry the
     level; the colour stays the reading colour. */
  .what.md h4, .what.md h5, .what.md h6 {
    margin:.6rem 0 .3rem; font-weight:600; line-height:1.25; color:var(--ink); }
  .what.md h4 { font-size:14px; }
  .what.md h5 { font-size:13px; }
  .what.md h6 { font-size:12px; }
  .what.md ul, .what.md ol { margin:.3rem 0; padding-left:1.2rem; }
  .what.md li { margin:.1rem 0; }
  .what.md li > ul, .what.md li > ol { margin:.1rem 0; }
  .what.md code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
                  background:var(--ground); border:1px solid var(--line);
                  border-radius:3px; padding:0 .2rem; }
  /* A pasted file is wider than a 560px drawer, so the block scrolls on its own
     axis. Without this one code block widens the whole inspector and every
     turn above it reflows to match. */
  .what.md pre { margin:.4rem 0; padding:.4rem .5rem; background:var(--ground);
                 border:1px solid var(--line); border-radius:4px;
                 overflow-x:auto; max-height:16rem; overflow-y:auto; }
  .what.md pre code { background:none; border:0; padding:0; font-size:11px;
                      white-space:pre; }
  .what.md blockquote { margin:.35rem 0; padding-left:.5rem;
                        border-left:2px solid var(--line); color:var(--dim); }
  .what.md hr { border:0; border-top:1px solid var(--line); margin:.5rem 0; }
  .what.md del { color:var(--dim); }
  /* A URL is shown, never linked — see the note at the top of md.js. Dimmed so
     it reads as provenance rather than as something to click. */
  .what.md .mdurl { color:var(--dim); word-break:break-all; }
  /* ccwatch's own reduction of a tool use or result, not the model's words. */
  .what.md .mdmeta { color:var(--dim); white-space:pre-wrap; margin:.2rem 0; }
  #ifoot { display:flex; gap:.5rem; align-items:center; }
  /* Kill: styled as the destructive action it is, and two-step. A single click
     that ends a four-day-old session mid-task is not an affordance, it is a
     trap. */
  /* Always present — whether or not killing is permitted (FR-028); only
     #killstart's disabled attribute and its reason text change. */
  #killbar { display:flex; flex-direction:column; gap:.35rem; font-size:11px;
             border-top:1px solid var(--line); padding-top:.45rem; }
  #killbar .danger { background:none; border:1px solid var(--bad); color:var(--bad);
                     font:inherit; font-size:11px; padding:.15rem .5rem;
                     border-radius:3px; cursor:pointer; align-self:flex-start; }
  #killbar .danger:hover { background:color-mix(in srgb, var(--bad) 18%, transparent); }
  #killconfirm { display:none; flex-direction:column; gap:.3rem;
                 border:1px solid var(--bad); border-radius:4px; padding:.45rem; }
  #killconfirm.on { display:flex; }
  #killconfirm .row { display:flex; gap:.4rem; align-items:center; }
  #killconfirm b { color:var(--bad); }
  #killout { font-size:11px; }
  #killout.killed { color:var(--ok); } #killout.refused { color:var(--warn); }
  #killout.failed { color:var(--bad); }
  /* The pending question. Given the most prominent place in the inspector
     because it is the reason the session stopped, and the reason you opened
     this panel. */
  #ask { border:1px solid var(--block); border-radius:6px; padding:.55rem .6rem;
         display:none; flex-direction:column; gap:.4rem;
         background:color-mix(in srgb, var(--block) 8%, transparent); }
  #ask.on { display:flex; }
  #ask .q { font-weight:600; color:var(--block); }
  #ask ol { margin:0; padding-left:1.3rem; display:flex; flex-direction:column; gap:.3rem; }
  #ask li::marker { color:var(--block); }
  #ask .odesc { color:var(--dim); font-size:11px; }
  /* Stated, not implied: a sent message is queued behind the dialog, it does
     not answer it. Claiming otherwise would be the worst kind of lie this
     tool could tell — you would think an agent was unblocked when it is not. */
  #ask .how { font-size:11px; color:var(--dim); border-top:1px solid var(--line);
              padding-top:.35rem; }
  #ask code { background:var(--bg); border:1px solid var(--line); border-radius:3px;
              padding:0 .25rem; user-select:all; }
  #ifoot input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink);
                 font:inherit; padding:.4rem .55rem; border-radius:4px; }
  #ifoot input:focus { outline:none; border-color:var(--info); }
  #agentmodal button { background:var(--info); border:0; color:#fff; font:inherit;
                  padding:.4rem .85rem; border-radius:4px; cursor:pointer; }
  #agentmodal button.ghost { background:none; border:1px solid var(--line); color:var(--dim); }
  #agentmodal button:disabled { opacity:.5; cursor:default; }
  #sendwhy { color:var(--dim); font-size:11px; }
  #replyOut { font-size:11px; }
  #replyOut.delivered { color:var(--ok); } #replyOut.queued { color:var(--warn); }
  #replyOut.failed { color:var(--bad); }
  .empty { color:var(--dim); padding:1rem; }

  /* The docked roster panel (contracts/page-roster.md §2). --roster-w is the
     only width writer (D9); setWidth() never touches #roster's own flex-basis
     any other way, so there is exactly one place a width change originates. */
  #stage { display:flex; align-items:stretch; }
  #roster { flex:0 0 var(--roster-w, 320px); overflow-y:auto; min-width:0;
            border-right:1px solid var(--line); padding:.8rem; }
  #rostertitle { font-size:13px; margin:0 0 .5rem; }
  #rosternote { color:var(--warn); font-size:11px; margin:0 0 .5rem; }
  #rostergone { display:none; font-size:12px; margin-bottom:.5rem; }
  #rostergone.on { display:block; }
  #rosterlist { display:flex; flex-direction:column; gap:.3rem; }
  /* ⚠️ Needed because `display:flex` above is an ID selector and the UA
     stylesheet's `[hidden] { display:none }` is not — so setting `.hidden`
     from JS removed the list from the accessibility tree and the tab order
     while leaving it fully laid out. Measured: the folded roster was 1512px
     of a 470px-wide overlay against 1129px of board, worse than before the
     fold existed, because the fold also lifts `max-height`. The assertion on
     `.hidden` passed the whole time — it is a property check, and the property
     was true; what was false was the layout. */
  #rosterlist[hidden] { display:none; }
  /* ⚠️ A COLUMN. This was a row, and with six fields in a 320px panel the
     flex algorithm gave `.rname` and `.rwhere` a computed width of 0 and left
     `.rasks` 102px, so every field wrapped into a four-character ribbon:
     "13h `titl" / "be` c" / "22MB PERKS". The panel was unreadable, and no
     assertion noticed because all 567 of them check structure — roles,
     handlers, module return values — and none renders the page and measures
     it. Stacking is the only layout that holds at every width the divider
     allows, which is what FR-034 actually needs. */
  .rrow { display:flex; flex-direction:column; gap:.1rem; padding:.3rem .4rem;
          border-radius:4px; cursor:pointer; }
  .rrow:hover { background:color-mix(in srgb, var(--ink) 6%, transparent); }
  /* Identity truncates; the status word and its measurement never do — they
     wrap instead, because FR-034 protects them from being cut at any width. */
  .rrow .rname { font-weight:600; }
  .rrow .rname, .rrow .rwhere { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rwhere, .rrow .rmeta { color:var(--dim); font-size:11px; }
  .rrow .rstatus { white-space:normal; overflow-wrap:anywhere; }
  /* The ask is the longest field and the least structured. Two lines of it is
     enough to recognise the question; the modal has the whole thing. */
  .rrow .rasks { color:var(--block); font-size:11px; display:-webkit-box;
                 -webkit-line-clamp:2; -webkit-box-orient:vertical;
                 overflow:hidden; }
  .rrow .rasks:empty { display:none; }
  /* Selection is a word, not only a colour (Constitution VII, D17). */
  .rrow[aria-selected="true"] { background:color-mix(in srgb, var(--info) 16%, transparent); }
  .rrow .rsel { display:none; color:var(--info); font-weight:600; }
  .rrow[aria-selected="true"] .rsel { display:inline; }
  .agent.selected .hit { stroke:var(--info); stroke-width:1.4; stroke-dasharray:2; }
  #rdivider { flex:0 0 6px; cursor:col-resize; touch-action:none; background:var(--line); }
  #rdivider:focus-visible { outline:2px solid var(--info); outline-offset:-2px; }
  /* Docked, the panel is always open and the control does not exist. */
  #rosterfold { display:none; }
  @media (max-width:720px) {
    #stage { flex-direction:column; }
    #roster { flex:0 0 auto; max-height:40vh; border-right:0; border-bottom:1px solid var(--line); }
    #rdivider { display:none; }
    /* ⚠️ The control is shown at the same breakpoint the layout stacks at, and
       that is CCWATCH_ROSTER.STACK_BREAKPOINT — one number, not two that can
       drift apart. applyRosterFold() asks the module rather than re-testing
       the width itself. */
    #rosterfold { display:inline-block; font:inherit; font-size:11px;
                  background:none; color:var(--dim); border:1px solid var(--line);
                  border-radius:4px; padding:.1rem .45rem; margin-bottom:.4rem;
                  cursor:pointer; }
    #rosterfold:hover { color:var(--ink); }
    /* ⚠️ Removed from the layout, not shrunk. Collapsing it to its title and
       its buttons was still ~60px of a ~500px overlay, and at that size the
       window is for the board and the meters — nothing else. Folding it now
       costs the board nothing at all. */
    #stage.rosterfolded #roster { display:none; }
    /* And open, it floats OVER the board rather than pushing it. Same
       reasoning as the alert chip: a panel that comes and goes on its own may
       not take the layout with it. */
    #stage:not(.rosterfolded) #roster {
      position:absolute; left:0; right:0; top:0; bottom:0; z-index:3;
      max-height:none; background:var(--bg); border-bottom:0;
      box-shadow:0 8px 24px rgba(0,0,0,.45);
    }
    #stage { position:relative; }
  }
  /* Same breakpoint the roster stacks at (CCWATCH_ROSTER.STACK_BREAKPOINT) —
     one number, not two that can drift apart. */
  @media (max-width:720px) {
    dialog#agentmodal { width:100vw; max-width:100vw; height:100vh; max-height:100vh;
                         border-radius:0; }
  }
  /* The drawn keyboard-focus indicator is gone with the SVG group that needed
     it: `.agent` is a real <button>, so `:focus-visible` above is the browser's
     own outline and there is nothing to keep in sync across a render. */
</style>
</head>
<body>
<header>
  <div class="hleft">
  <h1>ccwatch <span id="counts"></span></h1>
  <nav><a href="/">table</a><a href="/map" class="on">map</a><span id="rosternav"></span></nav>
  <!-- role="status" so a condition arriving while you are reading the board is
       announced once, politely, rather than only being available to whoever
       happens to look at the header. renderAlerts writes the trigger's text
       only when it actually changes, so a 3-second repaint of an unchanged
       condition does not re-announce it. -->
  <div id="alertslot" class="quiet" role="status">
    <button type="button" id="alertbtn" aria-haspopup="dialog"
            aria-expanded="false" aria-controls="alertmodal"></button>
  </div>
  </div>
  <div class="gauges" id="gauges"></div>
</header>
<div id="idlemsg"></div>
<div id="wrap">
  <!-- tabindex="0" so the scroll container is focusable, which is all that is
       needed for the arrow keys, PageUp/PageDown and Home/End to scroll it:
       that is native browser behaviour for a focused overflow box, and it
       replaces the hand-written pan/zoom keymap the camera carried. -->
  <div id="board" tabindex="0" role="region"
       aria-label="Project map, a companion view of the agent list in the roster panel. Scroll for the rest.">
    <div id="boardinner">
      <svg id="wires" aria-hidden="true">
        <defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4"
            markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="var(--info)"/></marker></defs>
      </svg>
    </div>
  </div>
</div>
<dialog id="alertmodal" aria-labelledby="alerttitle">
  <div id="alerthead">
    <strong id="alerttitle">alerts</strong>
    <button type="button" id="alertclose" class="ghost">close</button>
  </div>
  <div id="alertlist"></div>
</dialog>
<dialog id="keymodal" aria-labelledby="keytitle">
  <div id="keyhead">
    <strong id="keytitle">map key</strong>
    <button type="button" id="keyclose" class="ghost">close</button>
  </div>
  <div class="legend" id="legend"></div>
</dialog>
<dialog id="agentmodal" aria-labelledby="ilead iname">
  <div id="ihead">
    <span id="ilead">agent</span><span id="iname"></span>
    <span id="istatus"></span>
    <!-- ⚠️ A real anchor with target=_blank, not a window.open() call. In the
         overlay this page is a WKWebView, and the app implements the
         new-window delegate to hand the URL to the default browser — a
         scripted open is what WKWebView silently drops. In an ordinary
         browser tab it is just a link, and the same one. -->
    <a id="ibrowser" class="ghost" target="_blank" rel="noopener"
       title="Open this agent in a browser tab, where there is room to read">open in browser</a>
    <button class="ghost" id="iclose">close</button>
  </div>
  <div id="ifeed"><span class="main"></span><span class="unreadable"></span></div>
  <div id="igone"></div>
  <dl id="istats"></dl>
  <div id="ask"></div>
  <div id="convo"></div>
  <div id="killbar"></div>
  <div id="ifoot">
    <input id="replyText" placeholder="message…" autocomplete="off">
    <button id="replySend">send</button>
    <span id="sendwhy"></span>
  </div>
  <span id="replyOut"></span>
</dialog>
<footer id="foot"></footer>
<!-- Served straight off the web directory by the static fallback in `serve`, so
     it needs no route of its own. The path is absolute because this page
     answers on both /map and /map.html and one src should mean one file. -->
<script src="/md.js"></script>
<script src="/roster.js"></script>
<script src="/modal.js"></script>
<script src="/alerts.js"></script>
<script src="/usage.js"></script>
<script src="/sprites.js"></script>
<script src="/comms.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => { if (s == null) return "-"; s = Math.max(0, s);
  return s < 60 ? Math.floor(s)+"s" : s < 3600 ? Math.floor(s/60)+"m"
       : s < 86400 ? Math.floor(s/3600)+"h" : Math.floor(s/86400)+"d"; };
const SEND_TOKEN = "__CCWATCH_SEND_TOKEN__";
const CAN_SEND = SEND_TOKEN && !SEND_TOKEN.startsWith("__");
// Set from the server, which only enables it when started with --allow-kill.
let CAN_KILL = false;
// The single VOLATILE gate (data-model.md §5, FR-029): true only when the
// feed is fully trusted. Every reading in the withheld set — the context
// fill inside a figure, `ctx NN%`/`NN MB` in a figure's title, every gauge
// percentage, the host memory-pressure figures — reads this flag rather than
// deciding independently, so there is exactly one place to extend it.
let VOLATILE = true;

// contracts/page-roster.md §1 — the panel's DOM, built with createElement/
// textContent only (FR-042): #wrap is reparented into the new #stage, never
// rebuilt, so its existing ids, structure and listeners survive untouched.
// Runs before the first tick() (§8), so the panel exists for every later
// renderRoster() call site to write into.
const rosterEls = (function () {
  const wrap = $("wrap");
  const stage = document.createElement("div");
  stage.id = "stage";
  wrap.parentNode.insertBefore(stage, wrap);

  const roster = document.createElement("aside");
  roster.id = "roster";
  roster.setAttribute("role", "region");
  roster.setAttribute("aria-labelledby", "rostertitle");

  const title = document.createElement("h2");
  title.id = "rostertitle";
  title.textContent = "agents · 0";

  // ⚠️ A disclosure, and only once the layout has stacked. Docked beside the
  // board the roster costs width, which the divider already lets you take
  // back; STACKED it costs HEIGHT, and it took `max-height:40vh` plus its own
  // title and buttons — measured over half of a 630px overlay, with the map it
  // sits above reduced to a strip. Height is the one dimension there is no
  // divider for.
  //
  // Collapsed by default when stacked, because at that size the board is what
  // the window is for. A real <button> with aria-expanded, so it is reachable
  // and announced rather than being a tap target only a mouse can find — the
  // roster is operable without a mouse or without sight, and a drawer that
  // breaks that is not an improvement.
  const fold = document.createElement("button");
  fold.type = "button";
  fold.id = "rosterfold";
  fold.setAttribute("aria-controls", "rosterlist");

  const note = document.createElement("p");
  note.id = "rosternote";

  // Outside #rosterlist (research.md D6): a listbox's rows carry role="option",
  // which has presentational children — a real, focusable, disableable button
  // inside one is not reliably operable by assistive tech.
  const open = document.createElement("button");
  open.type = "button"; open.id = "rosteropen";

  // ⚠️ No condition panel here any more. The roster used to state, in its own
  // four sentences, why it could not be believed — and every one of those
  // sentences is now in the header's alert control, which is always on screen
  // above it. Two places saying "the feed is down" in two phrasings is one
  // fact to read twice and two strings to keep in agreement. What the roster
  // still owns is the TOMBSTONE below: "that session is gone" is a statement
  // about your selection, not about the feed, and nothing else says it.

  // The tombstone (contracts/page-roster.md §1/§6, data-model.md §6): never
  // a role="option" — it is a statement about a selection, not a row to
  // navigate to. A real <button> dismisses it and clears the stored record.
  const gone = document.createElement("div");
  gone.id = "rostergone";
  const goneMsg = document.createElement("span");
  const goneDismiss = document.createElement("button");
  goneDismiss.type = "button";
  goneDismiss.textContent = "Dismiss";
  gone.append(goneMsg, goneDismiss);

  const list = document.createElement("div");
  list.id = "rosterlist";
  list.setAttribute("role", "listbox");
  list.setAttribute("aria-labelledby", "rostertitle");
  // ⚠️ `o` opens the modal for the focused row — the keyboard opener. A
  // shortcut that is not announced is a shortcut only its author knows about,
  // so it is declared here rather than living solely in the keydown handler.
  list.setAttribute("aria-keyshortcuts", "o");

  roster.append(title, open, note, gone, list);
  // ⚠️ The control lives in the HEADER, not in the panel it opens. Narrow, the
  // panel is removed from the layout altogether — a toggle inside it would go
  // with it and there would be no way back. aria-controls still points at the
  // list, so the relationship survives the move.
  $("rosternav").appendChild(fold);

  const divider = document.createElement("div");
  divider.id = "rdivider";
  divider.setAttribute("role", "separator");
  divider.setAttribute("aria-orientation", "vertical");
  divider.setAttribute("tabindex", "0");
  divider.setAttribute("aria-label", "Roster width");

  stage.append(roster, divider, wrap);

  return {
    stage, roster, title, fold, note, open,
    gone, goneMsg, goneDismiss, list, divider,
  };
})();

// The fold's state. Only meaningful while the layout is stacked — docked, the
// panel is always open and the control is not rendered.
//
// ⚠️ Stored per viewer and read through try/catch, like every other
// preference here: site data can be cleared, blocked, or throw in a private
// window, and a page that cannot remember a drawer must still draw one.
const ROSTER_FOLD_KEY = "ccwatch.roster.folded";
function foldedPref() {
  try {
    const v = localStorage.getItem(ROSTER_FOLD_KEY);
    if (v === "0") return false;
    if (v === "1") return true;
  } catch (e) { /* no storage; fall through to the default */ }
  return true;   // collapsed by default: stacked, the board is the point
}
let rosterFolded = foldedPref();

function applyRosterFold() {
  const stacked = !window.CCWATCH_ROSTER || CCWATCH_ROSTER.stacked(innerWidth);
  // Docked, there is nothing to fold: the class and the control both go, so
  // no stale collapsed state can survive a resize back to the wide layout.
  rosterEls.stage.classList.toggle("rosterfolded", stacked && rosterFolded);
  rosterEls.fold.setAttribute("aria-expanded", String(!(stacked && rosterFolded)));
  rosterEls.fold.textContent = rosterFolded ? "show agents" : "hide agents";
  // hidden, not merely invisible: a collapsed list must leave the tab order
  // and the accessibility tree, or a keyboard user falls into rows they
  // cannot see (the same reasoning as #alertslot.quiet).
  rosterEls.list.hidden = stacked && rosterFolded;
}
rosterEls.fold.addEventListener("click", () => {
  rosterFolded = !rosterFolded;
  try { localStorage.setItem(ROSTER_FOLD_KEY, rosterFolded ? "1" : "0"); }
  catch (e) { /* the fold still works for this session */ }
  applyRosterFold();
});
addEventListener("resize", applyRosterFold);
applyRosterFold();

// Built once at load, never touched by a refresh (FR-020): CAN_SEND is known
// before the first tick, so there is nothing here a snapshot could change.
$("legend").innerHTML = [
  `<span><b style="color:var(--block)">raised arm, !</b> blocked on you — click to read the question</span>`,
  `<span><b style="color:var(--bad)">eyes down, ?</b> says busy but has gone quiet</span>`,
  `<span><b style="color:var(--ok)">hammer up, bobbing</b> working</span>`,
  `<span><b style="color:var(--info)">hollow outline</b> alive, nothing to corroborate it</span>`,
  `<span><b style="color:var(--dim)">eyes shut, z</b> idle</span>`,
  `<span>bar under the feet = context used</span>`,
  `<span>hair and skin tell sessions apart; they mean nothing else</span>`,
  `<span><b style="color:var(--info)">dashed ring</b> selected — pick a row in the roster to scroll to it</span>`,
  `<span><b style="color:var(--info)">envelope</b> sent or received a peer message in the last `
    + `${Math.round(CCWATCH_COMMS.RECENT_S / 60)} min</span>`,
  `<span>hover, focus or select an agent to draw its message lines</span>`,
  CAN_SEND ? `<span>click an agent to read its conversation and reply</span>`
           : `<span>click an agent to read its conversation (read-only)</span>`,
].join("");

// The world, painted once: both themes' grass, hedges, walls, floors and rugs
// go on the root as custom properties (`--px-<part>-<theme>`) and the
// stylesheet picks a theme's set, so a theme change needs no script. data:
// URLs rather than files, so the scenery is never a request that can fail
// and leave the blocks bare — and if this never runs, every frame falls back
// to a transparent border of the same width, so the layout does not move.
(function paintWorld() {
  const url = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const st = document.documentElement.style;
  for (const theme of ["dark", "light"]) {
    const w = CCWATCH_SPRITES.world(theme);
    for (const part of ["grass", "floor", "hedge", "rug", "wall", "wallScorched"])
      st.setProperty(`--px-${part}-${theme}`, url(w[part]));
    st.setProperty(`--px-rugfield-${theme}`, w.rugField);
  }
})();

// One mapping from status to appearance, so the figure, the label colour and
// the territory border can never disagree about how bad something is.
const KIND = {
  waiting:          {cls:"waiting", sev:4, colour:"var(--block)"},
  "HUNG?":          {cls:"hung",    sev:3, colour:"var(--bad)"},
  "HUNG!!":         {cls:"hung",    sev:3, colour:"var(--bad)"},
  "SDK STALE?":     {cls:"hung",    sev:3, colour:"var(--bad)"},
  "NO TRANSCRIPT":  {cls:"hung",    sev:3, colour:"var(--bad)"},
  busy:             {cls:"busy",    sev:2, colour:"var(--ok)"},
  sdk:              {cls:"busy",    sev:2, colour:"var(--ok)"},
  "sdk-ts":         {cls:"quiet",   sev:1, colour:"var(--info)"},
  shell:            {cls:"quiet",   sev:1, colour:"var(--info)"},
  unknown:          {cls:"quiet",   sev:1, colour:"var(--dim)"},
  idle:             {cls:"idle",    sev:0, colour:"var(--dim)"},
};
const kindOf = r => KIND[r.token] || {cls:"quiet", sev:r.sev, colour:"var(--dim)"};

// A little pixel-art character, one per session. The pixels come from
// web/sprites.js, which owns every grid and every pose; this only turns its
// paths into elements. The status colour is passed through as the page's own
// token, so the tunic, the bubble and the label can never disagree, and the
// shape differs per status as well — the raised arm on a session that is
// blocked on you is the whole point of this view.
// Built with svgEl rather than an innerHTML template string (FR-016/V1/V2):
// this is the figure primitive's art, assembled fresh into a detached node
// each call and handed to updateFigure() to attach — no innerHTML assignment
// anywhere on the page's refresh path except the one turn body.
function figure(r) {
  const k = kindOf(r);
  const ctx = VOLATILE && r.context && r.context.used_percentage != null
            ? r.context.used_percentage : null;
  const spec = CCWATCH_SPRITES.figure(k.cls, k.colour, r.sid, ctx);
  // width/height are the 2x size; the CSS em size below overrides them, as it
  // did for the old figure, and the viewBox keeps every pixel square.
  const svg = svgEl("svg", {class: "figure", viewBox: `0 0 ${spec.w} ${spec.h}`,
    width: spec.w * 2, height: spec.h * 2, "shape-rendering": "crispEdges",
    "aria-hidden": "true"});
  for (const name of ["body", "arm", "bubble"]) {
    const parts = spec.groups[name];
    if (!parts.length) continue;
    const g = svgEl("g", {class: name});
    for (const p of parts) {
      const a = {fill: p.fill, d: p.d};
      if (p.opacity != null) a["fill-opacity"] = p.opacity;
      g.appendChild(svgEl("path", a));
    }
    svg.appendChild(g);
  }
  // Context used, as a bar under the feet: a session close to compacting is
  // worth seeing before it happens. Outside `.body`, so it stays on the
  // ground while the character bobs.
  const m = spec.meter;
  if (m) {
    svg.appendChild(svgEl("rect", {class: "meter", x: m.x, y: m.y, width: m.cells, height: 1, fill: "var(--line)"}));
    if (m.lit) svg.appendChild(svgEl("rect", {x: m.x, y: m.y, width: m.lit, height: 1, fill: m.fill}));
  }
  return svg;
}

// Within a territory the project prefix is redundant and eats the width that
// would otherwise show what distinguishes one agent from another.
// Inside a territory the repo name is redundant and eats the width that would
// otherwise show what distinguishes one agent from another. Session names are
// derived from the DIRECTORY, which may differ from the repo, so both are
// tried.
function shortName(r) {
  const cands = [r.project, (r.repo || "").split("/").pop(),
                 (r.cwd || "").split("/").filter(Boolean).pop()]
                .filter(Boolean).sort((a, b) => b.length - a.length);
  for (const p of cands)
    if (r.name.startsWith(p + "-")) return r.name.slice(p.length + 1);
  return r.name;
}

const NO_REPO = "no repo";

// ⚠️ The zone key for "this session has no git branch". The empty string,
// because git cannot name a branch that, so it can never collide with a real
// one — which `"?"` could, and did worse than collide: it was PRINTED as the
// branch, so a session the payload said had no branch was labelled `?` on the
// page. That is inventing a value the collector deliberately reported as
// absent (bin/ccwatch:908 normalises an empty branch to null on purpose), and
// `?` is already this tool's vocabulary for "suspected", as in HUNG?. The CLI
// has the right answer and has had it all along: `${branch:+branch $branch}`
// at bin/ccwatch:1328 prints the clause only when there is a branch to print.
const NO_BRANCH = "";

// ⚠️ One comparator for every level, and it is deliberately NOT localeCompare.
// localeCompare's answer depends on the browser's locale and ICU build, so two
// machines could order the same sessions differently and a test could pass on
// one and fail on the other. A plain codepoint compare is the same everywhere.
const byName = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

function buildWorldModel(s) {
  const districts = {};      // org -> {org, isNoRepo, buildings: {slug -> ...}}
  const districtsByKey = {}; // "d|<org>" -> the summary accumulator
  const figuresByKey = {};   // "f|<slug>|<branch>|<sid>" -> row
  const buildingBySlugRepo = {}; // row.repo -> building, for exact deploy matching

  function ensureDistrict(org, isNoRepo) {
    if (!districts[org]) {
      districts[org] = {org, isNoRepo, buildings: {}};
      // DistrictSummary accumulators (data-model.md §5), finalised below once
      // every session/unfinished row has been seen.
      districtsByKey["d|" + org] = {org, isNoRepo, n: 0, worst: null,
                                     unfinishedCount: 0, unfinishedText: null};
    }
    return districts[org];
  }
  // `dir` is the directory a no-repo card stands for, kept so the card can
  // name it on hover. The visible label is the short form, which for a
  // directory is ambiguous across machines — `scratch` could be anywhere —
  // and the path is the only thing that identifies it.
  function ensureBuilding(d, slug, label, hasRemote, dir) {
    if (!d.buildings[slug])
      d.buildings[slug] = {slug, label, hasRemote, dir: dir || null,
                            zones: {}, unfinished: [], deploys: []};
    return d.buildings[slug];
  }
  function ensureZone(b, branchKey) {
    if (!b.zones[branchKey]) b.zones[branchKey] = {branch: branchKey, figures: []};
    return b.zones[branchKey];
  }

  for (const r of (s.sessions || [])) {
    const hasRemote = !!r.repo;
    const org = hasRemote ? r.repo.split("/")[0] : NO_REPO;
    const dir = hasRemote ? null : (r.cwd || null);
    const slug = r.repo || ("dir:" + (r.cwd || "?"));
    const label = r.repo || r.project || slug;
    const branchKey = r.branch || NO_BRANCH;
    const d = ensureDistrict(org, !hasRemote);
    const b = ensureBuilding(d, slug, label, hasRemote, dir);
    const z = ensureZone(b, branchKey);
    z.figures.push({sid: r.sid});
    figuresByKey["f|" + slug + "|" + branchKey + "|" + r.sid] = r;
    if (r.repo) buildingBySlugRepo[r.repo] = b;
    // Sessions arrive in the CLI's own [sev, psev] order (bin/ccwatch:920), so
    // the first row seen for a district is already its worst (data-model.md
    // §5) — no re-sort needed here.
    const dMeta = districtsByKey["d|" + org];
    dMeta.n++;
    if (dMeta.worst == null) dMeta.worst = r.token;
  }
  for (const u of (s.unfinished || [])) {
    const hasRemote = !!u.repo;
    const org = hasRemote ? u.repo.split("/")[0] : NO_REPO;
    // No `cwd` on an unfinished-run row — `project` is the only directory
    // hint it carries (data-model.md §2's cwd rule applies to live rows).
    const slug = u.repo || ("dir:" + (u.project || "?"));
    const label = u.repo || u.project || slug;
    const d = ensureDistrict(org, !hasRemote);
    // No `dir`: an unfinished-run row carries no cwd, so there is no path to
    // name. Passing `project` would look like one and be a directory basename.
    const b = ensureBuilding(d, slug, label, hasRemote, null);
    b.unfinished.push(u);
    if (u.repo) buildingBySlugRepo[u.repo] = b;
    // The badge text this replaces at far (FR-022), so the aggregate carries
    // the fact rather than dropping it (FR-029) — same wording as the
    // per-building badge (updateBuilding below).
    const dMeta = districtsByKey["d|" + org];
    dMeta.unfinishedCount++;
    if (dMeta.unfinishedText == null)
      dMeta.unfinishedText = `${u.phase}/${u.crashed ? "CRASHED" : u.status}`;
  }
  // Exact match on owner/name — see the note this replaces at the old
  // territory()/tick() call site: matching on a directory basename let a
  // deploy on acme/checkout-api silently never find its building.
  for (const dep of ((s.deploys && s.deploys.runs) || [])) {
    const b = buildingBySlugRepo[dep.repo];
    if (b) b.deploys.push(dep);
  }

  // Finalise DistrictSummary.unfinished — the representative text plus a
  // "+N" for any others (data-model.md §5) — now that every row is seen.
  for (const k in districtsByKey) {
    const m = districtsByKey[k];
    m.unfinished = m.unfinishedCount
      ? m.unfinishedText + (m.unfinishedCount > 1 ? ` +${m.unfinishedCount - 1}` : "")
      : null;
  }

  // The ordered tree the board renders from. Sorted at every level by the
  // name a reader sees, so a session's position is something they can predict
  // and re-find — and so it is decided by identity alone, never by severity.
  // A figure that moved when its status changed would make position useless
  // for finding a session again, which is the one thing position is for here.
  const tree = Object.keys(districts).sort(byName).map(org => {
    const d = districts[org];
    const meta = districtsByKey["d|" + org];
    return {
      key: "d|" + org,
      org: d.org,
      isNoRepo: d.isNoRepo,
      n: meta.n, worst: meta.worst, unfinished: meta.unfinished,
      buildings: Object.keys(d.buildings).sort(byName).map(slug => {
        const b = d.buildings[slug];
        return {
          key: "b|" + d.org + "|" + slug,
          slug: b.slug, label: b.label, hasRemote: b.hasRemote, dir: b.dir,
          unfinishedRuns: b.unfinished, deploys: b.deploys,
          zones: Object.keys(b.zones).sort(byName).map(br => {
            const z = b.zones[br];
            return {
              key: "z|" + slug + "|" + br,
              branch: z.branch,
              // Figures carry the whole row: unlike the coordinate module this
              // replaced, nothing here is fed to a placement pass that must be
              // kept ignorant of status.
              figures: z.figures
                .map(f => figuresByKey["f|" + slug + "|" + br + "|" + f.sid])
                .filter(Boolean)
                .sort((p, q) => byName(p.name, q.name) || byName(p.sid, q.sid))
                .map(row => ({key: "f|" + slug + "|" + br + "|" + row.sid, row})),
            };
          }),
        };
      }),
    };
  });

  return {tree, figuresByKey};
}
