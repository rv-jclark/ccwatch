<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccwatch · map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234ec9a5'/%3E%3C/svg%3E">
<style>
  /* The same palette and the same words as the table view and the terminal.
     A second visualisation that invents its own vocabulary for the same states
     is a second thing to learn, and two things to keep in sync. */
  :root {
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --ink:#e6e9ef; --dim:#8b93a3;
    --ok:#4ec9a5; --warn:#e3b341; --bad:#f07171; --block:#c586e8; --info:#5fa8e8;
    --ground:#12161d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#eef1f5; --panel:#fff; --line:#dfe3ea; --ink:#1a1d23; --dim:#6b7280;
            --ok:#0f8a63; --warn:#8a5d00; --bad:#c0392b; --block:#7c3aed; --info:#1f6fb2;
            --ground:#f6f8fb; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
           padding:.9rem 1.1rem; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  h1 span { color:var(--dim); font-weight:400; }
  nav a { color:var(--dim); text-decoration:none; margin-right:.75rem; font-size:12px; }
  nav a.on { color:var(--ink); font-weight:600; }
  .gauges { display:flex; gap:1.1rem; margin-left:auto; align-items:baseline; flex-wrap:wrap; }
  .g-label { color:var(--dim); } .g-val { font-weight:600; }
  .g-reset { color:var(--dim); font-size:11px; }
  .stale { color:var(--warn); }
  #hostwarn { display:none; padding:.45rem 1.1rem; background:color-mix(in srgb, var(--bad) 14%, transparent);
              border-bottom:1px solid var(--bad); color:var(--bad); font-size:12px; }
  #hostwarn.on { display:block; }
  /* data-model.md §5's FeedCondition, rendered: (a)/(b) share this banner
     because both replace the volatile readings with a stated reason; (c) is
     a second, additive line (R1); (d) a third — all three are absent, not
     empty, when the feed is trusted and sessions exist. */
  #trust { display:none; padding:.45rem 1.1rem; font-size:12px; }
  #trust.on { display:block; }
  #trust .main.down { color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
  #trust .main.warming { color:var(--dim); }
  #trust .main { display:block; }
  #trust .unreadable { display:block; color:var(--warn); }
  #trust .emptymsg { display:block; color:var(--dim); }

  /* The map itself. A single inline SVG holds a `<g id="camera">` that every
     district/building/zone/figure — and, from a later entry, the wires — is a
     child of, all in world units authored by web/plots.js. Nothing here reads
     getBoundingClientRect() to position anything; the camera's own transform
     is the only place screen pixels enter the picture. A force-directed graph
     was the other option and is worse here: with a dozen nodes it moves every
     time you look at it, and "did that agent move or did I misremember" is not
     a question a monitoring view should raise. */
  #wrap { position:relative; padding:1.1rem; }
  /* touch-action:none so a one-finger drag pans the map instead of scrolling
     the page (FR-007). */
  #world { width:100%; height:calc(100vh - 8rem); display:block; touch-action:none; }
  #world:focus-visible { outline:2px solid var(--info); outline-offset:2px; }
  /* Page chrome, outside the camera group and outside data-lod on purpose
     (page-camera.md §2): the controls are unaffected by the transform and
     stay legible at every zoom. */
  #camctl { position:absolute; left:1.6rem; bottom:1.6rem; display:flex;
            align-items:center; gap:.4rem; background:var(--panel);
            border:1px solid var(--line); border-radius:6px; padding:.35rem .5rem;
            font-size:11px; }
  #camctl button { background:none; border:1px solid var(--line); color:var(--ink);
                    font:inherit; padding:.15rem .5rem; border-radius:4px; cursor:pointer; }
  #camctl button:disabled { opacity:.4; cursor:default; }
  #camstate { color:var(--dim); }
  #camnote { color:var(--warn); }
  .hit { fill:transparent; }
  .district .hit { stroke:var(--line); stroke-width:1; fill:var(--ground); }
  .building .hit { stroke:var(--line); stroke-width:.6; fill:var(--panel); }
  .zone .hit { stroke:var(--line); stroke-width:.4; fill:none; stroke-dasharray:1.5; }
  .dlabel { font-size:calc(7px / var(--k, 1)); fill:var(--ink); font-weight:600; }
  .blabel { font-size:calc(5px / var(--k, 1)); fill:var(--ink); }
  .zlabel { font-size:calc(4px / var(--k, 1)); fill:var(--dim); }
  .norepo-badge { font-size:calc(4px / var(--k, 1)); fill:var(--warn); }
  .wreck-badge { font-size:calc(4px / var(--k, 1)); fill:var(--bad); }
  .deploy-badge { font-size:calc(4px / var(--k, 1)); fill:var(--ok); }
  .building.has-unfinished .hit { stroke:var(--bad); }
  .dsummary { font-size:calc(6px / var(--k, 1)); fill:var(--dim); }

  .agent { cursor:default; }
  .agent.clickable { cursor:pointer; }
  .agent.clickable:hover .hit { fill:rgba(255,255,255,.06); }
  .figure { display:block; overflow:visible; }
  .alabel { font-size:calc(3.6px / var(--k, 1)); fill:var(--dim); text-anchor:middle; }
  .agent.sev4 .alabel { fill:var(--block); font-weight:600; }
  .agent.sev3 .alabel { fill:var(--bad); }
  .agent.sev2 .alabel { fill:var(--ink); }

  /* Level of detail (contracts/page-camera.md §3): one attribute, four
     rules. The far level shows the district aggregate instead of buildings,
     zones, agents and their labels; near is the only level that also shows
     agent labels — mid shows the figures themselves but not their names. */
  #world[data-lod="far"] .building,
  #world[data-lod="far"] .zone,
  #world[data-lod="far"] .agent      { display:none; }
  #world[data-lod="far"] .dlabel     { display:none; }
  #world:not([data-lod="far"]) .dsummary { display:none; }
  #world[data-lod="mid"] .alabel     { display:none; }

  /* Constant apparent size for wires (FR-031-FR-033, contracts/page-camera.md
     §3): the stroke width is staged as --wire-w by updateWire() and divided
     by --k here, and the count bubble is un-scaled by nesting .bubblescale
     one level inside .bubble, whose own transform carries only position. */
  .wire path { stroke-width:calc(var(--wire-w, 1) * 1px / var(--k, 1)); }
  .wire text { font-size:9px; } /* inside .bubblescale — already counter-scaled */
  .bubblescale { transform:scale(calc(1 / var(--k, 1))); transform-origin:0 0; }

  /* Bounded, class-driven easing for centreOn({animate: true}) and fit only
     (research.md D12, FR-045, SC-012) — never left permanently on #camera, so
     a drag or wheel step never lags the pointer. Reduced to an instant jump
     under prefers-reduced-motion rather than skipped, so the transitionend
     listener that removes the class still fires. */
  #camera.eased { transition: transform 180ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    #camera.eased { transition: none; }
  }

  /* Motion is meaning here, not decoration: it is only ever applied to a state
     that is actually changing, so a still figure is a still session. */
  @keyframes bob   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-2.5px)} }
  @keyframes wave  { 0%,100%{transform:rotate(-16deg)}  50%{transform:rotate(16deg)} }
  @keyframes throb { 0%,100%{opacity:.35}               50%{opacity:1} }
  @keyframes tilt  { 0%,100%{transform:rotate(-2deg)}   50%{transform:rotate(2deg)} }
  .busy .body { animation:bob .9s ease-in-out infinite; }
  .waiting .arm { animation:wave .7s ease-in-out infinite; transform-origin:8px 2px; }
  .waiting .bubble { animation:throb 1.1s ease-in-out infinite; }
  .hung .body { animation:tilt 3.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .busy .body, .waiting .arm, .waiting .bubble, .hung .body { animation:none; }
  }

  /* Wreckage: an unfinished run left lying in the territory it belongs to. */
  .wreck { margin-top:.55rem; border-top:1px dashed var(--line); padding-top:.45rem;
           display:flex; flex-direction:column; gap:.25rem; }
  .wreck div { font-size:11px; color:var(--bad); display:flex; gap:.4rem; }
  .wreck .feat { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wreck .cost { margin-left:auto; color:var(--dim); }

  .legend { display:flex; gap:1rem; flex-wrap:wrap; padding:.2rem 1.1rem 1.4rem;
            color:var(--dim); font-size:11px; }
  .legend b { font-weight:600; }
  footer { padding:0 1.1rem 2rem; color:var(--dim); font-size:11px; }

  /* The inspector: the conversation, then the reply box. Reading before
     writing is the normal order — you rarely want to message an agent without
     first seeing what it is doing. A native <dialog> supplies the focus move,
     the focus trap and the inert background (FR-036, FR-039, D3) — none of
     that is reimplemented here. */
  dialog#agentmodal { max-width:min(760px, 92vw); max-height:88vh;
           background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:.7rem; display:flex; flex-direction:column; gap:.5rem;
           color:var(--ink); box-shadow:0 8px 40px rgba(0,0,0,.5); width:min(560px,94vw); }
  #agentmodal::backdrop { background:rgba(0,0,0,.55); }
  #ihead { display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap;
           padding-bottom:.5rem; border-bottom:1px solid var(--line); }
  #iname { font-weight:600; }
  #istatus { color:var(--dim); font-size:11px; }
  #iclose { margin-left:auto; }
  /* #ifeed restates the same feed condition the page prints above the map
     (data-model.md §6) — its own words, never a colour alone. */
  #ifeed .main { display:block; }
  #ifeed .main.down { color:var(--bad); }
  #ifeed .main.warming { color:var(--dim); }
  #ifeed .unreadable { display:block; color:var(--warn); }
  #igone { display:none; color:var(--bad); }
  #igone.on { display:block; }
  /* Two columns — the label is the <dt>, so a reading is never announced
     without what it is (principle VII). */
  #istats { display:grid; grid-template-columns:auto 1fr; gap:.15rem .6rem;
            font-size:12px; margin:0; }
  #istats dt { color:var(--dim); }
  #istats dd { margin:0; }
  #convo { flex:1; overflow-y:auto; font-size:12px; display:flex;
           flex-direction:column; gap:.5rem; padding:.2rem 0; }
  .turn { display:grid; grid-template-columns:64px 1fr; gap:.5rem; }
  .turn .who { color:var(--dim); font-size:10px; text-align:right; padding-top:.1rem; }
  .turn .what { white-space:pre-wrap; word-break:break-word; }
  .turn.said .who { color:var(--info); }
  .turn.said.peer .who { color:var(--block); }
  .turn.assistant .who { color:var(--ok); }
  .turn.system .what, .turn.tool_result .what { color:var(--dim); }
  .turn.system .what { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                       overflow:hidden; }

  /* Rendered markdown. `pre-wrap` comes OFF here — the renderer has turned the
     newlines into blocks, and leaving it on doubles every gap. Everything is
     scoped under .md so an unrendered turn keeps its old appearance exactly. */
  .turn .what.md { white-space:normal; }
  .what.md > *:first-child { margin-top:0; }
  .what.md > *:last-child { margin-bottom:0; }
  .what.md p { margin:.35rem 0; }
  /* ⚠️ Not dimmed. The first cut rendered h5/h6 in --dim, and a heading paler
     than the paragraph under it reads as less important than the paragraph —
     the opposite of what the model meant by it. Size and weight carry the
     level; the colour stays the reading colour. */
  .what.md h4, .what.md h5, .what.md h6 {
    margin:.6rem 0 .3rem; font-weight:600; line-height:1.25; color:var(--ink); }
  .what.md h4 { font-size:14px; }
  .what.md h5 { font-size:13px; }
  .what.md h6 { font-size:12px; }
  .what.md ul, .what.md ol { margin:.3rem 0; padding-left:1.2rem; }
  .what.md li { margin:.1rem 0; }
  .what.md li > ul, .what.md li > ol { margin:.1rem 0; }
  .what.md code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
                  background:var(--ground); border:1px solid var(--line);
                  border-radius:3px; padding:0 .2rem; }
  /* A pasted file is wider than a 560px drawer, so the block scrolls on its own
     axis. Without this one code block widens the whole inspector and every
     turn above it reflows to match. */
  .what.md pre { margin:.4rem 0; padding:.4rem .5rem; background:var(--ground);
                 border:1px solid var(--line); border-radius:4px;
                 overflow-x:auto; max-height:16rem; overflow-y:auto; }
  .what.md pre code { background:none; border:0; padding:0; font-size:11px;
                      white-space:pre; }
  .what.md blockquote { margin:.35rem 0; padding-left:.5rem;
                        border-left:2px solid var(--line); color:var(--dim); }
  .what.md hr { border:0; border-top:1px solid var(--line); margin:.5rem 0; }
  .what.md del { color:var(--dim); }
  /* A URL is shown, never linked — see the note at the top of md.js. Dimmed so
     it reads as provenance rather than as something to click. */
  .what.md .mdurl { color:var(--dim); word-break:break-all; }
  /* ccwatch's own reduction of a tool use or result, not the model's words. */
  .what.md .mdmeta { color:var(--dim); white-space:pre-wrap; margin:.2rem 0; }
  #ifoot { display:flex; gap:.5rem; align-items:center; }
  /* Kill: styled as the destructive action it is, and two-step. A single click
     that ends a four-day-old session mid-task is not an affordance, it is a
     trap. */
  /* Always present — whether or not killing is permitted (FR-028); only
     #killstart's disabled attribute and its reason text change. */
  #killbar { display:flex; flex-direction:column; gap:.35rem; font-size:11px;
             border-top:1px solid var(--line); padding-top:.45rem; }
  #killbar .danger { background:none; border:1px solid var(--bad); color:var(--bad);
                     font:inherit; font-size:11px; padding:.15rem .5rem;
                     border-radius:3px; cursor:pointer; align-self:flex-start; }
  #killbar .danger:hover { background:color-mix(in srgb, var(--bad) 18%, transparent); }
  #killconfirm { display:none; flex-direction:column; gap:.3rem;
                 border:1px solid var(--bad); border-radius:4px; padding:.45rem; }
  #killconfirm.on { display:flex; }
  #killconfirm .row { display:flex; gap:.4rem; align-items:center; }
  #killconfirm b { color:var(--bad); }
  #killout { font-size:11px; }
  #killout.killed { color:var(--ok); } #killout.refused { color:var(--warn); }
  #killout.failed { color:var(--bad); }
  /* The pending question. Given the most prominent place in the inspector
     because it is the reason the session stopped, and the reason you opened
     this panel. */
  #ask { border:1px solid var(--block); border-radius:6px; padding:.55rem .6rem;
         display:none; flex-direction:column; gap:.4rem;
         background:color-mix(in srgb, var(--block) 8%, transparent); }
  #ask.on { display:flex; }
  #ask .q { font-weight:600; color:var(--block); }
  #ask ol { margin:0; padding-left:1.3rem; display:flex; flex-direction:column; gap:.3rem; }
  #ask li::marker { color:var(--block); }
  #ask .odesc { color:var(--dim); font-size:11px; }
  /* Stated, not implied: a sent message is queued behind the dialog, it does
     not answer it. Claiming otherwise would be the worst kind of lie this
     tool could tell — you would think an agent was unblocked when it is not. */
  #ask .how { font-size:11px; color:var(--dim); border-top:1px solid var(--line);
              padding-top:.35rem; }
  #ask code { background:var(--bg); border:1px solid var(--line); border-radius:3px;
              padding:0 .25rem; user-select:all; }
  #ifoot input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink);
                 font:inherit; padding:.4rem .55rem; border-radius:4px; }
  #ifoot input:focus { outline:none; border-color:var(--info); }
  #agentmodal button { background:var(--info); border:0; color:#fff; font:inherit;
                  padding:.4rem .85rem; border-radius:4px; cursor:pointer; }
  #agentmodal button.ghost { background:none; border:1px solid var(--line); color:var(--dim); }
  #agentmodal button:disabled { opacity:.5; cursor:default; }
  #sendwhy { color:var(--dim); font-size:11px; }
  #replyOut { font-size:11px; }
  #replyOut.delivered { color:var(--ok); } #replyOut.queued { color:var(--warn); }
  #replyOut.failed { color:var(--bad); }
  .empty { color:var(--dim); padding:1rem; }

  /* The docked roster panel (contracts/page-roster.md §2). --roster-w is the
     only width writer (D9); setWidth() never touches #roster's own flex-basis
     any other way, so there is exactly one place a width change originates. */
  #stage { display:flex; align-items:stretch; }
  #roster { flex:0 0 var(--roster-w, 320px); overflow-y:auto; min-width:0;
            border-right:1px solid var(--line); padding:.8rem; }
  #rostertitle { font-size:13px; margin:0 0 .5rem; }
  #rosternote { color:var(--warn); font-size:11px; margin:0 0 .5rem; }
  #rostercond { font-size:12px; margin-bottom:.5rem; }
  #rostercond .main.down { display:block; color:var(--bad); }
  #rostercond .main.warming { display:block; color:var(--dim); }
  #rostercond .unreadable { display:block; color:var(--warn); }
  #rostercond .emptymsg { display:block; color:var(--dim); }
  #rostergone { display:none; font-size:12px; margin-bottom:.5rem; }
  #rostergone.on { display:block; }
  #rosterlist { display:flex; flex-direction:column; gap:.3rem; }
  .rrow { display:flex; gap:.4rem; align-items:baseline; padding:.25rem .35rem;
          border-radius:4px; cursor:pointer; }
  .rrow:hover { background:color-mix(in srgb, var(--ink) 6%, transparent); }
  /* Identity truncates first; the status word and its measurement — the two
     fields FR-034 protects — never do (they carry flex:none below). */
  .rrow .rname, .rrow .rwhere { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rstatus { flex:none; white-space:nowrap; }
  /* Selection is a word, not only a colour (Constitution VII, D17). */
  .rrow[aria-selected="true"] { background:color-mix(in srgb, var(--info) 16%, transparent); }
  .rrow .rsel { display:none; color:var(--info); font-weight:600; }
  .rrow[aria-selected="true"] .rsel { display:inline; }
  .agent.selected .hit { stroke:var(--info); stroke-width:1.4; stroke-dasharray:2; }
  #rdivider { flex:0 0 6px; cursor:col-resize; touch-action:none; background:var(--line); }
  #rdivider:focus-visible { outline:2px solid var(--info); outline-offset:-2px; }
  @media (max-width:720px) {
    #stage { flex-direction:column; }
    #roster { flex:0 0 auto; max-height:40vh; border-right:0; border-bottom:1px solid var(--line); }
    #rdivider { display:none; }
  }
  /* Same breakpoint the roster stacks at (CCWATCH_ROSTER.STACK_BREAKPOINT) —
     one number, not two that can drift apart. */
  @media (max-width:720px) {
    dialog#agentmodal { width:100vw; max-width:100vw; height:100vh; max-height:100vh;
                         border-radius:0; }
  }
  /* The drawn keyboard-focus indicator (D7): an SVG group cannot take an
     outline, and the ring must survive every render the way the selected
     figure's own emphasis does. */
  .agent .focusring { display:none; fill:none; stroke:var(--info); stroke-width:1; }
  .agent:focus-visible .focusring { display:block; }
</style>
</head>
<body>
<header>
  <h1>ccwatch <span id="counts"></span></h1>
  <nav><a href="/">table</a><a href="/map" class="on">map</a></nav>
  <div class="gauges" id="gauges"></div>
</header>
<div id="trust"></div>
<div id="hostwarn"></div>
<div id="wrap">
  <svg id="world" viewBox="0 0 408 408" tabindex="0" data-lod="mid"
       aria-label="City map, a companion view of the agent list in the roster panel. Drag to pan. Arrow keys pan, plus and minus zoom, zero fits the whole world.">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4"
        markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="var(--info)"/></marker></defs>
    <g id="camera"></g>
  </svg>
</div>
<div class="legend" id="legend"></div>
<dialog id="agentmodal" aria-labelledby="ilead iname">
  <div id="ihead">
    <span id="ilead">agent</span><span id="iname"></span>
    <span id="istatus"></span>
    <button class="ghost" id="iclose">close</button>
  </div>
  <div id="ifeed"><span class="main"></span><span class="unreadable"></span></div>
  <div id="igone"></div>
  <dl id="istats"></dl>
  <div id="ask"></div>
  <div id="convo"></div>
  <div id="killbar"></div>
  <div id="ifoot">
    <input id="replyText" placeholder="message…" autocomplete="off">
    <button id="replySend">send</button>
    <span id="sendwhy"></span>
  </div>
  <span id="replyOut"></span>
</dialog>
<footer id="foot"></footer>
<!-- Served straight off the web directory by the static fallback in `serve`, so
     it needs no route of its own. The path is absolute because this page
     answers on both /map and /map.html and one src should mean one file. -->
<script src="/md.js"></script>
<script src="/plots.js"></script>
<script src="/camera.js"></script>
<script src="/roster.js"></script>
<script src="/modal.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => { if (s == null) return "-"; s = Math.max(0, s);
  return s < 60 ? Math.floor(s)+"s" : s < 3600 ? Math.floor(s/60)+"m"
       : s < 86400 ? Math.floor(s/3600)+"h" : Math.floor(s/86400)+"d"; };
const SEND_TOKEN = "__CCWATCH_SEND_TOKEN__";
const CAN_SEND = SEND_TOKEN && !SEND_TOKEN.startsWith("__");
// Set from the server, which only enables it when started with --allow-kill.
let CAN_KILL = false;
// The single VOLATILE gate (data-model.md §5, FR-029): true only when the
// feed is fully trusted. Every reading in the withheld set — the context
// fill inside a figure, `ctx NN%`/`NN MB` in a figure's title, every gauge
// percentage, the host memory-pressure figures — reads this flag rather than
// deciding independently, so there is exactly one place to extend it.
let VOLATILE = true;

// contracts/page-roster.md §1 — the panel's DOM, built with createElement/
// textContent only (FR-042): #wrap is reparented into the new #stage, never
// rebuilt, so its existing ids, structure and listeners survive untouched.
// Runs before the first tick() (§8), so the panel exists for every later
// renderRoster() call site to write into.
const rosterEls = (function () {
  const wrap = $("wrap");
  const stage = document.createElement("div");
  stage.id = "stage";
  wrap.parentNode.insertBefore(stage, wrap);

  const roster = document.createElement("aside");
  roster.id = "roster";
  roster.setAttribute("role", "region");
  roster.setAttribute("aria-labelledby", "rostertitle");

  const title = document.createElement("h2");
  title.id = "rostertitle";
  title.textContent = "agents · 0";

  const note = document.createElement("p");
  note.id = "rosternote";

  // Outside #rosterlist (research.md D6): a listbox's rows carry role="option",
  // which has presentational children — a real, focusable, disableable button
  // inside one is not reliably operable by assistive tech.
  const open = document.createElement("button");
  open.type = "button"; open.id = "rosteropen";

  const cond = document.createElement("div");
  cond.id = "rostercond";
  const condMain = document.createElement("span"); condMain.className = "main";
  const condUnreadable = document.createElement("span"); condUnreadable.className = "unreadable";
  const condEmpty = document.createElement("span"); condEmpty.className = "emptymsg";
  cond.append(condMain, condUnreadable, condEmpty);

  // The tombstone (contracts/page-roster.md §1/§6, data-model.md §6): never
  // a role="option" — it is a statement about a selection, not a row to
  // navigate to. A real <button> dismisses it and clears the stored record.
  const gone = document.createElement("div");
  gone.id = "rostergone";
  const goneMsg = document.createElement("span");
  const goneDismiss = document.createElement("button");
  goneDismiss.type = "button";
  goneDismiss.textContent = "Dismiss";
  gone.append(goneMsg, goneDismiss);

  const list = document.createElement("div");
  list.id = "rosterlist";
  list.setAttribute("role", "listbox");
  list.setAttribute("aria-labelledby", "rostertitle");
  // ⚠️ `o` opens the modal for the focused row — the keyboard opener. A
  // shortcut that is not announced is a shortcut only its author knows about,
  // so it is declared here rather than living solely in the keydown handler.
  list.setAttribute("aria-keyshortcuts", "o");

  roster.append(title, open, note, cond, gone, list);

  const divider = document.createElement("div");
  divider.id = "rdivider";
  divider.setAttribute("role", "separator");
  divider.setAttribute("aria-orientation", "vertical");
  divider.setAttribute("tabindex", "0");
  divider.setAttribute("aria-label", "Roster width");

  stage.append(roster, divider, wrap);

  return {
    stage, roster, title, note, open, cond,
    condMain, condUnreadable, condEmpty, gone, goneMsg, goneDismiss, list, divider,
  };
})();

// Built once at load, never touched by a refresh (FR-020): CAN_SEND is known
// before the first tick, so there is nothing here a snapshot could change.
$("legend").innerHTML = [
  `<span><b style="color:var(--block)">raised arm</b> blocked on you — click to read the question</span>`,
  `<span><b style="color:var(--bad)">tilted, ?</b> says busy but has gone quiet</span>`,
  `<span><b style="color:var(--ok)">bobbing</b> working</span>`,
  `<span><b style="color:var(--info)">outline</b> alive, nothing to corroborate it</span>`,
  `<span><b style="color:var(--dim)">z</b> idle</span>`,
  `<span>fill level inside the body = context used</span>`,
  `<span><b style="color:var(--info)">dashed ring</b> selected — pick a row in the roster to fly there</span>`,
  CAN_SEND ? `<span>click an agent to read its conversation and reply</span>`
           : `<span>click an agent to read its conversation (read-only)</span>`,
].join("");

// One mapping from status to appearance, so the figure, the label colour and
// the territory border can never disagree about how bad something is.
const KIND = {
  waiting:          {cls:"waiting", sev:4, colour:"var(--block)"},
  "HUNG?":          {cls:"hung",    sev:3, colour:"var(--bad)"},
  "HUNG!!":         {cls:"hung",    sev:3, colour:"var(--bad)"},
  "SDK STALE?":     {cls:"hung",    sev:3, colour:"var(--bad)"},
  "NO TRANSCRIPT":  {cls:"hung",    sev:3, colour:"var(--bad)"},
  busy:             {cls:"busy",    sev:2, colour:"var(--ok)"},
  sdk:              {cls:"busy",    sev:2, colour:"var(--ok)"},
  "sdk-ts":         {cls:"quiet",   sev:1, colour:"var(--info)"},
  shell:            {cls:"quiet",   sev:1, colour:"var(--info)"},
  unknown:          {cls:"quiet",   sev:1, colour:"var(--dim)"},
  idle:             {cls:"idle",    sev:0, colour:"var(--dim)"},
};
const kindOf = r => KIND[r.token] || {cls:"quiet", sev:r.sev, colour:"var(--dim)"};

// A little standing figure. Drawn as SVG rather than an emoji so the colour
// tracks the status and the parts can be animated independently — the raised
// arm on a session that is blocked on you is the whole point of this view.
// Built with svgEl rather than an innerHTML template string (FR-016/V1/V2):
// this is the figure primitive's art, assembled fresh into a detached node
// each call and handed to updateFigure() to attach — no innerHTML assignment
// anywhere on the page's refresh path except the one turn body.
function figure(r, w, h) {
  const k = kindOf(r);
  const c = k.colour;
  const ctx = VOLATILE && r.context && r.context.used_percentage != null
            ? Math.min(100, Math.max(0, r.context.used_percentage)) : null;
  // Context fill is drawn as a level inside the body: a session close to
  // compacting is worth seeing before it happens.
  const fillH = ctx == null ? 0 : (14 * ctx / 100);
  const svg = svgEl("svg", {class: "figure", viewBox: "0 0 40 44",
    width: w || 40, height: h || 44, "aria-hidden": "true"});
  const body = svgEl("g", {class: "body"});
  if (k.cls === "waiting") {
    const bubble = svgEl("g", {class: "bubble"});
    bubble.appendChild(svgEl("rect", {x: 24, y: 1, width: 14, height: 11, rx: 3, fill: c, opacity: .22}));
    const bang = svgEl("text", {x: 31, y: 9.5, "text-anchor": "middle", "font-size": 8, fill: c});
    bang.textContent = "!";
    bubble.appendChild(bang);
    body.appendChild(bubble);
  }
  if (k.cls === "idle") {
    const z = svgEl("text", {x: 30, y: 9, "font-size": 7, fill: "var(--dim)"});
    z.textContent = "z";
    body.appendChild(z);
  }
  body.appendChild(svgEl("circle", {cx: 20, cy: 12, r: 5.4, fill: "none", stroke: c, "stroke-width": 1.6}));
  if (k.cls === "hung") {
    const q = svgEl("text", {x: 20, y: 15, "text-anchor": "middle", "font-size": 7, fill: c});
    q.textContent = "?";
    body.appendChild(q);
  }
  body.appendChild(svgEl("rect", {
    x: 14.6, y: 19, width: 10.8, height: 15, rx: 4,
    fill: k.cls === "quiet" ? "none" : c, "fill-opacity": k.cls === "quiet" ? 0 : .16,
    stroke: c, "stroke-width": 1.6,
  }));
  if (ctx != null) {
    body.appendChild(svgEl("rect", {
      x: 15.6, y: 20 + (14 - fillH), width: 8.8, height: fillH, rx: 2,
      fill: ctx >= 80 ? "var(--bad)" : ctx >= 60 ? "var(--warn)" : c, opacity: .55,
    }));
  }
  const arm = svgEl("g", {class: "arm"});
  arm.appendChild(svgEl("line", {
    x1: 25.4, y1: 22, x2: k.cls === "waiting" ? 31 : 29, y2: k.cls === "waiting" ? 13 : 27,
    stroke: c, "stroke-width": 1.6, "stroke-linecap": "round",
  }));
  body.appendChild(arm);
  body.appendChild(svgEl("line", {x1: 14.6, y1: 22, x2: 10.5, y2: 27, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  body.appendChild(svgEl("line", {x1: 17.5, y1: 34, x2: 16, y2: 42, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  body.appendChild(svgEl("line", {x1: 22.5, y1: 34, x2: 24, y2: 42, stroke: c, "stroke-width": 1.6, "stroke-linecap": "round"}));
  svg.appendChild(body);
  return svg;
}

// Within a territory the project prefix is redundant and eats the width that
// would otherwise show what distinguishes one agent from another.
// Inside a territory the repo name is redundant and eats the width that would
// otherwise show what distinguishes one agent from another. Session names are
// derived from the DIRECTORY, which may differ from the repo, so both are
// tried.
function shortName(r) {
  const cands = [r.project, (r.repo || "").split("/").pop(),
                 (r.cwd || "").split("/").filter(Boolean).pop()]
                .filter(Boolean).sort((a, b) => b.length - a.length);
  for (const p of cands)
    if (r.name.startsWith(p + "-")) return r.name.slice(p.length + 1);
  return r.name;
}

// The one and only thing this file may hand plots.js: strings identifying who
// something is (data-model.md §2). No sev/psev/token/quiet/waited/context/
// rss_mb/cost/age/pipeline/deploys, and no row order, may reach this tree.
const NO_REPO = "no repo";

function buildWorldModel(s) {
  const districts = {};      // org -> {org, isNoRepo, buildings: {slug -> ...}}
  const districtsByKey = {}; // "d|<org>" -> {org, isNoRepo}
  const buildingsByKey = {}; // "b|<org>|<slug>" -> {slug, label, hasRemote, unfinished, deploys}
  const zonesByKey = {};     // "z|<slug>|<branch>" -> {branch}
  const figuresByKey = {};   // "f|<slug>|<branch>|<sid>" -> row
  const buildingBySlugRepo = {}; // row.repo -> building, for exact deploy matching

  function ensureDistrict(org, isNoRepo) {
    if (!districts[org]) {
      districts[org] = {org, isNoRepo, buildings: {}};
      // DistrictSummary accumulators (data-model.md §5), finalised below once
      // every session/unfinished row has been seen.
      districtsByKey["d|" + org] = {org, isNoRepo, n: 0, worst: null,
                                     unfinishedCount: 0, unfinishedText: null};
    }
    return districts[org];
  }
  function ensureBuilding(d, slug, label, hasRemote) {
    if (!d.buildings[slug]) {
      d.buildings[slug] = {slug, label, hasRemote, zones: {}, unfinished: [], deploys: []};
      buildingsByKey["b|" + d.org + "|" + slug] = d.buildings[slug];
    }
    return d.buildings[slug];
  }
  function ensureZone(b, slug, branchKey) {
    if (!b.zones[branchKey]) {
      b.zones[branchKey] = {branch: branchKey, figures: []};
      zonesByKey["z|" + slug + "|" + branchKey] = b.zones[branchKey];
    }
    return b.zones[branchKey];
  }

  for (const r of (s.sessions || [])) {
    const hasRemote = !!r.repo;
    const org = hasRemote ? r.repo.split("/")[0] : NO_REPO;
    const slug = r.repo || ("dir:" + (r.cwd || "?"));
    const label = r.repo || r.project || slug;
    const branchKey = r.branch || "?";
    const d = ensureDistrict(org, !hasRemote);
    const b = ensureBuilding(d, slug, label, hasRemote);
    const z = ensureZone(b, slug, branchKey);
    z.figures.push({sid: r.sid});
    figuresByKey["f|" + slug + "|" + branchKey + "|" + r.sid] = r;
    if (r.repo) buildingBySlugRepo[r.repo] = b;
    // Sessions arrive in the CLI's own [sev, psev] order (bin/ccwatch:920), so
    // the first row seen for a district is already its worst (data-model.md
    // §5) — no re-sort needed here.
    const dMeta = districtsByKey["d|" + org];
    dMeta.n++;
    if (dMeta.worst == null) dMeta.worst = r.token;
  }
  for (const u of (s.unfinished || [])) {
    const hasRemote = !!u.repo;
    const org = hasRemote ? u.repo.split("/")[0] : NO_REPO;
    // No `cwd` on an unfinished-run row — `project` is the only directory
    // hint it carries (data-model.md §2's cwd rule applies to live rows).
    const slug = u.repo || ("dir:" + (u.project || "?"));
    const label = u.repo || u.project || slug;
    const d = ensureDistrict(org, !hasRemote);
    const b = ensureBuilding(d, slug, label, hasRemote);
    b.unfinished.push(u);
    if (u.repo) buildingBySlugRepo[u.repo] = b;
    // The badge text this replaces at far (FR-022), so the aggregate carries
    // the fact rather than dropping it (FR-029) — same wording as the
    // per-building badge (updateBuilding below).
    const dMeta = districtsByKey["d|" + org];
    dMeta.unfinishedCount++;
    if (dMeta.unfinishedText == null)
      dMeta.unfinishedText = `${u.phase}/${u.crashed ? "CRASHED" : u.status}`;
  }
  // Exact match on owner/name — see the note this replaces at the old
  // territory()/tick() call site: matching on a directory basename let a
  // deploy on acme/checkout-api silently never find its building.
  for (const dep of ((s.deploys && s.deploys.runs) || [])) {
    const b = buildingBySlugRepo[dep.repo];
    if (b) b.deploys.push(dep);
  }

  // Finalise DistrictSummary.unfinished — the representative text plus a
  // "+N" for any others (data-model.md §5) — now that every row is seen.
  for (const k in districtsByKey) {
    const m = districtsByKey[k];
    m.unfinished = m.unfinishedCount
      ? m.unfinishedText + (m.unfinishedCount > 1 ? ` +${m.unfinishedCount - 1}` : "")
      : null;
  }

  const tree = Object.keys(districts).map(org => {
    const d = districts[org];
    return {
      org: d.org,
      buildings: Object.keys(d.buildings).map(slug => {
        const b = d.buildings[slug];
        return {
          slug: b.slug,
          zones: Object.keys(b.zones).map(br => {
            const z = b.zones[br];
            return {branch: z.branch, figures: z.figures};
          }),
        };
      }),
    };
  });

  return {tree, districtsByKey, buildingsByKey, zonesByKey, figuresByKey};
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function titleEl(text) {
  const t = svgEl("title", {});
  t.textContent = text;
  return t;
}

// The one reconciliation primitive (research.md D4): create/update/remove by
// identity key, never a wholesale rebuild. `key` namespaces the index kept on
// `parentEl` (`camera` holds four kinds of child — district/building/zone/
// figure — reconciled by three separate calls sharing one parent, so each
// gets its own slice rather than one call's absentees deleting another's
// children). `make()` returns a freshly created element; `update(el, model)`
// writes attributes/text onto an existing one. Anything indexed under `key`
// whose identity is missing from `wanted` is removed.
function reconcile(parentEl, wanted, key, make, update) {
  if (!parentEl._reconcileIndex) parentEl._reconcileIndex = {};
  if (!parentEl._reconcileIndex[key]) parentEl._reconcileIndex[key] = {};
  const index = parentEl._reconcileIndex[key];
  for (const id in index) {
    if (!wanted.hasOwnProperty(id)) {
      index[id].remove();
      delete index[id];
    }
  }
  for (const id in wanted) {
    const model = wanted[id];
    let el = index[id];
    if (!el) {
      el = make(id, model);
      index[id] = el;
      parentEl.appendChild(el);
    }
    update(el, model);
  }
}

// One primitive per level (research.md D4), each owning all of its own art
// plus a `<rect class="hit">` independent of that art, so a later sprite swap
// touches only the primitive. None of them reads anything but the geometry
// place() computed and the identity/label fields already excluded from it.
// Split make/update so reconcile() can create a node once and write to the
// SAME node on every later tick — the node's identity, not its content, is
// what a hover/focus/selection is anchored to.
function makeDistrict() {
  const g = svgEl("g", {class: "district"});
  g.appendChild(svgEl("rect", {class: "hit", rx: 3}));
  g.appendChild(svgEl("title", {}));
  g.appendChild(svgEl("text", {class: "dlabel", x: 3, y: 8}));
  // The far-level aggregate (data-model.md §5); shown only at data-lod="far",
  // hidden everywhere else (contracts/page-camera.md §3).
  g.appendChild(svgEl("text", {class: "dsummary", x: 3, y: 18}));
  return g;
}
function updateDistrict(g, {geo, meta}) {
  g.setAttribute("transform", `translate(${geo.x},${geo.y})`);
  const hit = g.querySelector(".hit");
  hit.setAttribute("width", geo.w); hit.setAttribute("height", geo.h);
  g.querySelector("title").textContent = meta.isNoRepo
    ? "no repo — grouped by directory, no git remote" : meta.org;
  const label = meta.isNoRepo ? NO_REPO : meta.org;
  g.querySelector(".dlabel").textContent = label;
  // "<org> · <n> sessions · <worst>" with " · <unfinished>" appended when
  // present (data-model.md §5) — a maximum the payload supplied, printed
  // verbatim, never a derived status (FR-027).
  let summary = `${label} · ${meta.n} session${meta.n === 1 ? "" : "s"} · ${meta.worst}`;
  if (meta.unfinished) summary += ` · ${meta.unfinished}`;
  g.querySelector(".dsummary").textContent = summary;
}

function makeBuilding() {
  const g = svgEl("g", {class: "building"});
  g.appendChild(svgEl("rect", {class: "hit", rx: 2}));
  g.appendChild(svgEl("title", {}));
  g.appendChild(svgEl("text", {class: "blabel", x: 2, y: 6}));
  g.appendChild(svgEl("text", {class: "norepo-badge", "text-anchor": "end"}));
  g.appendChild(svgEl("g", {class: "badges"}));
  return g;
}
function updateBuilding(g, {geo, meta}) {
  g.setAttribute("class", "building" + (meta.unfinished.length ? " has-unfinished" : ""));
  g.setAttribute("transform", `translate(${geo.x},${geo.y})`);
  const hit = g.querySelector(".hit");
  hit.setAttribute("width", geo.w); hit.setAttribute("height", geo.h);
  g.querySelector("title").textContent =
    meta.label + (meta.hasRemote === false ? " (no repo)" : "");
  g.querySelector(".blabel").textContent = meta.label;
  const norepo = g.querySelector(".norepo-badge");
  if (meta.hasRemote === false) {
    norepo.setAttribute("x", geo.w - 2); norepo.setAttribute("y", 6);
    norepo.textContent = NO_REPO;
  } else {
    norepo.textContent = "";
  }
  // Badges are rebuilt wholesale on each update: they carry no hover/focus/
  // selection state of their own (plain <text>, no interaction), so there is
  // nothing reconciliation would preserve here that a fresh set does not.
  const badges = g.querySelector(".badges");
  badges.textContent = "";
  let by = 12;
  for (const u of meta.unfinished) {
    const el = svgEl("text", {class: "wreck-badge", x: 2, y: by});
    el.textContent = `${u.phase}/${u.status}`;
    el.appendChild(titleEl(`${u.feature} · $${(u.cost || 0).toFixed(2)}`
      + (u.age != null ? ` · ${dur(u.age)} ago` : "")));
    badges.appendChild(el);
    by += 5;
  }
  for (const d of meta.deploys) {
    const state = d.live ? "RUNNING" : String(d.conclusion || "?").toUpperCase();
    const el = svgEl("text", {class: "deploy-badge", x: 2, y: by});
    el.textContent = state;
    el.appendChild(titleEl(`${d.workflowName} · ${d.headBranch}`));
    badges.appendChild(el);
    by += 5;
  }
}

function makeZone() {
  const g = svgEl("g", {class: "zone"});
  g.appendChild(svgEl("rect", {class: "hit", rx: 1}));
  g.appendChild(svgEl("title", {}));
  g.appendChild(svgEl("text", {class: "zlabel", x: 2, y: 5}));
  return g;
}
function updateZone(g, {geo, meta}) {
  g.setAttribute("transform", `translate(${geo.x},${geo.y})`);
  const hit = g.querySelector(".hit");
  hit.setAttribute("width", geo.w); hit.setAttribute("height", geo.h);
  g.querySelector("title").textContent = "branch " + meta.branch;
  g.querySelector(".zlabel").textContent = meta.branch;
}

// A one-line delegation to CCWATCH_ROSTER.titleText (FR-012): the figure's
// hover reading and the roster row are built from the same rowFields output,
// so they can never state different things.
function titleBits(r) {
  return CCWATCH_ROSTER.titleText(r, VOLATILE);
}

// Pose/colour/emphasis exactly as agentCard() drew them; position comes
// entirely from `geo`, which place() derived from identity alone (FR-006).
// The figure's own art (`.figart`) is rebuilt wholesale on every update — it
// carries no hover/focus/selection state — but the outer `<g class="agent">`
// node, its hit rect and its dataset are the SAME node across ticks, which is
// what a click handler, a `:hover` and the reconcile index all key off.
function makeFigure() {
  // ⚠️ A figure is one of the four ways into the modal, and two of those four
  // are keyboard. An SVG <g> is not focusable and has no role by default, so
  // without these it is reachable by pointer only — which would make the map
  // a control that some people simply cannot operate, and would leave the
  // roster as the sole path to an agent rather than the equivalent one.
  const g = svgEl("g", {class: "agent clickable", tabindex: "0", role: "button"});
  g.appendChild(svgEl("g", {class: "figart"}));
  g.appendChild(svgEl("rect", {class: "hit"}));
  g.appendChild(svgEl("title", {}));
  g.appendChild(svgEl("text", {class: "alabel"}));
  return g;
}
function updateFigure(g, {geo, row}) {
  const k = kindOf(row);
  // Figure emphasis (contracts/page-roster.md §6, FR-019): a class on this
  // outer node, from the page-level selectedSid, never inside .figart below
  // (which is rebuilt wholesale on every call and carries no such state).
  const sel = row.sid === selectedSid ? " selected" : "";
  g.setAttribute("class", `agent sev${k.sev} ${k.cls}${sel} clickable`);
  g.setAttribute("transform", `translate(${geo.x},${geo.y})`);
  g.dataset.sid = row.sid;
  g.dataset.name = row.name;
  const figart = g.querySelector(".figart");
  figart.textContent = "";
  figart.appendChild(figure(row, geo.w, geo.h));
  const hit = g.querySelector(".hit");
  hit.setAttribute("width", geo.w); hit.setAttribute("height", geo.h);
  // ⚠️ Both the <title> and the aria-label are written from titleBits(row), so
  // a hover tooltip and a screen reader cannot describe the same figure
  // differently — computing them separately is how they drift apart.
  //
  // The aria-label carries the "agent <name>:" prefix that the tooltip gets
  // for free from its visual context: a pointer user can see which figure they
  // are over, and someone tabbing through cannot.
  g.querySelector("title").textContent = titleBits(row);
  g.setAttribute("aria-label", "agent " + row.name + ": " + titleBits(row));
  const label = g.querySelector(".alabel");
  label.setAttribute("x", geo.w / 2); label.setAttribute("y", geo.h - .5);
  label.textContent = shortName(row);
}

// Message lines are drawn between the two figures involved, wherever they are —
// including across territories, which is the case worth seeing. Positioned
// entirely from the `cx`/`cy` world centres place() returned this tick — never
// getBoundingClientRect() — so a wire is exactly as stable under the camera's
// transform as the figures it connects (FR-021, V6).
function makeWire() {
  const g = svgEl("g", {class: "wire"});
  g.appendChild(svgEl("path", {fill: "none", stroke: "var(--info)",
    opacity: ".42", "marker-end": "url(#ah)"}));
  const bubble = svgEl("g", {class: "bubble"});
  const scale = svgEl("g", {class: "bubblescale"});
  scale.appendChild(svgEl("circle", {cx: 0, cy: 0, r: 8, fill: "var(--ground)",
    stroke: "var(--info)", "stroke-opacity": ".5", "stroke-width": "1"}));
  scale.appendChild(svgEl("text", {fill: "var(--info)", "text-anchor": "middle", y: 3}));
  bubble.appendChild(scale);
  g.appendChild(bubble);
  return g;
}
function updateWire(g, {p, q, count}) {
  // Bowed, so A→B and B→A are two visible lines rather than one overdrawn.
  const mx = (p.x + q.x)/2, my = (p.y + q.y)/2;
  const dx = q.x - p.x, dy = q.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const bow = Math.min(48, len * 0.18);
  const cx = mx - (dy/len) * bow, cy = my + (dx/len) * bow;
  const w = Math.min(3.2, 0.7 + Math.log2(1 + count) * 0.7);
  const path = g.querySelector("path");
  path.setAttribute("d", `M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`);
  path.style.setProperty("--wire-w", w);
  const bubble = g.querySelector(".bubble"), text = g.querySelector("text");
  // Only worth labelling when it is more than one message — a "1" on every
  // line is clutter that buries the edge that actually has traffic. Placed
  // near the SENDER rather than at the apex: the apex lands in the middle of
  // whatever the line crosses, which was reliably a territory's own text.
  if (count > 1) {
    const t = 0.22;   // quadratic Bézier at t, close to the source
    const lx = (1-t)*(1-t)*p.x + 2*(1-t)*t*cx + t*t*q.x;
    const ly = (1-t)*(1-t)*p.y + 2*(1-t)*t*cy + t*t*q.y;
    bubble.setAttribute("transform", `translate(${lx} ${ly})`);

    const centreByName = {};
    for (const k in placed.figuresByKey) {
      const row = placed.figuresByKey[k];
      const geo = placed.world.figures[k];
      if (row && geo) centreByName[row.name] = {x: geo.cx, y: geo.cy};
    }
    for (const e of peers.edges) {
      const p = centreByName[e.from], q = centreByName[e.to];
      // Only edges where BOTH ends are on the map. A line to a session that
      // has exited would be a line to nowhere, and the peers panel in the
      // table view already lists those.
      if (!p || !q || e.from === e.to) continue;
      wanted[`${e.from}->${e.to}`] = {p, q, count: e.count};
      drawn++;
    }
  }
  reconcile(camera, wanted, "wire", makeWire, updateWire);
  return drawn;
}

// A session killed by the OS leaves the same trace as one that exited
// cleanly, so without this the dashboard can say an agent is gone but not why.
// Built once, updated in place (FR-016/V1): the bold lead-in never changes,
// only the trailing text node does.
const hostwarnEls = (function () {
  const el = $("hostwarn");
  if (!el) return null;
  const lead = document.createElement("b"); lead.textContent = "host under memory pressure";
  const rest = document.createTextNode("");
  el.append(lead, rest);
  return {el, rest};
})();
function hostwarn(h) {
  if (!hostwarnEls) return;
  const {el, rest} = hostwarnEls;
  if (!h || !h.pressure) { el.className = ""; rest.textContent = ""; return; }
  el.className = "on";
  // Every memory figure here is in the VOLATILE set (data-model.md §5): the
  // pressure itself still appears at its own threshold (FR-044), but the
  // numbers behind it are withheld, not annotated, while the feed is not
  // fully trusted.
  if (!VOLATILE) {
    rest.textContent = " — readings withheld while the feed is unreliable."
      + " The OS may kill sessions, and a killed session looks exactly like a clean exit.";
    return;
  }
  // The sessions' own share is stated, so "would killing agents help" is a
  // number rather than a hunch. Usually it is a small fraction of the total.
  const share = h.sessions_mb != null
    ? ` Sessions account for ${h.sessions_mb}MB of it (${h.idle_mb || 0}MB of that idle).` : "";
  rest.textContent = ` — swap ${h.swap_used_pct}% used `
    + `(${h.swap_used_mb}/${h.swap_total_mb}MB), ${h.ram_free_mb}MB RAM free. `
    + `The OS may kill sessions, and a killed session looks exactly like a clean exit.`
    + share;
}

// One gauge span per reading, reconciled by name so the DOM node behind each
// percentage survives a tick (FR-016/V1); the two full-panel messages (no
// usage at all, or the whole reading stale) replace the gauge set with a
// single persistent note node instead.
function makeGaugeSpan() {
  const span = document.createElement("span");
  const label = document.createElement("span"); label.className = "g-label";
  const val = document.createElement("span"); val.className = "g-val";
  span.append(label, document.createTextNode(" "), val, document.createTextNode(" "));
  const reset = document.createElement("span"); reset.className = "g-reset";
  span.appendChild(reset);
  return span;
}
function updateGaugeSpan(span, g) {
  const band = p => p >= 90 ? "var(--bad)" : p >= 70 ? "var(--warn)" : "var(--ink)";
  span.querySelector(".g-label").textContent = g.name;
  const val = span.querySelector(".g-val");
  val.textContent = `${Math.floor(g.x.used_percentage)}%`;
  val.style.color = band(g.x.used_percentage);
  span.querySelector(".g-reset").textContent =
    g.x.resets_at ? `resets ${dur(g.x.resets_at - g.now)}` : "";
}
const gaugesEls = (function () {
  const el = $("gauges");
  const note = document.createElement("span"); note.style.display = "none";
  el.appendChild(note);
  return {el, note};
})();
function updateGauges(u) {
  const {el, note} = gaugesEls;
  if (!u) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "dim"; note.style.display = "";
    note.textContent = "usage not reporting — run ccwatch install-statusline";
    return;
  }
  // Withheld while the feed itself is not trusted (FR-029) — on top of, not
  // instead of, the reading's own staleness window below.
  if (!VOLATILE) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "stale"; note.style.display = "";
    note.textContent = "usage: withheld while the feed is unreliable";
    return;
  }
  // Withheld rather than annotated past the staleness limit. A percentage on
  // screen is read as current whatever is printed beside it — a fixture left
  // over from an earlier run showed 52% while the real figure was 7%.
  if (u.age > (u.stale_after || 600)) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "stale"; note.style.display = "";
    note.textContent = `usage: last reading ${dur(u.age)} old — not shown`;
    return;
  }
  note.style.display = "none"; note.textContent = "";
  const now = Date.now() / 1000;
  const wanted = {};
  if (u.five_hour) wanted["5h"] = {name: "5h", x: u.five_hour, now};
  if (u.seven_day) wanted["7d"] = {name: "7d", x: u.seven_day, now};
  if (u.seven_day_opus) wanted["7dop"] = {name: "7d opus", x: u.seven_day_opus, now};
  reconcile(el, wanted, "gauge", makeGaugeSpan, updateGaugeSpan);

  }

// Built once, updated in place (FR-016/V1): the live-count sentence plus its

// ---- inspector -------------------------------------------------------------
// subject is who the modal is open for (data-model.md §2); opener is where
// focus returns to on close (D5) — kept separate because closing must restore
// focus even after subject has been cleared.
let subject = null;
let opener = null;

// The one and only setInterval in this file, shared by every periodic thing
// on the page (the roster poll and the open conversation's own cadence) so a
// hidden (backgrounded) tab does no periodic work of any kind.
const timers = {};
function every(name, ms, fn) {
  if (timers[name]) clearInterval(timers[name]);
  timers[name] = setInterval(fn, ms);
}
function clearEvery(name) {
  if (timers[name]) { clearInterval(timers[name]); timers[name] = null; }
}

const WHO = {said:"you", assistant:"claude", system:"system", tool_result:"result"};

// Which turns are markdown. What Claude and you write is; a system reminder and
// a "← 4821 bytes" result are not — they are already-reduced machine text, and
// running them through a markdown pass would find headings in XML-ish tags and
// emphasis in file paths, inventing structure that was never in the transcript.
const MD = {assistant:true, said:true};

// ⚠️ Falls back to escaped plain text if md.js failed to load — text intact,
// pre-wrap kept, because a missing renderer must not present itself as a
// session with nothing to say. The class comes off the SAME condition as the
// rendering: tagging a plain-text turn as markdown would drop its newlines.
const isMd = t => !!(MD[t.kind] && window.CCWATCH_MD);

// A message slot for the empty/error states, kept out of the "turn" index so
// reconcile()'s removal pass never touches it. Built once; toggled, not
// replaced.
const convoMsgEl = (function () {
  const box = $("convo");
  const el = document.createElement("div"); el.className = "dim"; el.style.display = "none";
  box.appendChild(el);
  return el;
})();
function setConvoMessage(text, isError) {
  convoMsgEl.textContent = text;
  convoMsgEl.style.color = isError ? "var(--bad)" : "";
  convoMsgEl.style.display = "";
}
function clearConvoMessage() {
  convoMsgEl.style.display = "none";
  convoMsgEl.textContent = "";
}

// One <div class="turn"> per transcript entry, reconciled by identity
// (research.md D4) so an open text selection or a scrolled-to position
// survives a refresh instead of being rebuilt wholesale. `.what`'s single
// remaining innerHTML write is the escape-first-then-tag path Constitution X
// requires (V2) — the container is reconciled, the body is not.
function makeTurn() {
  const div = document.createElement("div");
  const who = document.createElement("div"); who.className = "who";
  const what = document.createElement("div"); what.className = "what";
  div.append(who, what);
  return div;
}
function updateTurn(div, t) {
  const who = t.origin === "peer" ? (t.from || "peer") : (WHO[t.kind] || t.kind);
  div.className = "turn " + t.kind + (t.origin === "peer" ? " peer" : "");
  div.querySelector(".who").textContent = who;
  const what = div.querySelector(".what");
  what.className = "what" + (isMd(t) ? " md" : "");
  if (isMd(t)) what.innerHTML = CCWATCH_MD.render(t.text || "");
  else what.textContent = t.text || "";
}

// atBottom is sampled BEFORE reconciling and, when true, the scroll position
// is pinned to the new bottom AFTER (FR-018, D14) — so a reader scrolled up
// to reread something is never yanked down by a tick they did not ask for.
function renderConvo(row, data, ok, reason) {
  const box = $("convo");
  const wasAtBottom = CCWATCH_MODAL.atBottom({
    scrollTop: box.scrollTop, scrollHeight: box.scrollHeight, clientHeight: box.clientHeight,
  });
  const turns = (data && data.turns) || [];
  const {message, isError} = CCWATCH_MODAL.convoMessage({row, ok, reason, turnCount: turns.length});
  if (message != null) {
    reconcile(box, {}, "turn", makeTurn, updateTurn);
    setConvoMessage(message, isError);
  } else {
    clearConvoMessage();
    // No scroll-position save/restore beyond atBottom above: reconciliation
    // never removes a turn still in `wanted`, so the browser's own scroll
    // position is never disturbed by a refresh in the first place (D4).
    const wanted = {};
    const seenAt = {};
    turns.forEach(t => {
      const dupKey = t.timestamp + "|" + t.kind;
      seenAt[dupKey] = (seenAt[dupKey] || 0) + 1;
      wanted["at|" + t.kind + "|" + t.timestamp + "|" + seenAt[dupKey]] = t;
    });
    reconcile(box, wanted, "turn", makeTurn, updateTurn);
  }
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

async function loadConvo() {
  if (!subject) return;
  const row = lastRows[subject.sid] || null;
  try {
    const res = await fetch(`/api/transcript?sid=${encodeURIComponent(subject.sid)}&n=${CCWATCH_MODAL.TRANSCRIPT_N}`,
                            {cache:"no-store"});
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      renderConvo(row, null, false, j.error || "no transcript");
      return;
    }
    renderConvo(row, await res.json(), true, null);
  } catch (e) {
    renderConvo(row, null, false, e.message);
  }
}

// One question <li> per option, reconciled by index (the option list is the
// one genuinely variable-length part of the ask panel).
function makeQuestion() {
  const div = document.createElement("div");

  return div;
}

  const li = document.createElement("li");

  li.append(document.createTextNode(""), desc);

}

// Built once, updated in place (FR-016/V1): `dialogNote`/`dialogHow` cover
// the no-recorded-question case, `qlist`/`qHow` the normal one — exactly one
// pair is ever visible, toggled by `style.display` rather than by replacing
// either subtree.
const askEls = (function () {
  const box = $("ask");
  const dialogNote = document.createElement("div"); dialogNote.className = "q";
  const dialogHow = document.createElement("div"); dialogHow.className = "how";
  dialogHow.textContent = "No question is recorded in the transcript, so this is a dialog "
    + "(a permission prompt, for example). Its text is only in that session's terminal.";
  const qlist = document.createElement("div");
  const qHow = document.createElement("div"); qHow.className = "how";
  const qHowB = document.createElement("b"); qHowB.textContent = "queued behind it";
  qHow.append(
    document.createTextNode("This is a dialog: it can only be answered in that session's own"
      + " terminal. A message sent from here is "),
    qHowB,

  box.append(dialogNote, dialogHow, qlist, qHow);

  return {box, dialogNote, dialogHow, qlist, qHow};

// (FR-020, FR-023) — rather than re-deriving the same branches here.
function renderAsk(ask) {
  const {box, dialogNote, dialogHow, qlist, qHow} = askEls;
  if (ask.kind === "questions") {
    box.className = "on";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
    qlist.style.display = ""; qHow.style.display = "";
    const wanted = {};
    ask.questions.forEach((q, i) => { wanted["q" + i] = q; });
    reconcile(qlist, wanted, "q", makeQuestion, updateQuestion);
    return;
  }
  qlist.style.display = "none"; qHow.style.display = "none";
  reconcile(qlist, {}, "q", makeQuestion, updateQuestion);

    box.className = "on";

    dialogNote.textContent = ask.note;

    box.className = "";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
  }
}

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding.
// Built once, listeners attached once (FR-016/V1): only the text content
// changes per render. `killEls.row` is the closure `killgo`'s listener reads,
// updated on every renderKill() call rather than re-bound.
const killEls = (function () {
  const bar = $("killbar");
  if (!bar) return null;
  const startBtn = document.createElement("button");
  startBtn.className = "danger"; startBtn.id = "killstart";
  const killwhy = document.createElement("span"); killwhy.id = "killwhy";
  const confirmDiv = document.createElement("div"); confirmDiv.id = "killconfirm";
  const desc = document.createElement("div");
  const nameB = document.createElement("b");
  const memB = document.createElement("b");
  const resumeCode = document.createElement("code");
  const phaseB = document.createElement("b");
  const phaseWrap = document.createElement("span"); phaseWrap.style.display = "none";
  phaseWrap.append(document.createTextNode(" It is running spec-run phase "), phaseB,
    document.createTextNode(" — killing it aborts a paid model call."));
  const busyText = document.createTextNode("");
  desc.append(
    document.createTextNode("Killing "), nameB, document.createTextNode(" frees "), memB,
    document.createTextNode(". The conversation is kept — reopen it with "),
    resumeCode, document.createTextNode("."), phaseWrap, busyText);
  const row = document.createElement("div"); row.className = "row";
  const goBtn = document.createElement("button");
  goBtn.className = "danger"; goBtn.id = "killgo"; goBtn.textContent = "yes, kill it";
  const noBtn = document.createElement("button");
  noBtn.className = "ghost"; noBtn.id = "killno"; noBtn.textContent = "cancel";
  const out = document.createElement("span"); out.id = "killout";
  row.append(goBtn, noBtn, out);
  confirmDiv.append(desc, row);
  bar.append(startBtn, killwhy, confirmDiv);
  startBtn.addEventListener("click", () => confirmDiv.classList.add("on"));
  noBtn.addEventListener("click", () => confirmDiv.classList.remove("on"));
  goBtn.addEventListener("click", () => doKill(killEls.row));
  return {bar, startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText, out, row: null};
})();

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding. The bar is always present (FR-028); only
// #killstart's disabled attribute and #killwhy's text change.
function renderKill(kill) {
  if (!killEls) return;
  const {startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText} = killEls;
  killEls.row = subject ? lastRows[subject.sid] : null;
  startBtn.disabled = kill.state !== "ready";
  startBtn.textContent = kill.startLabel;
  killwhy.textContent = kill.reason ?? "";
  if (!kill.confirmOpen) confirmDiv.classList.remove("on");
  if (kill.confirm) {
    nameB.textContent = kill.confirm.name;
    memB.textContent = kill.confirm.frees ?? kill.confirm.freesNote ?? "";
    resumeCode.textContent = kill.confirm.resume;
    if (kill.confirm.phase) {
      phaseWrap.style.display = ""; phaseB.textContent = kill.confirm.phase;
    } else {
      phaseWrap.style.display = "none";
    }
    busyText.textContent = kill.confirm.busy
      ? " It is mid-turn, so a tool call may be left half-applied." : "";
  }
}

async function doKill(row) {
  // Independent of the disabled attribute (D17): a disabled control issues
  // no request even if the handler is somehow reached (FR-029).
  if (!CAN_KILL || !row) return;
  const out = $("killout");
  out.className = ""; out.textContent = "killing…";
  try {
    const res = await fetch("/api/kill", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: row.sid}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    // A refusal is shown verbatim: it explains what would have been lost, and
    // reducing it to "failed" would throw away the only useful part.
    out.textContent = j.state === "killed"
      ? `killed — ${row.rss_mb != null ? row.rss_mb + "MB" : "memory"} released`
      : (j.detail || j.error || "failed");
    if (j.state === "killed") setTimeout(closeModal, 1200);
  } catch (e) {
    out.className = "failed";
    out.textContent = "the kill request did not complete: " + e.message;
  }
}

// One function, called from openModal(), from applyFeed() on every tick, and
// from the kill/send handlers (page-modal.md §3). Writes into existing nodes
// only — nothing in the panel is created, removed or replaced by a render.
function renderModal() {
  if (!subject) return;
  const row = lastRows[subject.sid] ?? null;
  const fields = row ? CCWATCH_ROSTER.rowFields(row, {volatile: VOLATILE}) : null;
  const names = (lastBody && lastBody.sessions || []).map(r => r.name);
  const edges = (lastBody && lastBody.peers && lastBody.peers.edges) || [];
  // ⚠️ `lastCond` — the same object the banner above the map and the roster
  // read, never a second computation of the same judgement. Two renderings
  // that decide independently whether the feed can be trusted will eventually
  // disagree, and a reader has no way to tell which of them is lying
  // (principle XI).
  const m = CCWATCH_MODAL.panel({
    row, fields, subject, names, edges, cond: lastCond,
    volatile: VOLATILE, canSend: CAN_SEND, canKill: CAN_KILL,
    confirmOpen: killEls ? killEls.confirmDiv.classList.contains("on") : false,
  });
  $("iname").textContent = m.header.name;
  $("istatus").textContent = m.header.status ?? "";
  const ifeed = $("ifeed");
  const main = ifeed.querySelector(".main"), unreadable = ifeed.querySelector(".unreadable");
  main.textContent = m.feed.main;
  main.className = "main" + (m.feed.mainKind ? " " + m.feed.mainKind : "");
  unreadable.textContent = m.feed.unreadable;
  const igone = $("igone");
  igone.textContent = m.gone ?? "";
  igone.classList.toggle("on", m.gone != null);
  reconcile($("istats"), keyBy(m.stats, l => l.key), "stat", makeStatLine, updateStatLine);
  renderAsk(m.ask);
  renderKill(m.kill);
  $("replyText").disabled = $("replySend").disabled = m.send.state !== "ready";
  $("sendwhy").textContent = m.send.reason ?? "";
}
function keyBy(arr, fn) {
  const o = {};
  arr.forEach(x => { o[fn(x)] = x; });
  return o;
}
function makeStatLine() {
  const div = document.createElement("div");
  const dt = document.createElement("dt");
  const dd = document.createElement("dd");
  div.append(dt, dd);
  return div;
}
function updateStatLine(div, l) {
  div.querySelector("dt").textContent = l.label;
  div.querySelector("dd").textContent = l.text;
}

function openModal(sid, name, kind) {
  subject = {sid, name};
  opener = {sid, kind};
  $("replyText").value = "";
  $("replyOut").textContent = ""; $("replyOut").className = "";
  $("killout").textContent = ""; $("killout").className = "";
  if (killEls) killEls.confirmDiv.classList.remove("on");
  reconcile($("convo"), {}, "turn", makeTurn, updateTurn);
  setConvoMessage("reading the transcript…");
  renderModal();
  $("agentmodal").showModal();
  const canSend = CAN_SEND && !!lastRows[sid];
  (canSend ? $("replyText") : $("iclose")).focus();
  loadConvo();

  // read from disk per request and is much heavier than the roster poll.
  every("convo", 5000, loadConvo);

// Focus restored by identity (D5): live row for opener.sid, else the live

function closeModal() {
  subject = null;

  $("agentmodal").close();
  const o = opener;
  opener = null;
  if (!o) return;
  const row = $(`.rrow[data-sid="${o.sid}"]`);
  if (row) { row.focus(); return; }
  const fig = document.querySelector(`.agent[data-sid="${o.sid}"]`);
  if (fig) { fig.focus(); return; }

async function doSend() {

  // no request even if the handler is somehow reached (FR-027).
  if (!CAN_SEND || !subject || !lastRows[subject.sid]) return;
  const msg = $("replyText").value.trim();
  if (!msg) return;
  const btn = $("replySend"), out = $("replyOut");
  btn.disabled = true; out.className = "";
  out.textContent = "sending, then checking it arrived…";
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: subject.sid, message: msg}),

$("iclose").addEventListener("click", closeModal);
$("agentmodal").addEventListener("cancel", () => { closeModal(); });
$("replyText").addEventListener("keydown", e => {

let lastRows = {};
document.addEventListener("click", e => {

// ---- camera ------------------------------------------------------------
// contracts/page-camera.md §2 — built with DOM APIs, never innerHTML, so

const camctl = document.createElement("div");
camctl.id = "camctl";
const zoutBtn = document.createElement("button");
zoutBtn.id = "zout"; zoutBtn.type = "button"; zoutBtn.textContent = "zoom out";
const zinBtn = document.createElement("button");
zinBtn.id = "zin"; zinBtn.type = "button"; zinBtn.textContent = "zoom in";
const zfitBtn = document.createElement("button");

const camnote = document.createElement("span");

// FR-004, FR-039 — same ladder step and fit the keyboard uses, anchored at
// the viewport centre rather than a pointer position the button click has none of.
zoutBtn.addEventListener("click", () => {
  view = CCWATCH_CAMERA.clampPan(
    CCWATCH_CAMERA.zoomTo(view, view.idx - 1, $("world").clientWidth / 2, $("world").clientHeight / 2),
    worldExtent, $("world").clientWidth, $("world").clientHeight);
  applyView();
  flushPendingSave();

zinBtn.addEventListener("click", () => {

    CCWATCH_CAMERA.zoomTo(view, view.idx + 1, $("world").clientWidth / 2, $("world").clientHeight / 2),
    worldExtent, $("world").clientWidth, $("world").clientHeight);

// contracts/page-camera.md §1 — the single writer. Every camera path calls
// this and nothing else; it touches no district/building/zone/figure/badge/
// wire node (FR-044, SC-008).
let view = {idx: 2, tx: 0, ty: 0};
let level = null; // DetailLevel (data-model.md §3); recomputed from levelFor(idx, level)
let worldExtent = null; // OccupiedExtent (data-model.md §4); the clamp's bound
let overflow = false;
let pendingSave = null; // StoredViewport | null (data-model.md §6), flushed by the callers of applyView()

// The one new persisted record (data-model.md §6), separate from
// ccwatch.map.plots.v1. Storage calls are injected exactly as plots.js's own
// key already is, so a throwing localStorage cannot take the map down.
const VIEW_KEY = "ccwatch.map.view.v1";

  if (!pendingSave) return;

    try { localStorage.setItem(VIEW_KEY, v); } catch (e) { /* unavailable — camera.js records it */ }
  }, pendingSave);

// contracts/page-camera.md §5 — the load order. Runs exactly once, the first
// time there is an extent to clamp against: a record that fails validation or
// clamps to a rectangle that intersects nothing placed falls back to fitView
// (FR-036–FR-038) rather than opening on empty ground.
function loadStoredView(placed) {
  const vw = $("world").clientWidth, vh = $("world").clientHeight;
  const raw = CCWATCH_CAMERA.loadView(function () {
    try { return localStorage.getItem(VIEW_KEY); } catch (e) { return null; }
  });
  let restored = raw ? CCWATCH_CAMERA.clampPan(raw, worldExtent, vw, vh) : null;
  if (restored) {
    const rect = CCWATCH_CAMERA.visibleWorldRect(restored, vw, vh);
    const groups = ["districts", "buildings", "zones", "figures"];
    const hit = groups.some(g => Object.keys(placed.world[g]).some(
      k => CCWATCH_CAMERA.intersects(rect, placed.world[g][k])));
    if (!hit) restored = null;

  view = restored || CCWATCH_CAMERA.fitView(worldExtent, vw, vh);
  overflow = view.overflow || false;
  level = CCWATCH_CAMERA.levelFor(view.idx, null); // the cold mapping (FR-041)
}

function applyView() {
  const k = CCWATCH_CAMERA.scaleFor(view.idx);
  $("camera").setAttribute("transform", `translate(${view.tx} ${view.ty}) scale(${k})`);
  const world = $("world");
  world.style.setProperty("--k", k);
  level = CCWATCH_CAMERA.levelFor(view.idx, level);
  world.setAttribute("data-lod", level);
  const atMin = view.idx === 0, atMax = view.idx === CCWATCH_CAMERA.LADDER.length - 1;
  zoutBtn.disabled = atMin;
  zoutBtn.title = atMin ? "already at the widest zoom" : "";
  zinBtn.disabled = atMax;
  zinBtn.title = atMax ? "already at the closest zoom" : "";
  camstate.textContent = `zoom ${k}× · ${level}`;
  camnote.textContent = overflow ? "the whole world does not fit at this zoom"
    : CCWATCH_CAMERA.persistence === "unavailable" ? "the viewport will not be remembered"
    : "";
  pendingSave = {v: CCWATCH_CAMERA.STORAGE_VERSION, idx: view.idx, tx: view.tx, ty: view.ty};

  // against is whatever it was as of the last camera action, which — since
  // only a resize itself changes it — is the size just before this one.

let vpSize = {w: 0, h: 0};

// ---- camera: pointer drag + wheel zoom (contracts/page-camera.md §4) -------
// panBy/clampPan/applyView on move; drag.moved gates the document click
// handler below so a pan never opens the inspector (FR-005). The drag base
// is the {tx,ty} recorded at pointerdown, not the running view, so repeated
// small moves cannot accumulate drift from clampPan re-entering each step.
const drag = {active: false, moved: false, id: null, x: 0, y: 0, tx: 0, ty: 0};
$("world").addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  drag.active = true; drag.moved = false; drag.id = e.pointerId;
  drag.x = e.clientX; drag.y = e.clientY;

  if (!drag.moved) return;
  view = CCWATCH_CAMERA.clampPan(
    CCWATCH_CAMERA.panBy({idx: view.idx, tx: drag.tx, ty: drag.ty}, dx, dy),

// ---- camera: keyboard (contracts/page-camera.md §4, FR-013–FR-015) --------
// The guard returns before doing anything else so a shortcut key typed into

const EDITABLE_SEL = "input, textarea, select, [contenteditable]";

  const t = e.target;
  if ((t && (t.matches(EDITABLE_SEL) || t.isContentEditable)) ||
      (document.activeElement && document.activeElement !== t &&

    return;

    case "ArrowRight": view = CCWATCH_CAMERA.panBy(view, -step, 0); break;
    case "ArrowUp":    view = CCWATCH_CAMERA.panBy(view, 0, step); break;

        $("world").clientWidth / 2, $("world").clientHeight / 2);

// FR-003, FR-006, FR-007 — always preventDefault so the page itself never

// contracts/page-camera.md §6, FR-042 — the API a later roster panel calls.
// No caller ships with this feature; `current()` exists so a roster can read

window.CCWATCH_MAP_CAMERA = {
  centreOn(wx, wy, opts) {
    opts = opts || {};
    const world = $("world");
    view = CCWATCH_CAMERA.clampPan(
      CCWATCH_CAMERA.centreOn(view, wx, wy, world.clientWidth, world.clientHeight, opts.idx),
      worldExtent, world.clientWidth, world.clientHeight);
    if (opts.animate) $("camera").classList.add("eased");

// The eased class is only ever meant to bound one transition (research.md

// ---- world coordinates ------------------------------------------------------
// The one persisted record (data-model.md §4). Storage calls are injected so a
// throwing localStorage — private mode, a full origin quota — cannot take the
// map down; plots.js itself flips `persistence` to "unavailable" once rather
// than retrying every frame.
const PLOTS_KEY = "ccwatch.map.plots.v1";
if (window.CCWATCH_PLOTS) {
  CCWATCH_PLOTS.load(function () {
    try { return localStorage.getItem(PLOTS_KEY); } catch (e) { return null; }
  });
}

// Full rebuild of the world each tick: reconciliation (create/update/remove by
// identity key, nothing rebuilt wholesale) is a later phase's work. What this
// phase guarantees is that the *coordinates* handed to whatever draws them
// never move except on first placement — that guarantee lives entirely in
// plots.js and is unaffected by how the DOM is currently populated.
function drawWorld(s) {
  if (!window.CCWATCH_PLOTS) return null;
  const model = buildWorldModel(s);
  const placed = CCWATCH_PLOTS.place({districts: model.tree, now: Math.floor(Date.now() / 1000)});
  CCWATCH_PLOTS.save(function (v) {
    try { localStorage.setItem(PLOTS_KEY, v); } catch (e) { /* unavailable — plots.js records it */ }
  }, placed.liveKeys);

  const camera = $("camera");
  const districtWanted = {};
  for (const k in placed.world.districts)
    districtWanted[k] = {geo: placed.world.districts[k], meta: model.districtsByKey[k]};
  reconcile(camera, districtWanted, "district", makeDistrict, updateDistrict);

  const buildingWanted = {};
  for (const k in placed.world.buildings)
    buildingWanted[k] = {geo: placed.world.buildings[k], meta: model.buildingsByKey[k]};
  reconcile(camera, buildingWanted, "building", makeBuilding, updateBuilding);

  const zoneWanted = {};
  for (const k in placed.world.zones)
    zoneWanted[k] = {geo: placed.world.zones[k], meta: model.zonesByKey[k]};
  reconcile(camera, zoneWanted, "zone", makeZone, updateZone);

  const figureWanted = {};
  centreBySid = {};
  for (const k in placed.world.figures) {
    const row = model.figuresByKey[k];
    if (!row) continue;
    figureWanted[k] = {geo: placed.world.figures[k], row};
    // D19: plots.js's own cx/cy (web/plots.js:259-261) — the fly target for
    // selectRow, rebuilt fresh every tick since a district reflow moves it.
    centreBySid[row.sid] = {cx: placed.world.figures[k].cx, cy: placed.world.figures[k].cy};
  }
  reconcile(camera, figureWanted, "figure", makeFigure, updateFigure);

  // Recomputed only when the occupied set changes (placed.sig) — never on
  // every tick, since the extent is pure geometry that mostly doesn't move
  // (FR-019, FR-038). The first time there is an extent to clamp against, the
  // stored viewport (or the fit) is loaded (contracts/page-camera.md §5);
  // every later change to the extent only re-clamps the view the viewer
  // already chose, so a shrinking extent pulls it back in without a refit
  // (FR-011, T046).
  if (placed.sig !== lastFit.sig) {
    const firstLoad = lastFit.sig === null;
    lastFit = {sig: placed.sig, extent: placed.extent};
    worldExtent = placed.extent;
    if (firstLoad) loadStoredView(placed);
    else view = CCWATCH_CAMERA.clampPan(view, worldExtent, $("world").clientWidth, $("world").clientHeight);
    applyView();

  // figure's world centre without re-walking the payload (T052).
