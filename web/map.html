// Still needed for the two things that are genuinely drawings rather than

// SVG <g> standing in for a box is now a box.

// The one reconciliation primitive (research.md D4): create/update/remove by
// identity key, never a wholesale rebuild. `key` namespaces the index kept on
// `parentEl`, so one parent can hold several kinds of child without one call's
// absentees deleting another's. `make()` returns a freshly created element;
// `update(el, model)` writes attributes/text onto an existing one. Anything
// indexed under `key` whose identity is missing from `wanted` is removed.
//
// ⚠️ Order is NOT expressed by appending in order, because this never moves an
// existing node: a node created on tick 1 keeps its DOM position for life, and
// the sorted order is carried by a `style.order` written in each `update`. That
// is deliberate. Re-appending children to sort them would move whichever node
// currently has focus, and moving a focused element drops the focus — so a
// keyboard user tabbed onto a figure would lose it every three seconds.
function reconcile(parentEl, wanted, key, make, update) {
  if (!parentEl._reconcileIndex) parentEl._reconcileIndex = {};
  if (!parentEl._reconcileIndex[key]) parentEl._reconcileIndex[key] = {};
  const index = parentEl._reconcileIndex[key];
  for (const id in index) {
    if (!wanted.hasOwnProperty(id)) {
      index[id].remove();
      delete index[id];
    }
  }
  for (const id in wanted) {
    const model = wanted[id];
    let el = index[id];
    if (!el) {
      el = make(id, model);
      index[id] = el;
      parentEl.appendChild(el);
    }
    update(el, model);
  }
}

// One primitive per level (research.md D4). Each owns all of its own markup,
// built with createElement/textContent — never innerHTML — and each is split
// make/update so reconcile() can create a node once and write to the SAME node
// on every later tick: the node's identity, not its content, is what a hover,

}
function updateDistrict(sec, d) {
  sec.style.order = d.ord;

  const label = d.isNoRepo ? NO_REPO : d.org;
  sec.querySelector(".dlabel").textContent = label;
  // "<n> sessions · <worst>" with " · <unfinished>" appended when present
  // (data-model.md §5) — a maximum the payload supplied, printed verbatim,
  // never a derived status (FR-027). The owner's own name is the heading
  // beside it, so it is not repeated here the way it was when this line had
  // to stand in for the whole territory at far zoom.
  let summary = `${d.n} session${d.n === 1 ? "" : "s"} · ${d.worst}`;

function makeBuilding() {
  const art = el("article", "building");
  const head = el("div", "bhead");
  head.append(el("span", "blabel"), el("span", "norepo-badge"));
  art.append(head, el("div", "badges"), el("div", "zones"));
  return art;
}
function updateBuilding(art, b) {
  art.className = "building" + (b.unfinishedRuns.length ? " has-unfinished" : "");
  art.style.order = b.ord;
  // A card with a remote is named by its slug, which is globally unique. A
  // card without one is named by a directory basename, which is not: the hover
  // carries the full path so "which `scratch`" has an answer, and says why
  // there is no repo rather than only that there isn't one.
  art.title = b.hasRemote === false
    ? (b.dir ? b.dir + " — no git remote" : b.label + " — no git remote")
    : b.label;
  art.querySelector(".blabel").textContent = b.label;
  art.querySelector(".norepo-badge").textContent =
    b.hasRemote === false ? NO_REPO : "";
  // Badges are rebuilt wholesale on each update: they carry no hover, focus or
  // selection state of their own — plain spans, no interaction — so there is
  // nothing reconciliation would preserve here that a fresh set does not.
  const badges = art.querySelector(".badges");
  badges.textContent = "";
  for (const u of b.unfinishedRuns) {
    const line = el("div", "wreck-badge");
    line.textContent = `${u.phase}/${u.crashed ? "CRASHED" : u.status}`;
    line.title = `${u.feature} · $${(u.cost || 0).toFixed(2)}`
      + (u.age != null ? ` · ${dur(u.age)} ago` : "");

  }
  for (const d of b.deploys) {
    const line = el("div", "deploy-badge");
    line.textContent = d.live ? "RUNNING" : String(d.conclusion || "?").toUpperCase();
    line.title = `${d.workflowName} · ${d.headBranch}`;

function makeZone() {
  const div = el("div", "zone");
  div.append(el("div", "zlabel"), el("div", "figures"));
  return div;
}
function updateZone(div, z) {
  div.style.order = z.ord;
  const label = div.querySelector(".zlabel");
  // ⚠️ No branch means no branch line, not a placeholder one. The label used to
  // print `r.branch || "?"`, which stated a branch called `?` for a session the
  // payload had explicitly reported as having none — and `?` is this tool's
  // word for "suspected". The CLI omits the clause instead
  // (bin/ccwatch:1328), and `hidden` is how a row omits itself without leaving
  // an empty 10px line where a branch name would have been.
  if (z.branch === NO_BRANCH) {
    label.hidden = true;
    label.textContent = "";
    div.removeAttribute("title");
  } else {
    label.hidden = false;
    label.textContent = z.branch;
    div.title = "branch " + z.branch;

// A one-line delegation to CCWATCH_ROSTER.titleText (FR-012): the figure's
// hover reading and the roster row are built from the same rowFields output,
// so they can never state different things.
function titleBits(r) {
  return CCWATCH_ROSTER.titleText(r, VOLATILE);
}

// The figure's own art (`.figart`) is rebuilt wholesale on every update — it

  // the ways into the inspector and two of those are the keyboard; as a <g> it
  // needed an explicit tabindex, an explicit role, a hand-drawn focus ring and
  // a keydown handler to honour Enter and Space — four things that had to be
  // right for the map not to be a control some people simply cannot operate.

function updateFigure(b, {ord, row}) {

  const sel = row.sid === selectedSid ? " selected" : "";
  b.className = `agent sev${k.sev} ${k.cls}${sel}`;
  b.style.order = ord;

  figart.textContent = "";
  figart.appendChild(figure(row));
  // ⚠️ Both the tooltip and the accessible name are written from titleBits(row),
  // so a hover reading and a screen reader cannot describe the same figure
  // differently — computing them separately is how they drift apart.
  //

  // for free from its visual context: a pointer user can see which figure they
  // are over, and someone tabbing through cannot.
  b.title = titleBits(row);
  b.setAttribute("aria-label", "agent " + row.name + ": " + titleBits(row));
  b.querySelector(".alabel").textContent = shortName(row);

// Message lines are drawn between the two figures involved, wherever they are —
// including across territories, which is the case worth seeing.
//
// Positioned from each figure's own box, measured against #boardinner rather
// than the viewport, so the coordinates are content coordinates: the overlay is
// a child of #boardinner and therefore scrolls with it, which is why there is
// no scroll listener here and no per-frame work. The measurement happens once
// per tick and once per resize, never on scroll.
function makeWire() {

    "marker-end": "url(#ah)"}));

  bubble.appendChild(svgEl("circle", {cx: 0, cy: 0, r: 8, fill: "var(--ground)",
    stroke: "var(--info)", "stroke-opacity": ".5", "stroke-width": "1"}));
  bubble.appendChild(svgEl("text", {fill: "var(--info)", "text-anchor": "middle", y: 3}));
  g.appendChild(bubble);

}
function updateWire(g, {p, q, count, recent}) {
  g.setAttribute("class", recent ? "wire recent" : "wire");

  const mx = (p.x + q.x)/2, my = (p.y + q.y)/2;
  const dx = q.x - p.x, dy = q.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const bow = Math.min(48, len * 0.18);
  const cx = mx - (dy/len) * bow, cy = my + (dx/len) * bow;
  const w = Math.min(3.2, 0.7 + Math.log2(1 + count) * 0.7);
  const path = g.querySelector("path");
  path.setAttribute("d", `M${p.x},${p.y} Q${cx},${cy} ${q.x},${q.y}`);
  path.style.setProperty("--wire-w", w);

  // line is clutter that buries the edge that actually has traffic. Placed

  // whatever the line crosses, which was reliably a territory's own text.

// The last peers payload, held so a resize can redraw the wires without
// waiting for the next tick — the figures move under a resize, and a wire that
// still points where a figure used to be is worse than no wire.
let lastPeers = null;

// focus, and the selected one. Held by NAME, because that is what the edges
// are keyed by, and re-read on every draw rather than cached as a set of
// edges — the figure under a stationary pointer can change identity when a
// refresh reorders the board, and a pinned line for the wrong pair is worse
// than none.

  const sel = selectedSid != null && lastRows[selectedSid] ? lastRows[selectedSid].name : null;
  return [hoverName, focusName, sel].filter(n => n != null);
}

// ⚠️ Lines only for the figures somebody is looking at — see the top of
// web/comms.js for why the board no longer draws every edge it knows about.
// Returns what the footer needs to say that the rest are hidden, not absent.
function wires(peers) {
  lastPeers = peers || null;

  const inner = $("boardinner");
  const wanted = {};

  // Sized to the content box, and the viewBox is 1:1 with it so the wire
  // coordinates below are plain content pixels.
  const w = inner.offsetWidth, h = inner.offsetHeight;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  if (peers && peers.edges) {
    const base = inner.getBoundingClientRect();
    const centreByName = {};
    for (const fig of inner.querySelectorAll(".agent[data-name]")) {
      const r = fig.getBoundingClientRect();
      // Relative to #boardinner's own box, so scrolling changes nothing: both
      // rects move together and the difference is invariant.
      centreByName[fig.dataset.name] = {
        x: r.left - base.left + r.width / 2,
        y: r.top - base.top + r.height / 2,
      };
    }

    // has exited would be a line to nowhere, and the peers panel in the
    // table view already lists those.
    drawable = CCWATCH_COMMS.drawable(peers.edges, centreByName);
    exited = peers.edges.filter(e => e && e.from !== e.to).length - drawable;
    const shown = CCWATCH_COMMS.visible(peers.edges, lookedAt(), centreByName, Date.now());
    for (const e of shown) {

// Run after drawBoard on every tick — including a 304, which re-applies the

// has nothing new to say. The words go on the figure's title and accessible
// name as well, since an envelope alone says neither who nor when.

  const onMap = {};
  for (const b of figs) onMap[b.dataset.name] = true;
  const recent = CCWATCH_COMMS.recent(peers && peers.edges, onMap, Date.now());
  let marked = 0;
  for (const b of figs) {
    const row = lastRows[b.dataset.sid];
    const entry = recent[b.dataset.name];
    const kind = CCWATCH_COMMS.kind(entry);
    let mark = b.querySelector(".comms");
    // ⚠️ Rebuilt from titleBits here in BOTH branches, never appended to what
    // the node already says. updateFigure rewrites them on a tick, but not
    // every caller of this goes through a tick first, and an append would
    // then stack one "messaged …" per call.
    const base = row ? titleBits(row) : b.title;

      delete b.dataset.comms;
      if (row) { b.title = base; b.setAttribute("aria-label", label); }

    marked++;
    if (!mark) {
      const spec = CCWATCH_SPRITES.comms();
      mark = svgEl("svg", {class: "comms", viewBox: `0 0 ${spec.w} ${spec.h}`,
        width: spec.w * 2, height: spec.h * 2, "shape-rendering": "crispEdges",

      for (const p of spec.parts) g.appendChild(svgEl("path", {fill: p.fill, d: p.d}));
      mark.appendChild(g);

    b.title = base + "\n" + said;

  }

// ---- the alert control -----------------------------------------------------
// One header control for every condition that says the view cannot be
// believed, replacing the two block-level banners that used to sit between the
// header and the board and move it. The sentences are CCWATCH_ALERTS.alerts()'s
// — see the top of web/alerts.js for what the banners cost, measured, and for
// why a collapsed count alone would have been the wrong fix.
const alertEls = (function () {
  const slot = $("alertslot"), btn = $("alertbtn");

  return {slot, btn, modal, list, title};

let lastTriggerText = null;

function makeAlertItem() {
  const el = document.createElement("div");

  return el;
}
function updateAlertItem(el, it) {
  el.className = "alertitem " + it.sev;

  // because moving the focused element would drop the focus.
  el.style.order = it.order;

// Takes the model, not the payload: everything judged happens in alerts.js, so
// verify-ui can pose a condition this machine is not in and assert on what the
// page does with it.
function renderAlerts(model) {
  const {slot, btn, modal, list, title} = alertEls;
  const {items, trigger} = model;
  reconcile(list, keyBy(items, it => it.key), "alert", makeAlertItem, updateAlertItem);
  title.textContent = items.length === 1 ? "1 alert" : `${items.length} alerts`;
  if (!trigger) {
    // Nothing is wrong: the control is gone, not green (principle XII). The
    // popover goes with it — a panel left open over a condition that has
    // cleared is a panel stating something that is no longer true.
    if (modal.open) closeAlerts();
    slot.className = "quiet";
    btn.className = "";
    if (lastTriggerText !== null) { btn.textContent = ""; lastTriggerText = null; }
    btn.removeAttribute("aria-label");
    return;
  }
  slot.className = "";
  btn.className = trigger.sev;
  if (trigger.text !== lastTriggerText) {
    btn.textContent = trigger.text;
    lastTriggerText = trigger.text;
  }
  // The accessible name is the whole list; the visible text may be ellipsised
  // by the slot's width, and "+1" is an abbreviation either way.
  btn.setAttribute("aria-label", trigger.label);
  btn.title = trigger.label;
}

// Anchored under the trigger at open time rather than at a fixed offset: the

// header height is the 258px-below-the-fold bug in a smaller box. Clamped to
// the viewport on both axes so it is always fully reachable.
function openAlerts() {
  const {btn, modal} = alertEls;
  const r = btn.getBoundingClientRect();
  const top = Math.round(r.bottom + 6);
  modal.style.top = top + "px";
  modal.style.right = Math.max(8, Math.round(innerWidth - r.right)) + "px";
  modal.style.maxHeight = Math.max(80, innerHeight - top - 12) + "px";

  if (e.target === alertEls.modal) closeAlerts();

alertEls.modal.addEventListener("close",
  () => alertEls.btn.setAttribute("aria-expanded", "false"));
$("alertclose").addEventListener("click", closeAlerts);

// zero live sessions is a normal condition, so it is stated in flow — where,
// there being no figures, there is nothing below it to push down.
function renderIdle(cond) {
  const el = $("idlemsg");
  const on = !!(cond && cond.trust === "ok" && cond.empty);
  el.textContent = on ? "No live sessions. After a reboot, run ccwatch resume." : "";
  el.className = on ? "on" : "";
}

// One gauge span per reading, reconciled by name so the DOM node behind each
// percentage survives a tick (FR-016/V1); the two full-panel messages (no
// usage at all, or the whole reading stale) replace the gauge set with a
// single persistent note node instead.
// One gauge: a name and two percentages, the two bars, and when the window
// resets. Built once and updated in place (FR-016/V1) like everything else
// here — nothing in the header is created or replaced by a repaint.
function makeGaugeSpan() {
  const span = document.createElement("span");
  span.className = "g-gauge";
  const head = document.createElement("span"); head.className = "g-head";
  const label = document.createElement("span"); label.className = "g-label";
  const val = document.createElement("span"); val.className = "g-val";
  const elapsed = document.createElement("span"); elapsed.className = "g-elapsed";
  const pace = document.createElement("span"); pace.className = "g-pace";
  head.append(label, val, elapsed);
  const barrow = document.createElement("span"); barrow.className = "g-barrow";
  const bars = document.createElement("span"); bars.className = "g-bars";
  const used = document.createElement("span"); used.className = "g-bar g-used";
  const usedFill = document.createElement("i");
  used.appendChild(usedFill);
  const time = document.createElement("span"); time.className = "g-bar g-time";
  const timeFill = document.createElement("i");
  time.appendChild(timeFill);
  // role="img" with a label, because a length is not available to a screen
  // reader and "41%" with no subject is not a reading.
  used.setAttribute("role", "img");
  time.setAttribute("role", "img");
  bars.append(used, time);
  barrow.append(bars, pace);
  const reset = document.createElement("span"); reset.className = "g-reset";
  span.append(head, barrow, reset);
  return span;
}
function updateGaugeSpan(span, g) {
  span.querySelector(".g-label").textContent = g.name;
  const val = span.querySelector(".g-val");
  val.textContent = g.usedText + " used";
  val.className = "g-val " + CCWATCH_USAGE.band(g.usedPct);
  const used = span.querySelector(".g-used");
  used.className = "g-bar g-used " + CCWATCH_USAGE.band(g.usedPct);
  used.firstChild.style.width = Math.min(100, Math.max(0, g.usedPct)) + "%";
  used.setAttribute("aria-label", g.usedLabel);
  used.title = g.usedLabel;
  // ⚠️ The clock bar and its number are ABSENT, not zero, when the elapsed
  // fraction cannot be known — no reset instant in the payload, an unknown
  // window length, or a reset already in the past. A bar drawn at 0% would
  // read as "the window just started", which is a measurement nobody took
  // (principle VI, and see web/usage.js).
  const time = span.querySelector(".g-time");
  const elapsedEl = span.querySelector(".g-elapsed");
  const paceEl = span.querySelector(".g-pace");
  if (g.elapsedPct == null) {
    time.style.display = "none";
    time.removeAttribute("aria-label");
    elapsedEl.textContent = "";
    paceEl.textContent = "";
  } else {
    time.style.display = "";
    time.firstChild.style.width = Math.min(100, Math.max(0, g.elapsedPct)) + "%";
    time.setAttribute("aria-label", g.elapsedLabel);
    time.title = g.elapsedLabel;
    elapsedEl.textContent = "· " + g.elapsedText + " elapsed";
    // Only when it is true (principle XII): running under the clock is the
    // normal condition and a word for it is a word people stop reading.
    paceEl.textContent = g.pace === "ahead" ? "ahead of the clock" : "";
  }
  // The relative time is what you act on; the wall clock is what you put in a
  // calendar, in one fixed zone so two people reading this say the same thing.
  span.querySelector(".g-reset").textContent = g.resetIn == null ? ""
    : (g.resetClock ? `resets ${g.resetIn} · ${g.resetClock}` : `resets ${g.resetIn}`);
}
const gaugesEls = (function () {
  const el = $("gauges");
  const note = document.createElement("span"); note.style.display = "none";
  el.appendChild(note);
  return {el, note};
})();
function updateGauges(u) {
  const {el, note} = gaugesEls;
  if (!u) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "dim"; note.style.display = "";
    note.textContent = "usage not reporting — run ccwatch install-statusline";
    return;
  }
  // Withheld while the feed itself is not trusted (FR-029) — on top of, not
  // instead of, the reading's own staleness window below.
  if (!VOLATILE) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "stale"; note.style.display = "";
    note.textContent = "usage: withheld while the feed is unreliable";
    return;
  }
  // Withheld rather than annotated past the staleness limit. A percentage on
  // screen is read as current whatever is printed beside it — a fixture left
  // over from an earlier run showed 52% while the real figure was 7%.
  if (u.age > (u.stale_after || 600)) {
    reconcile(el, {}, "gauge", makeGaugeSpan, updateGaugeSpan);
    note.className = "stale"; note.style.display = "";
    note.textContent = `usage: last reading ${dur(u.age)} old — not shown`;
    return;
  }
  note.style.display = "none"; note.textContent = "";
  // The shaping — which windows exist, the elapsed fraction, the reset clock
  // — is web/usage.js's, shared with the table view so the two headers cannot
  // disagree about how much of a window has gone (principle XI).
  const wanted = {};
  for (const g of CCWATCH_USAGE.gauges(u, Date.now() / 1000)) wanted[g.key] = g;
  reconcile(el, wanted, "gauge", makeGaugeSpan, updateGaugeSpan);
  if (u.age > 60) {
    note.className = "stale"; note.style.display = "";
    note.textContent = `[${dur(u.age)} old]`;
  }
}

// Built once, updated in place (FR-016/V1): the live-count sentence plus its
// two conditional clauses, each a persistent node so a click-drag selection
// across the header survives a tick.
const countsEls = (function () {
  const root = $("counts");
  const main = document.createTextNode("");
  const waitSep = document.createTextNode("");
  const wait = document.createElement("b"); wait.style.color = "var(--block)";
  const suspSep = document.createTextNode("");
  const susp = document.createElement("b"); susp.style.color = "var(--bad)";
  root.append(main, waitSep, wait, suspSep, susp);
  return {main, waitSep, wait, suspSep, susp};
})();
function updateCounts(s, buildingCount) {
  const {main, waitSep, wait, suspSep, susp} = countsEls;
  const total = (s.sessions || []).length;
  const w = (s.sessions || []).filter(r => r.sev === 4).length;
  const q = (s.sessions || []).filter(r => r.sev === 3).length;
  main.textContent = `${total} live in ${buildingCount} project${buildingCount === 1 ? "" : "s"}`;
  waitSep.textContent = w ? " · " : "";
  wait.textContent = w ? `${w} waiting on you` : "";
  suspSep.textContent = q ? " · " : "";
  susp.textContent = q ? `${q} suspect` : "";
  document.title = (w ? `(${w}) ` : "") + "ccwatch · map";
}

// ---- inspector -------------------------------------------------------------
// subject is who the modal is open for (data-model.md §2); opener is where
// focus returns to on close (D5) — kept separate because closing must restore
// focus even after subject has been cleared.
let subject = null;
let opener = null;

// The one and only setInterval in this file, shared by every periodic thing
// on the page (the roster poll and the open conversation's own cadence) so a
// hidden (backgrounded) tab does no periodic work of any kind.
const timers = {};
function every(name, ms, fn) {
  if (timers[name]) clearInterval(timers[name]);
  timers[name] = setInterval(fn, ms);
}
function clearEvery(name) {
  if (timers[name]) { clearInterval(timers[name]); timers[name] = null; }
}

const WHO = {said:"you", assistant:"claude", system:"system", tool_result:"result"};

// Which turns are markdown. What Claude and you write is; a system reminder and
// a "← 4821 bytes" result are not — they are already-reduced machine text, and
// running them through a markdown pass would find headings in XML-ish tags and
// emphasis in file paths, inventing structure that was never in the transcript.
const MD = {assistant:true, said:true};

// ⚠️ Falls back to escaped plain text if md.js failed to load — text intact,
// pre-wrap kept, because a missing renderer must not present itself as a
// session with nothing to say. The class comes off the SAME condition as the
// rendering: tagging a plain-text turn as markdown would drop its newlines.
const isMd = t => !!(MD[t.kind] && window.CCWATCH_MD);

// A message slot for the empty/error states, kept out of the "turn" index so
// reconcile()'s removal pass never touches it. Built once; toggled, not
// replaced.
const convoMsgEl = (function () {
  const box = $("convo");
  const el = document.createElement("div"); el.className = "dim"; el.style.display = "none";
  box.appendChild(el);
  return el;
})();
function setConvoMessage(text, isError) {
  convoMsgEl.textContent = text;
  convoMsgEl.style.color = isError ? "var(--bad)" : "";
  convoMsgEl.style.display = "";
}
function clearConvoMessage() {
  convoMsgEl.style.display = "none";
  convoMsgEl.textContent = "";
}

// One <div class="turn"> per transcript entry, reconciled by identity
// (research.md D4) so an open text selection or a scrolled-to position
// survives a refresh instead of being rebuilt wholesale. `.what`'s single
// remaining innerHTML write is the escape-first-then-tag path Constitution X
// requires (V2) — the container is reconciled, the body is not.
function makeTurn() {
  const div = document.createElement("div");
  const who = document.createElement("div"); who.className = "who";
  const what = document.createElement("div"); what.className = "what";
  div.append(who, what);
  return div;
}
function updateTurn(div, t) {
  const who = t.origin === "peer" ? (t.from || "peer") : (WHO[t.kind] || t.kind);
  div.className = "turn " + t.kind + (t.origin === "peer" ? " peer" : "");
  div.querySelector(".who").textContent = who;
  const what = div.querySelector(".what");
  what.className = "what" + (isMd(t) ? " md" : "");
  if (isMd(t)) what.innerHTML = CCWATCH_MD.render(t.text || "");
  else what.textContent = t.text || "";
}

// atBottom is sampled BEFORE reconciling and, when true, the scroll position
// is pinned to the new bottom AFTER (FR-018, D14) — so a reader scrolled up
// to reread something is never yanked down by a tick they did not ask for.
function renderConvo(row, data, ok, reason) {
  const box = $("convo");
  const wasAtBottom = CCWATCH_MODAL.atBottom({
    scrollTop: box.scrollTop, scrollHeight: box.scrollHeight, clientHeight: box.clientHeight,
  });
  const turns = (data && data.turns) || [];
  const {message, isError} = CCWATCH_MODAL.convoMessage({row, ok, reason, turnCount: turns.length});
  if (message != null) {
    reconcile(box, {}, "turn", makeTurn, updateTurn);
    setConvoMessage(message, isError);
  } else {
    clearConvoMessage();
    // No scroll-position save/restore beyond atBottom above: reconciliation
    // never removes a turn still in `wanted`, so the browser's own scroll
    // position is never disturbed by a refresh in the first place (D4).
    const wanted = {};
    const seenAt = {};
    turns.forEach(t => {
      const dupKey = t.timestamp + "|" + t.kind;
      seenAt[dupKey] = (seenAt[dupKey] || 0) + 1;
      wanted["at|" + t.kind + "|" + t.timestamp + "|" + seenAt[dupKey]] = t;
    });
    reconcile(box, wanted, "turn", makeTurn, updateTurn);
  }
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

async function loadConvo() {
  if (!subject) return;
  const row = lastRows[subject.sid] || null;
  try {
    const res = await fetch(`/api/transcript?sid=${encodeURIComponent(subject.sid)}&n=${CCWATCH_MODAL.TRANSCRIPT_N}`,
                            {cache:"no-store"});
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      renderConvo(row, null, false, j.error || "no transcript");
      return;
    }
    renderConvo(row, await res.json(), true, null);
  } catch (e) {
    renderConvo(row, null, false, e.message);
  }
}

// One question <li> per option, reconciled by index (the option list is the
// one genuinely variable-length part of the ask panel).
function makeQuestion() {
  const div = document.createElement("div");
  const q = document.createElement("div"); q.className = "q";
  const ol = document.createElement("ol");
  div.append(q, ol);
  return div;
}
function makeOption() {
  const li = document.createElement("li");
  const desc = document.createElement("div"); desc.className = "odesc";
  li.append(document.createTextNode(""), desc);
  return li;
}
function updateOption(li, o) {
  li.childNodes[0].textContent = o.label;
  const desc = li.querySelector(".odesc");
  desc.textContent = o.description || "";
  desc.style.display = o.description ? "" : "none";
}
function updateQuestion(div, q) {
  div.querySelector(".q").textContent = q.question;
  const ol = div.querySelector("ol");
  const wanted = {};
  (q.options || []).forEach((o, i) => { wanted["o" + i] = o; });
  reconcile(ol, wanted, "opt", makeOption, updateOption);
}

// Built once, updated in place (FR-016/V1): `dialogNote`/`dialogHow` cover
// the no-recorded-question case, `qlist`/`qHow` the normal one — exactly one
// pair is ever visible, toggled by `style.display` rather than by replacing
// either subtree.
const askEls = (function () {
  const box = $("ask");
  const dialogNote = document.createElement("div"); dialogNote.className = "q";
  const dialogHow = document.createElement("div"); dialogHow.className = "how";
  dialogHow.textContent = "No question is recorded in the transcript, so this is a dialog "
    + "(a permission prompt, for example). Its text is only in that session's terminal.";
  const qlist = document.createElement("div");
  const qHow = document.createElement("div"); qHow.className = "how";
  const qHowB = document.createElement("b"); qHowB.textContent = "queued behind it";
  qHow.append(
    document.createTextNode("This is a dialog: it can only be answered in that session's own"
      + " terminal. A message sent from here is "),
    qHowB,
    document.createTextNode(" and read once the dialog is resolved — it does not answer it."));
  box.append(dialogNote, dialogHow, qlist, qHow);
  [dialogNote, dialogHow, qlist, qHow].forEach(el => { el.style.display = "none"; });
  return {box, dialogNote, dialogHow, qlist, qHow};
})();
// Driven by CCWATCH_MODAL.askModel(row) — kind "questions"/"dialog"/"none"
// (FR-020, FR-023) — rather than re-deriving the same branches here.
function renderAsk(ask) {
  const {box, dialogNote, dialogHow, qlist, qHow} = askEls;
  if (ask.kind === "questions") {
    box.className = "on";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
    qlist.style.display = ""; qHow.style.display = "";
    const wanted = {};
    ask.questions.forEach((q, i) => { wanted["q" + i] = q; });
    reconcile(qlist, wanted, "q", makeQuestion, updateQuestion);
    return;
  }
  qlist.style.display = "none"; qHow.style.display = "none";
  reconcile(qlist, {}, "q", makeQuestion, updateQuestion);
  if (ask.kind === "dialog") {
    box.className = "on";
    dialogNote.style.display = ""; dialogHow.style.display = "";
    dialogNote.textContent = ask.note;
  } else {
    box.className = "";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
  }
}

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding.
// Built once, listeners attached once (FR-016/V1): only the text content
// changes per render. `killEls.row` is the closure `killgo`'s listener reads,
// updated on every renderKill() call rather than re-bound.
const killEls = (function () {
  const bar = $("killbar");
  if (!bar) return null;
  const startBtn = document.createElement("button");
  startBtn.className = "danger"; startBtn.id = "killstart";
  const killwhy = document.createElement("span"); killwhy.id = "killwhy";
  const confirmDiv = document.createElement("div"); confirmDiv.id = "killconfirm";
  const desc = document.createElement("div");
  const nameB = document.createElement("b");
  const memB = document.createElement("b");
  const resumeCode = document.createElement("code");
  const phaseB = document.createElement("b");
  const phaseWrap = document.createElement("span"); phaseWrap.style.display = "none";
  phaseWrap.append(document.createTextNode(" It is running spec-run phase "), phaseB,
    document.createTextNode(" — killing it aborts a paid model call."));
  const busyText = document.createTextNode("");
  desc.append(
    document.createTextNode("Killing "), nameB, document.createTextNode(" frees "), memB,
    document.createTextNode(". The conversation is kept — reopen it with "),
    resumeCode, document.createTextNode("."), phaseWrap, busyText);
  const row = document.createElement("div"); row.className = "row";
  const goBtn = document.createElement("button");
  goBtn.className = "danger"; goBtn.id = "killgo"; goBtn.textContent = "yes, kill it";
  const noBtn = document.createElement("button");
  noBtn.className = "ghost"; noBtn.id = "killno"; noBtn.textContent = "cancel";
  const out = document.createElement("span"); out.id = "killout";
  row.append(goBtn, noBtn, out);
  confirmDiv.append(desc, row);
  bar.append(startBtn, killwhy, confirmDiv);
  startBtn.addEventListener("click", () => confirmDiv.classList.add("on"));
  noBtn.addEventListener("click", () => confirmDiv.classList.remove("on"));
  goBtn.addEventListener("click", () => doKill(killEls.row));
  return {bar, startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText, out, row: null};
})();

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding. The bar is always present (FR-028); only
// #killstart's disabled attribute and #killwhy's text change.
function renderKill(kill) {
  if (!killEls) return;
  const {startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText} = killEls;
  killEls.row = subject ? lastRows[subject.sid] : null;
  startBtn.disabled = kill.state !== "ready";
  startBtn.textContent = kill.startLabel;
  killwhy.textContent = kill.reason ?? "";
  if (!kill.confirmOpen) confirmDiv.classList.remove("on");
  if (kill.confirm) {
    nameB.textContent = kill.confirm.name;
    memB.textContent = kill.confirm.frees ?? kill.confirm.freesNote ?? "";
    resumeCode.textContent = kill.confirm.resume;
    if (kill.confirm.phase) {
      phaseWrap.style.display = ""; phaseB.textContent = kill.confirm.phase;
    } else {
      phaseWrap.style.display = "none";
    }
    busyText.textContent = kill.confirm.busy
      ? " It is mid-turn, so a tool call may be left half-applied." : "";
  }
}

async function doKill(row) {
  // Independent of the disabled attribute (D17): a disabled control issues
  // no request even if the handler is somehow reached (FR-029).
  if (!CAN_KILL || !row) return;
  const out = $("killout");
  out.className = ""; out.textContent = "killing…";
  try {
    const res = await fetch("/api/kill", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: row.sid}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    // A refusal is shown verbatim: it explains what would have been lost, and
    // reducing it to "failed" would throw away the only useful part.
    out.textContent = j.state === "killed"
      ? `killed — ${row.rss_mb != null ? row.rss_mb + "MB" : "memory"} released`
      : (j.detail || j.error || "failed");
    if (j.state === "killed") setTimeout(closeModal, 1200);
  } catch (e) {
    out.className = "failed";
    out.textContent = "the kill request did not complete: " + e.message;
  }
}

// One function, called from openModal(), from applyFeed() on every tick, and
// from the kill/send handlers (page-modal.md §3). Writes into existing nodes
// only — nothing in the panel is created, removed or replaced by a render.
function renderModal() {
  if (!subject) return;
  const row = lastRows[subject.sid] ?? null;
  const fields = row ? CCWATCH_ROSTER.rowFields(row, {volatile: VOLATILE}) : null;
  const names = (lastBody && lastBody.sessions || []).map(r => r.name);
  const edges = (lastBody && lastBody.peers && lastBody.peers.edges) || [];
  // ⚠️ `lastCond` — the same object the header's alert control and the roster
  // read, never a second computation of the same judgement. Two renderings
  // that decide independently whether the feed can be trusted will eventually
  // disagree, and a reader has no way to tell which of them is lying
  // (principle XI).
  const m = CCWATCH_MODAL.panel({
    row, fields, subject, names, edges, cond: lastCond,
    volatile: VOLATILE, canSend: CAN_SEND, canKill: CAN_KILL,
    confirmOpen: killEls ? killEls.confirmDiv.classList.contains("on") : false,
  });
  $("iname").textContent = m.header.name;
  $("istatus").textContent = m.header.status ?? "";
  const ifeed = $("ifeed");
  const main = ifeed.querySelector(".main"), unreadable = ifeed.querySelector(".unreadable");
  main.textContent = m.feed.main;
  main.className = "main" + (m.feed.mainKind ? " " + m.feed.mainKind : "");
  unreadable.textContent = m.feed.unreadable;
  const igone = $("igone");
  igone.textContent = m.gone ?? "";
  igone.classList.toggle("on", m.gone != null);
  reconcile($("istats"), keyBy(m.stats, l => l.key), "stat", makeStatLine, updateStatLine);
  renderAsk(m.ask);
  renderKill(m.kill);
  $("replyText").disabled = $("replySend").disabled = m.send.state !== "ready";
  $("sendwhy").textContent = m.send.reason ?? "";
}
function keyBy(arr, fn) {
  const o = {};
  arr.forEach(x => { o[fn(x)] = x; });
  return o;
}
function makeStatLine() {
  const div = document.createElement("div");
  const dt = document.createElement("dt");
  const dd = document.createElement("dd");
  div.append(dt, dd);
  return div;
}
function updateStatLine(div, l) {
  div.querySelector("dt").textContent = l.label;
  div.querySelector("dd").textContent = l.text;
}

function openModal(sid, name, kind) {
  subject = {sid, name};
  // The deep link out. Pointing at this same page with ?sid= rather than at
  // the table, because the table has no per-agent view to land on — the modal
  // is the detail, and it is here.
  $("ibrowser").href = "/map?sid=" + encodeURIComponent(sid);
  opener = {sid, kind};
  $("replyText").value = "";
  $("replyOut").textContent = ""; $("replyOut").className = "";
  $("killout").textContent = ""; $("killout").className = "";
  if (killEls) killEls.confirmDiv.classList.remove("on");
  reconcile($("convo"), {}, "turn", makeTurn, updateTurn);
  setConvoMessage("reading the transcript…");
  renderModal();
  $("agentmodal").showModal();
  const canSend = CAN_SEND && !!lastRows[sid];
  (canSend ? $("replyText") : $("iclose")).focus();
  loadConvo();
  // Followed live while open, on its own slower cadence — the transcript is
  // read from disk per request and is much heavier than the roster poll.
  every("convo", 5000, loadConvo);
}
// Focus restored by identity (D5): live row for opener.sid, else the live
// figure, else the roster list, else the map itself — never a stale element.
function closeModal() {
  subject = null;
  clearEvery("convo");
  $("agentmodal").close();
  const o = opener;
  opener = null;
  if (!o) return;
  const row = $(`.rrow[data-sid="${o.sid}"]`);
  if (row) { row.focus(); return; }
  const fig = document.querySelector(`.agent[data-sid="${o.sid}"]`);
  if (fig) { fig.focus(); return; }
  const list = $("rosterlist");
  if (list && list.children.length) { list.focus(); return; }
  $("board").focus();
}
async function doSend() {
  // Independent of the disabled attribute (D17): a disabled control issues
  // no request even if the handler is somehow reached (FR-027).
  if (!CAN_SEND || !subject || !lastRows[subject.sid]) return;
  const msg = $("replyText").value.trim();
  if (!msg) return;
  const btn = $("replySend"), out = $("replyOut");
  btn.disabled = true; out.className = "";
  out.textContent = "sending, then checking it arrived…";
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: subject.sid, message: msg}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    out.textContent = j.state === "delivered" ? "delivered — it has the message"
                    : j.state === "queued" ? "queued — mid-turn, it will read this next turn"
                    : (j.error || j.detail || "failed");
    if (j.state === "delivered" || j.state === "queued") $("replyText").value = "";
  } catch (e) {
    out.className = "failed";
    out.textContent = "the send request did not complete: " + e.message;
  }
  btn.disabled = false;
}
$("replySend").addEventListener("click", doSend);
$("iclose").addEventListener("click", closeModal);
$("agentmodal").addEventListener("cancel", () => { closeModal(); });
$("replyText").addEventListener("keydown", e => {
  if (e.key === "Enter") doSend();
});
let lastRows = {};
// No drag-suppression guard here any more. The camera needed one, because a
// pan ended in a click and a pan must not open the inspector; scrolling
// produces no click at all, so there is nothing to suppress and no flag whose
// staleness could swallow a real one.
document.addEventListener("click", e => {
  const a = e.target.closest(".agent[data-sid]");
  // Clicking is worth doing even in --read-only: seeing the conversation is
  // the more common reason to click an agent than messaging it.
  if (!a) return;
  // Clicking a figure also SELECTS it, which is what pins its message lines:
  // the inspector opens modally over the board, so a click could never show
  // them any other way, and they are still there when it closes. Marked as
  // already revealed first — the figure is under the pointer, so it is on
  // screen, and a selection must not scroll the board out from under a click.
  lastRevealedSid = a.dataset.sid;
  selectRow(a.dataset.sid);
  openModal(a.dataset.sid, a.dataset.name, "figure");
});

// Hover and keyboard focus draw a figure's lines while they last. Focus as
// well as hover, or the lines are a feature only a pointer can reach.
//
// ⚠️ The overlay is a non-activating NSPanel, and a WKWebView in a window that
// never becomes key cannot be relied on to get hover at all — which is why a
// click pins them too, above, rather than hover being the only way in.
function lookChanged() {
  relayoutWires();
  if (lastCond) repaintFooter(lastCond);
}
$("boardinner").addEventListener("pointerover", e => {
  const a = e.target.closest(".agent[data-name]");
  const name = a ? a.dataset.name : null;
  if (name === hoverName) return;
  hoverName = name;
  lookChanged();
});
$("boardinner").addEventListener("pointerleave", () => {
  if (hoverName == null) return;
  hoverName = null;
  lookChanged();
});
$("boardinner").addEventListener("focusin", e => {
  const a = e.target.closest(".agent[data-name]");
  focusName = a ? a.dataset.name : null;
  lookChanged();
});
$("boardinner").addEventListener("focusout", e => {
  // Moving between two figures fires focusout then focusin; the focusin that
  // follows redraws for the new one, so only a focus leaving the board clears.
  if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".agent[data-name]")) return;
  focusName = null;
  lookChanged();
});

// ---- the map key -----------------------------------------------------------
// All that remains of what was the camera's button cluster: the zoom-out /
// zoom-in / fit buttons and the "zoom 2x - mid" readout went with the camera,
// because the browser's own scrollbar is the position indicator and there is
// no zoom to be at. Built with DOM APIs, never innerHTML, so map.html still
// assigns innerHTML exactly twice (FR-047).
//
// ⚠️ It goes in the header, beside the view switcher. It used to inherit the
// cluster's floating position at the bottom-left of #wrap, and once the board
// scrolled underneath it, it covered whatever was there — measured, two
// `implement/CRASHED` badges. Nothing in the header can overlap the board.
const keyBtn = document.createElement("button");
keyBtn.id = "keyhelp"; keyBtn.type = "button"; keyBtn.textContent = "?";
keyBtn.setAttribute("aria-label", "map key — what the figures mean");
keyBtn.title = "map key — what the figures mean";
document.querySelector("header nav").appendChild(keyBtn);

keyBtn.addEventListener("click", () => $("keymodal").showModal());

// ⚠️ `?sid=` opens that agent, and only if the payload actually contains it.
// The sid is checked for shape AND looked up in the rows we have, so a
// hand-typed or stale link opens nothing rather than a modal titled
// `undefined` reading a transcript for a session that does not exist. Done
// once, on the first feed, so a refresh three seconds later does not keep
// re-opening a panel the reader has closed.
let deepLinkDone = false;
function openFromQuery() {
  if (deepLinkDone) return;
  let want;
  try { want = new URLSearchParams(location.search).get("sid"); }
  catch (e) { return; }                       // no URLSearchParams, no deep link
  deepLinkDone = true;
  if (!want || !/^[0-9a-fA-F-]{1,64}$/.test(want)) return;
  const row = lastRows[want];
  if (!row) return;                           // gone, or never here
  openModal(want, row.name || want, "deeplink");
}
$("keyclose").addEventListener("click", () => $("keymodal").close());

// ---- the board -------------------------------------------------------------
// Rebuilt from the payload each tick by reconciliation \u2014 create/update/remove
// by identity key, nothing rebuilt wholesale \u2014 level by level, each level
// reconciled into its own parent so a district's disappearance takes its
// buildings with it without a second pass.
//
// There are no stored coordinates and no stored viewport. Both records the
// camera needed (ccwatch.map.plots.v1 and ccwatch.map.view.v1) are gone, and
// with them every failure mode reading and writing them had: a private-mode
// localStorage that throws, a full origin quota, a stored rectangle that no
// longer intersects anything placed. Flow layout needs none of it, and the
// order is derived from names, which the payload already carries.
function drawBoard(s) {
  const model = buildWorldModel(s);
  const inner = $("boardinner");

  const districtWanted = {};
  model.tree.forEach((d, i) => { districtWanted[d.key] = {...d, ord: i}; });
  reconcile(inner, districtWanted, "district", makeDistrict, updateDistrict);

  let buildingCount = 0;
  for (const d of model.tree) {
    const dEl = inner._reconcileIndex.district[d.key];
    const buildingWanted = {};
    d.buildings.forEach((b, i) => { buildingWanted[b.key] = {...b, ord: i}; });
    buildingCount += d.buildings.length;
    const buildingsEl = dEl.querySelector(".buildings");
    reconcile(buildingsEl, buildingWanted, "building", makeBuilding, updateBuilding);

    for (const b of d.buildings) {
      const bEl = buildingsEl._reconcileIndex.building[b.key];
      const zoneWanted = {};
      b.zones.forEach((z, i) => { zoneWanted[z.key] = {...z, ord: i}; });
      const zonesEl = bEl.querySelector(".zones");
      reconcile(zonesEl, zoneWanted, "zone", makeZone, updateZone);

      for (const z of b.zones) {
        const zEl = zonesEl._reconcileIndex.zone[z.key];
        const figureWanted = {};
        z.figures.forEach((f, i) => { figureWanted[f.key] = {ord: i, row: f.row}; });
        reconcile(zEl.querySelector(".figures"), figureWanted,
                  "figure", makeFigure, updateFigure);
      }
    }
  }
  return {buildingCount};
}

// ---- draw ------------------------------------------------------------------
// The trust model itself is CCWATCH_ALERTS.feedCondition (data-model.md §5),
// shared with the table view so the two pages cannot judge the same feed
// differently (principle XI). It was inline here while this was the only page
// that had one.

// The age of the data, not the age of the request: computed from the
// absolute collected_at instants in the body we hold, never from a stored
// `ages` value, so a repaint after a 304 or a resumed collection still shows
// the true elapsed time rather than freezing it at the moment the body
// arrived.
// Built once, updated in place (FR-016/V1): four persistent nodes — the
// three normal bits (updated-at, staleness, edge count) each with their own
// leading " · " separator so an absent bit leaves no dangling dot.
const footEls = (function () {
  const root = $("foot");
  const updated = document.createTextNode("");
  const staleSep = document.createTextNode("");
  const stale = document.createElement("span"); stale.className = "stale";
  const edgesSep = document.createTextNode("");
  const edges = document.createElement("span");
  root.append(updated, staleSep, stale, edgesSep, edges);
  return {root, updated, staleSep, stale, edgesSep, edges};
})();
function repaintFooter(cond) {
  // Nothing has ever been collected: the trust banner (b) says so and there
  // is nothing else to state here.
  if (cond.trust === "warming") {
    footEls.updated.textContent = "";
    footEls.staleSep.textContent = ""; footEls.stale.textContent = "";
    footEls.edgesSep.textContent = ""; footEls.edges.textContent = "";
    return;
  }
  footEls.updated.textContent = "updated " + new Date().toLocaleTimeString();
  // R3: marked stale with the measured age, recomputed every repaint —
  // shared with the (a)/(c) trust sentences' own `dataAge`.
  if (cond.dataAge > 10) {
    footEls.staleSep.textContent = " · ";
    footEls.stale.textContent = `sessions ${dur(cond.dataAge)} behind`;
  } else {
    footEls.staleSep.textContent = "";
    footEls.stale.textContent = "";
  }
  const said = CCWATCH_COMMS.footText(lastWires);
  footEls.edgesSep.textContent = said ? " · " : "";
  footEls.edges.textContent = said;
}

// The row primitive, split make/update the same way makeFigure/updateFigure
// is (web/map.html:791-814): reconcile() creates the node once by `sid` and
// writes to the SAME node on every later tick, so focus/selection anchored to
// it survives a reorder.
function makeRow(sid) {
  const el = document.createElement("div");
  el.className = "rrow";
  el.dataset.sid = sid;
  el.setAttribute("role", "option");
  el.tabIndex = -1;
  el.setAttribute("aria-selected", "false");
  el.appendChild(spanChild("rname"));
  el.appendChild(spanChild("rwhere"));
  el.appendChild(spanChild("rstatus"));
  el.appendChild(spanChild("rmeta"));
  el.appendChild(spanChild("rasks"));
  el.appendChild(spanChild("rsel"));
  el.querySelector(".rsel").textContent = "selected";
  return el;
}
function spanChild(cls) {
  const s = document.createElement("span");
  s.className = cls;
  return s;
}
// The status word and its measurement are the pair FR-034 protects from
// truncation at any width — joined into one `.rstatus` node so the two
// never separate under the `flex:none` rule that keeps them whole.
function updateRow(el, {fields}) {
  el.querySelector(".rname").textContent = fields.name;
  el.querySelector(".rwhere").textContent = fields.where;
  el.querySelector(".rstatus").textContent = fields.measure != null
    ? `${fields.word} · ${fields.measure}` : fields.word;
  const meta = [];
  if (fields.pipeline != null) meta.push(fields.pipeline);
  if (fields.age != null) meta.push(`age ${fields.age}`);
  if (fields.ctx != null) meta.push(fields.ctx);
  if (fields.mem != null) meta.push(fields.mem);
  el.querySelector(".rmeta").textContent = meta.join(" · ");
  el.querySelector(".rasks").textContent = fields.asks != null ? `ASKS: ${fields.asks}` : "";
}

// contracts/page-roster.md §3. The body is filled in incrementally by this
// entry's user stories (US1's order and wording, US4's condition sentences,
// US3/US5's selection and width writes) — present now, guarded, only so every
// call site below already exists at the position FR-028 depends on.
function renderRoster(sessions, cond) {
  if (!window.CCWATCH_ROSTER) return;
  // data-model.md §5, C-B: while the first snapshot is still warming there is
  // no session data to trust yet, so the panel lists nothing — the retained
  // rows during a feed_down tick are the one case rows are kept (FR-025(b)).
  const rows = cond && cond.trust === "warming" ? [] : sessions;

  const keys = CCWATCH_ROSTER.keysOf(rows);
  const wanted = {};
  for (const r of rows) {
    if (r.sid == null) continue;
    wanted[r.sid] = {row: r, fields: CCWATCH_ROSTER.rowFields(r, {volatile: VOLATILE})};
  }
  const list = rosterEls.list;
  reconcile(list, wanted, "row", (sid) => makeRow(sid), updateRow);
  // Post-reconcile order (research.md D4): create/remove has already run, so
  // every wanted sid is attached — a freshly appended row sits at the end
  // until reorderPlan's insertBefore moves put it where `keys` wants it.
  const currentKeys = [];
  for (const child of list.children) currentKeys.push(child.dataset.sid);
  for (const move of CCWATCH_ROSTER.reorderPlan(currentKeys, keys)) {
    const el = list._reconcileIndex.row[move.key];
    const beforeEl = move.before != null ? list._reconcileIndex.row[move.before] : null;
    list.insertBefore(el, beforeEl);
  }
  rosterEls.title.textContent = "agents · " + keys.length;

  // Roving tabindex, restored by sid rather than position (FR-014, D4): a
  // reorder or a removal must not silently drop focus out of the listbox.
  // aria-selected is written here, in the same pass, from the page-level
  // selectedSid — never from a second read of the payload.
  const hadFocus = list.contains(document.activeElement);
  focusedSid = CCWATCH_ROSTER.focusTarget(focusedSid, keys) ?? (keys.length ? keys[0] : null);
  for (const child of list.children) {
    const sid = child.dataset.sid;
    child.tabIndex = sid === focusedSid ? 0 : -1;
    child.setAttribute("aria-selected", sid === selectedSid ? "true" : "false");
  }
  if (hadFocus && focusedSid != null) {
    const focusEl = list._reconcileIndex.row[focusedSid];
    if (focusEl) focusEl.focus();
  }

  // The tombstone (data-model.md §6, contracts/page-roster.md §3): resolved
  // from the same cond object the banner reads, never latched, so a good
  // snapshot that brings the sid back clears it on that same repaint.
  for (const r of sessions) if (r.sid != null && r.name != null) knownNames[r.sid] = r.name;
  const resolved = window.CCWATCH_ROSTER
    ? CCWATCH_ROSTER.resolveSelection(selectedSid, sessions, cond) : {state: "none"};
  if (resolved.state === "gone") {
    rosterEls.goneMsg.textContent = CCWATCH_ROSTER.goneText(resolved.sid, knownNames[resolved.sid]);
    rosterEls.gone.classList.add("on");
  } else {
    rosterEls.gone.classList.remove("on");
  }

  const focusedRow = rows.find(r => r.sid === focusedSid) || null;
  rosterEls.open.disabled = !focusedRow;
  rosterEls.open.textContent = focusedRow ? `open ${focusedRow.name}` : "no agents to open";
}
// Names seen in any trusted tick, kept for the tombstone sentence even after
// the sid it belongs to disappears from a later payload.
let knownNames = {};

// The two stored records (data-model.md §8), and now the only two: the plot
// record and the viewport record retired with the camera. Storage calls are
// injected (contracts roster-js.md §7) so a throwing localStorage cannot take
// the map down.
const SELECTION_KEY = "ccwatch.map.selection.v1";
function getSelectionItem() { return localStorage.getItem(SELECTION_KEY); }
function setSelectionItem(v) { localStorage.setItem(SELECTION_KEY, v); }
const WIDTH_KEY = "ccwatch.map.width.v1";
function getWidthItem() { return localStorage.getItem(WIDTH_KEY); }
function setWidthItem(v) { localStorage.setItem(WIDTH_KEY, v); }

// The roster's own state, read by every call site above renderRoster's own
// definition needs — kept here rather than re-derived, since applyFeed is the
// only place a fresh `sessions`/`cond` pair arrives.
let lastSessions = [], lastCond = null;
// Restored at load (contracts/page-roster.md §6/§8, D7): the initial mark does
// not scroll the board, because lastRevealedSid starts null only after the
// first real selectRow — see markInitialSelection below.
let selectedSid = window.CCWATCH_ROSTER
  ? (CCWATCH_ROSTER.loadSelection(getSelectionItem)?.sid ?? null) : null;
// Exactly one scroll per selection (D7): a restored selection, or a reselect
// of the sid already revealed, must not move the board again under the reader.
let lastRevealedSid = null;
// The row currently reachable by Tab (roving tabindex, FR-014). Restored by
// sid, not position, across every renderRoster call — see the pass at the
// end of renderRoster itself.
let focusedSid = null;

// The selection-change handler (contracts/page-roster.md §3/§6): sets the
// page-level selectedSid, persists it, re-renders the roster (row marker),
// emphasises the matching figure, and scrolls to it iff sid !== the last one
// revealed.
function selectRow(sid) {
  selectedSid = sid;
  CCWATCH_ROSTER.saveSelection(setSelectionItem, sid);
  renderRoster(lastSessions, lastCond);
  applySelectionEmphasis();
  revealSelection();
  // The selected figure's lines are pinned (see lookedAt), so a new selection
  // redraws them now rather than on the next tick.
  lookChanged();
}

// The figure emphasis is a class on the outer <button class="agent"> node,
// never inside .figart which updateFigure rebuilds wholesale every tick
// (contracts/page-roster.md §6).
function applySelectionEmphasis() {
  for (const b of $("boardinner").querySelectorAll(".agent[data-sid]")) {
    b.classList.toggle("selected", b.dataset.sid === selectedSid);
  }
}

// What "fly to the selection" becomes without a camera: bring the figure into
// the scroll container. scrollIntoView does the arithmetic, including the case
// where the figure is already visible and nothing should move.
//
// ⚠️ reducedMotion is read here, at the moment of the scroll, rather than left
// to the stylesheet: `scroll-behavior` in CSS would animate this one, and the
// setting has to be able to turn a specific movement off, not a rule.
function revealSelection() {
  if (selectedSid == null || selectedSid === lastRevealedSid) return;
  const fig = $("boardinner").querySelector(`.agent[data-sid="${selectedSid}"]`);
  if (!fig) return;
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  fig.scrollIntoView({
    behavior: reducedMotion ? "auto" : "smooth",
    block: "center", inline: "nearest",
  });
  lastRevealedSid = selectedSid;
}

// FR-021: selecting a row never opens the inspector — the existing .agent
// click handler (web/map.html:1339-1345 area) is untouched.
rosterEls.list.addEventListener("click", (e) => {
  const row = e.target.closest(".rrow");
  if (row) selectRow(row.dataset.sid);
});
// A double click is a shortcut to the same open the button/`o` key give
// (FR-003, FR-004) — it never changes the row's own single-click selection.
rosterEls.list.addEventListener("dblclick", (e) => {
  const row = e.target.closest(".rrow");
  if (row && lastRows[row.dataset.sid]) {
    openModal(row.dataset.sid, lastRows[row.dataset.sid].name, "row");
  }
});
// The roster's own pointer opener (page-modal.md §5): a real <button>, kept
// outside #rosterlist for the same reason the tombstone's dismiss button is.
rosterEls.open.addEventListener("click", () => {
  if (focusedSid != null && lastRows[focusedSid]) {
    openModal(focusedSid, lastRows[focusedSid].name, "row");
  }
});

// The tombstone's dismiss button (data-model.md §6): clears the selection
// and its stored record; the remaining rows keep rendering.
rosterEls.goneDismiss.addEventListener("click", () => {
  selectedSid = null;
  CCWATCH_ROSTER.saveSelection(setSelectionItem, null);
  renderRoster(lastSessions, lastCond);
  lookChanged();
});

// The row-focus handler (contracts/page-roster.md §3/§4): a row reached by
// Tab (rather than by an arrow key, which sets focusedSid itself below)
// becomes the roving-tabindex target too, so Tab and the arrows never
// disagree about which row is "current".
rosterEls.list.addEventListener("focusin", (e) => {
  const row = e.target.closest(".rrow");
  if (row) focusedSid = row.dataset.sid;
  renderRoster(lastSessions, lastCond);
});

// contracts/page-roster.md §4: bound to #rosterlist, never document, so the
// roster's arrows can never pan the map and the map's own keydown (bound to
// #world) can never move roster focus (FR-017).
rosterEls.list.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Home" || e.key === "End") {
    e.preventDefault();
    const keys = CCWATCH_ROSTER.keysOf(lastSessions);
    const next = CCWATCH_ROSTER.nextFocus(keys, focusedSid, e.key);
    if (next == null) return;
    focusedSid = next;
    renderRoster(lastSessions, lastCond);
    const el = rosterEls.list._reconcileIndex && rosterEls.list._reconcileIndex.row[next];
    if (el) el.focus();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (focusedSid != null) selectRow(focusedSid);
  } else if (e.key === "o" || e.key === "O") {
    // ⚠️ The opener the list advertises with aria-keyshortcuts="o". A declared
    // shortcut that does nothing is worse than an undeclared one: it is a
    // promise in the accessibility tree that the page does not keep. Enter
    // selects (and flies the camera); `o` opens the panel, so selecting and
    // inspecting stay separate actions.
    e.preventDefault();
    if (focusedSid != null) {
      const r = lastRows[focusedSid];
      if (r) openModal(r.sid, r.name, "roster");
    }
  }
});

// The width/viewport-change path (contracts/page-roster.md §3/§6). The board
// reflows itself — that is what flow layout is — so all this owes the map is a
// wire redraw, since the figures the wires connect have just moved.
function setWidth(w) {
  if (!window.CCWATCH_ROSTER) return;
  rosterEls.stage.style.setProperty("--roster-w", w + "px");
  rosterEls.divider.setAttribute("aria-valuenow", Math.round(w));
  rosterEls.divider.setAttribute("aria-valuemin", CCWATCH_ROSTER.WIDTH_MIN);
  rosterEls.divider.setAttribute("aria-valuemax", Math.round(
    Math.min(CCWATCH_ROSTER.WIDTH_MAX_PX, CCWATCH_ROSTER.WIDTH_MAX_FRAC * innerWidth)));
  CCWATCH_ROSTER.saveWidth(setWidthItem, w);
  relayoutWires();
  renderRoster(lastSessions, lastCond);
}

// #rdivider — pointer drag (contracts/page-roster.md §4): setPointerCapture,
// clamped per movement tick against the current window width. The drag base
// is the panel's width at pointerdown, not the running value, so repeated
// small moves cannot accumulate drift.
const rdrag = {active: false, id: null, x: 0, w: 0};
rosterEls.divider.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !window.CCWATCH_ROSTER) return;
  rdrag.active = true; rdrag.id = e.pointerId; rdrag.x = e.clientX;
  rdrag.w = rosterEls.roster.getBoundingClientRect().width;
  rosterEls.divider.setPointerCapture(e.pointerId);
});
rosterEls.divider.addEventListener("pointermove", e => {
  if (!rdrag.active || e.pointerId !== rdrag.id) return;
  const dx = e.clientX - rdrag.x;
  setWidth(CCWATCH_ROSTER.clampWidth(rdrag.w + dx, innerWidth));
});
function endRDrag(e) {
  if (!rdrag.active || e.pointerId !== rdrag.id) return;
  rdrag.active = false;
}
rosterEls.divider.addEventListener("pointerup", endRDrag);
rosterEls.divider.addEventListener("pointercancel", endRDrag);
rosterEls.divider.addEventListener("lostpointercapture", endRDrag);

// #rdivider — keyboard control (FR-032): ArrowLeft/ArrowRight by WIDTH_STEP
// (Shift = WIDTH_STEP_BIG), Home/End to the clamped extremes.
rosterEls.divider.addEventListener("keydown", e => {
  if (!window.CCWATCH_ROSTER) return;
  const cur = rosterEls.roster.getBoundingClientRect().width;
  let w;
  if (e.key === "ArrowLeft") w = cur - (e.shiftKey ? CCWATCH_ROSTER.WIDTH_STEP_BIG : CCWATCH_ROSTER.WIDTH_STEP);
  else if (e.key === "ArrowRight") w = cur + (e.shiftKey ? CCWATCH_ROSTER.WIDTH_STEP_BIG : CCWATCH_ROSTER.WIDTH_STEP);
  else if (e.key === "Home") w = CCWATCH_ROSTER.WIDTH_MIN;
  else if (e.key === "End") w = CCWATCH_ROSTER.WIDTH_MAX_PX;
  else return;
  e.preventDefault();
  setWidth(CCWATCH_ROSTER.clampWidth(w, innerWidth));
});

// Draws (or redraws) from whatever body is currently trusted enough to show —
// a fresh one on a successful tick, or the retained one on a failed/warming
// tick — with `VOLATILE` set first so every primitive it calls withholds (or
// restores) the same readings this same tick (FR-032, R4, R7).
function applyFeed(s, cond) {
  VOLATILE = cond.trust === "ok";
  lastSessions = s.sessions || [];
  lastCond = cond;
  renderRoster(lastSessions, cond);
  CAN_KILL = !!s.can_kill;

  // Keyed by identity (data-model.md §2), not by project/severity, so the
  // map does not reorder or reshape itself for any reason other than an
  // identity actually appearing or disappearing.
  lastRows = {};
  for (const r of (s.sessions || [])) lastRows[r.sid] = r;
  // ⚠️ Called from HERE, after the rows exist. A `?sid=` handler that ran at
  // load would look the session up in an empty table and find nothing, so the
  // link would work only on a page that happened to be slow.
  openFromQuery();
  // The modal stays current without being rebuilt (FR-014, FR-040): a
  // question answered elsewhere, a stat that changed, a session that vanished
  // all reach the open panel on the very next tick.
  renderModal();

  // R2/R8: districts/buildings/zones stay drawn through (a)/(b)/(c) — a
  // failure never presents as an empty city. In (b) there is nothing yet to
  // have drawn, which `buildWorldModel`'s `s.sessions || []` already covers.
  const {buildingCount} = drawBoard(s);
  updateGauges(s.usage);
  // One model for every condition on the page, built from this tick's `cond`
  // and this tick's VOLATILE gate — the same object the roster and the modal
  // read, never a second judgement of the same feed (principle XI).
  renderAlerts(CCWATCH_ALERTS.alerts({cond, host: s.host, volatile: VOLATILE}));
  // After drawBoard, never before: the wires are measured from the figures'
  // boxes, so they have to be laid out before anything reads them.
  wires(s.peers);
  renderComms(s.peers);

  updateCounts(s, buildingCount);

  renderIdle(cond);
  repaintFooter(cond);
}

let lastEtag = null, lastBody = null;
async function tick() {
  try {
    const res = await fetch("/api/state", lastEtag ? {headers: {"If-None-Match": lastEtag}} : {});
    if (res.status === 304) {
      if (lastBody) applyFeed(lastBody, CCWATCH_ALERTS.feedCondition(lastBody, null));
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastEtag = res.headers.get("ETag");
    const s = await res.json();
    lastBody = s;
    applyFeed(s, CCWATCH_ALERTS.feedCondition(s, null));
  } catch (e) {
    // A dead feed is stated, not left to look like an empty city (R2): the
    // last trusted body, if any, is redrawn with every VOLATILE reading
    // withheld rather than dropped from the page entirely.
    const cond = CCWATCH_ALERTS.feedCondition(lastBody, e.message);
    if (lastBody) applyFeed(lastBody, cond);
    else {
      // Nothing has ever been drawn, so there is no body to redraw — but the
      // reason still has to reach the page, and the header is now where it
      // goes. `host` is null rather than retained: a host reading from a feed
      // that just failed is exactly the stale number principle III forbids.
      VOLATILE = false;
      renderAlerts(CCWATCH_ALERTS.alerts({cond, host: null, volatile: false}));
    }
  }
}
// A page that becomes visible fires once immediately rather than waiting out
// whatever was left of the old interval. A hidden (backgrounded) tab does no
// periodic work of any kind — including the open conversation's own cadence.
function resume() {
  if (document.hidden) {
    clearEvery("tick");
    clearEvery("convo");
    return;
  }
  tick();
  every("tick", 3000, tick);
  // The transcript inspector, if open, follows the same visibility rule.
  if (subject) every("convo", 5000, loadConvo);
}
// What a resize owes the map, now that the layout reflows itself: the wires,
// and only the wires. Their endpoints are measured from the figures' boxes,
// and a resize moves every one of those — a wire still pointing where a figure
// used to be is worse than no wire. Not while hidden: a backgrounded tab does
// not resize, and measuring a display:none subtree returns zeroes.
// Shared by the resize listener, the roster's width change (US5) and the
// load-time call below (contracts/page-roster.md §7).
function relayoutWires() {
  if (document.hidden) return null;
  return wires(lastPeers);
}
document.addEventListener("visibilitychange", resume);
// Load-time width (contracts/page-roster.md §8, data-model.md §7 W4): below
// STACK_BREAKPOINT the stored width is not applied at all — the stacked
// layout is CSS's @media rule (T008), and #roster's flex-basis in that mode
// is "auto", so writing --roster-w there would just be a value nothing reads.
if (window.CCWATCH_ROSTER && !CCWATCH_ROSTER.stacked(innerWidth)) {
  const storedWidth = CCWATCH_ROSTER.loadWidth(getWidthItem)?.w ?? CCWATCH_ROSTER.WIDTH_DEFAULT;
  setWidth(CCWATCH_ROSTER.clampWidth(storedWidth, innerWidth));
}
// Before the first tick() (contracts/page-roster.md §8): a no-op while there
// are no wires to draw, but the position a later window resize needs to have
// always been able to rely on this function existing at.
relayoutWires();
resume();
addEventListener("resize", relayoutWires);
</script>
</body>
