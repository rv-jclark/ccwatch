const askEls = (function () {
  const box = $("ask");
  const dialogNote = document.createElement("div"); dialogNote.className = "q";
  const dialogHow = document.createElement("div"); dialogHow.className = "how";
  dialogHow.textContent = "No question is recorded in the transcript, so this is a dialog "
    + "(a permission prompt, for example). Its text is only in that session's terminal.";
  const qlist = document.createElement("div");
  const qHow = document.createElement("div"); qHow.className = "how";
  const qHowB = document.createElement("b"); qHowB.textContent = "queued behind it";
  qHow.append(
    document.createTextNode("This is a dialog: it can only be answered in that session's own"
      + " terminal. A message sent from here is "),
    qHowB,
    document.createTextNode(" and read once the dialog is resolved — it does not answer it."));
  box.append(dialogNote, dialogHow, qlist, qHow);
  [dialogNote, dialogHow, qlist, qHow].forEach(el => { el.style.display = "none"; });
  return {box, dialogNote, dialogHow, qlist, qHow};
})();
// Driven by CCWATCH_MODAL.askModel(row) — kind "questions"/"dialog"/"none"
// (FR-020, FR-023) — rather than re-deriving the same branches here.
function renderAsk(ask) {
  const {box, dialogNote, dialogHow, qlist, qHow} = askEls;
  if (ask.kind === "questions") {
    box.className = "on";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
    qlist.style.display = ""; qHow.style.display = "";
    const wanted = {};
    ask.questions.forEach((q, i) => { wanted["q" + i] = q; });
    reconcile(qlist, wanted, "q", makeQuestion, updateQuestion);
    return;
  }
  qlist.style.display = "none"; qHow.style.display = "none";
  reconcile(qlist, {}, "q", makeQuestion, updateQuestion);
  if (ask.kind === "dialog") {
    box.className = "on";
    dialogNote.style.display = ""; dialogHow.style.display = "";
    dialogNote.textContent = ask.note;
  } else {
    box.className = "";
    dialogNote.style.display = "none"; dialogHow.style.display = "none";
  }
}

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding.
// Built once, listeners attached once (FR-016/V1): only the text content
// changes per render. `killEls.row` is the closure `killgo`'s listener reads,
// updated on every renderKill() call rather than re-bound.
const killEls = (function () {
  const bar = $("killbar");
  if (!bar) return null;
  const startBtn = document.createElement("button");
  startBtn.className = "danger"; startBtn.id = "killstart";
  const killwhy = document.createElement("span"); killwhy.id = "killwhy";
  const confirmDiv = document.createElement("div"); confirmDiv.id = "killconfirm";
  const desc = document.createElement("div");
  const nameB = document.createElement("b");
  const memB = document.createElement("b");
  const resumeCode = document.createElement("code");
  const phaseB = document.createElement("b");
  const phaseWrap = document.createElement("span"); phaseWrap.style.display = "none";
  phaseWrap.append(document.createTextNode(" It is running spec-run phase "), phaseB,
    document.createTextNode(" — killing it aborts a paid model call."));
  const busyText = document.createTextNode("");
  desc.append(
    document.createTextNode("Killing "), nameB, document.createTextNode(" frees "), memB,
    document.createTextNode(". The conversation is kept — reopen it with "),
    resumeCode, document.createTextNode("."), phaseWrap, busyText);
  const row = document.createElement("div"); row.className = "row";
  const goBtn = document.createElement("button");
  goBtn.className = "danger"; goBtn.id = "killgo"; goBtn.textContent = "yes, kill it";
  const noBtn = document.createElement("button");
  noBtn.className = "ghost"; noBtn.id = "killno"; noBtn.textContent = "cancel";
  const out = document.createElement("span"); out.id = "killout";
  row.append(goBtn, noBtn, out);
  confirmDiv.append(desc, row);
  bar.append(startBtn, killwhy, confirmDiv);
  startBtn.addEventListener("click", () => confirmDiv.classList.add("on"));
  noBtn.addEventListener("click", () => confirmDiv.classList.remove("on"));
  goBtn.addEventListener("click", () => doKill(killEls.row));
  return {bar, startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText, out, row: null};
})();

// Two steps, and the second one names what is at stake. The figures come from
// the same snapshot the map draws, so what you are told you will free is what
// the process is actually holding. The bar is always present (FR-028); only
// #killstart's disabled attribute and #killwhy's text change.
function renderKill(kill) {
  if (!killEls) return;
  const {startBtn, killwhy, confirmDiv, nameB, memB, resumeCode, phaseWrap, phaseB, busyText} = killEls;
  killEls.row = subject ? lastRows[subject.sid] : null;
  startBtn.disabled = kill.state !== "ready";
  startBtn.textContent = kill.startLabel;
  killwhy.textContent = kill.reason ?? "";
  if (!kill.confirmOpen) confirmDiv.classList.remove("on");
  if (kill.confirm) {
    nameB.textContent = kill.confirm.name;
    memB.textContent = kill.confirm.frees ?? kill.confirm.freesNote ?? "";
    resumeCode.textContent = kill.confirm.resume;
    if (kill.confirm.phase) {
      phaseWrap.style.display = ""; phaseB.textContent = kill.confirm.phase;
    } else {
      phaseWrap.style.display = "none";
    }
    busyText.textContent = kill.confirm.busy
      ? " It is mid-turn, so a tool call may be left half-applied." : "";
  }
}

async function doKill(row) {
  // Independent of the disabled attribute (D17): a disabled control issues
  // no request even if the handler is somehow reached (FR-029).
  if (!CAN_KILL || !row) return;
  const out = $("killout");
  out.className = ""; out.textContent = "killing…";
  try {
    const res = await fetch("/api/kill", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: row.sid}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    // A refusal is shown verbatim: it explains what would have been lost, and
    // reducing it to "failed" would throw away the only useful part.
    out.textContent = j.state === "killed"
      ? `killed — ${row.rss_mb != null ? row.rss_mb + "MB" : "memory"} released`
      : (j.detail || j.error || "failed");
    if (j.state === "killed") setTimeout(closeModal, 1200);
  } catch (e) {
    out.className = "failed";
    out.textContent = "the kill request did not complete: " + e.message;
  }
}

// One function, called from openModal(), from applyFeed() on every tick, and
// from the kill/send handlers (page-modal.md §3). Writes into existing nodes
// only — nothing in the panel is created, removed or replaced by a render.
function renderModal() {
  if (!subject) return;
  const row = lastRows[subject.sid] ?? null;
  const fields = row ? CCWATCH_ROSTER.rowFields(row, {volatile: VOLATILE}) : null;
  const names = (lastBody && lastBody.sessions || []).map(r => r.name);
  const edges = (lastBody && lastBody.peers && lastBody.peers.edges) || [];
  // ⚠️ `lastCond` — the same object the banner above the map and the roster
  // read, never a second computation of the same judgement. Two renderings
  // that decide independently whether the feed can be trusted will eventually
  // disagree, and a reader has no way to tell which of them is lying
  // (principle XI).
  const m = CCWATCH_MODAL.panel({
    row, fields, subject, names, edges, cond: lastCond,
    volatile: VOLATILE, canSend: CAN_SEND, canKill: CAN_KILL,
    confirmOpen: killEls ? killEls.confirmDiv.classList.contains("on") : false,
  });
  $("iname").textContent = m.header.name;
  $("istatus").textContent = m.header.status ?? "";
  const ifeed = $("ifeed");
  const main = ifeed.querySelector(".main"), unreadable = ifeed.querySelector(".unreadable");
  main.textContent = m.feed.main;
  main.className = "main" + (m.feed.mainKind ? " " + m.feed.mainKind : "");
  unreadable.textContent = m.feed.unreadable;
  const igone = $("igone");
  igone.textContent = m.gone ?? "";
  igone.classList.toggle("on", m.gone != null);
  reconcile($("istats"), keyBy(m.stats, l => l.key), "stat", makeStatLine, updateStatLine);
  renderAsk(m.ask);
  renderKill(m.kill);
  $("replyText").disabled = $("replySend").disabled = m.send.state !== "ready";
  $("sendwhy").textContent = m.send.reason ?? "";
}
function keyBy(arr, fn) {
  const o = {};
  arr.forEach(x => { o[fn(x)] = x; });
  return o;
}
function makeStatLine() {
  const div = document.createElement("div");
  const dt = document.createElement("dt");
  const dd = document.createElement("dd");
  div.append(dt, dd);
  return div;
}
function updateStatLine(div, l) {
  div.querySelector("dt").textContent = l.label;
  div.querySelector("dd").textContent = l.text;
}

function openModal(sid, name, kind) {
  subject = {sid, name};
  opener = {sid, kind};
  $("replyText").value = "";
  $("replyOut").textContent = ""; $("replyOut").className = "";
  $("killout").textContent = ""; $("killout").className = "";
  if (killEls) killEls.confirmDiv.classList.remove("on");
  reconcile($("convo"), {}, "turn", makeTurn, updateTurn);
  setConvoMessage("reading the transcript…");
  renderModal();
  $("agentmodal").showModal();
  const canSend = CAN_SEND && !!lastRows[sid];
  (canSend ? $("replyText") : $("iclose")).focus();
  loadConvo();
  // Followed live while open, on its own slower cadence — the transcript is
  // read from disk per request and is much heavier than the roster poll.
  every("convo", 5000, loadConvo);
}
// Focus restored by identity (D5): live row for opener.sid, else the live
// figure, else the roster list, else the map itself — never a stale element.
function closeModal() {
  subject = null;
  clearEvery("convo");
  $("agentmodal").close();
  const o = opener;
  opener = null;
  if (!o) return;
  const row = $(`.rrow[data-sid="${o.sid}"]`);
  if (row) { row.focus(); return; }
  const fig = document.querySelector(`.agent[data-sid="${o.sid}"]`);
  if (fig) { fig.focus(); return; }
  const list = $("rosterlist");
  if (list && list.children.length) { list.focus(); return; }
  $("board").focus();
}
async function doSend() {
  // Independent of the disabled attribute (D17): a disabled control issues
  // no request even if the handler is somehow reached (FR-027).
  if (!CAN_SEND || !subject || !lastRows[subject.sid]) return;
  const msg = $("replyText").value.trim();
  if (!msg) return;
  const btn = $("replySend"), out = $("replyOut");
  btn.disabled = true; out.className = "";
  out.textContent = "sending, then checking it arrived…";
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: subject.sid, message: msg}),
    });
    const j = await res.json();
    out.className = j.state || "failed";
    out.textContent = j.state === "delivered" ? "delivered — it has the message"
                    : j.state === "queued" ? "queued — mid-turn, it will read this next turn"
                    : (j.error || j.detail || "failed");
    if (j.state === "delivered" || j.state === "queued") $("replyText").value = "";
  } catch (e) {
    out.className = "failed";
    out.textContent = "the send request did not complete: " + e.message;
  }

}
$("replySend").addEventListener("click", doSend);
$("iclose").addEventListener("click", closeModal);
$("agentmodal").addEventListener("cancel", () => { closeModal(); });
$("replyText").addEventListener("keydown", e => {
  if (e.key === "Enter") doSend();
});
let lastRows = {};
// No drag-suppression guard here any more. The camera needed one, because a
// pan ended in a click and a pan must not open the inspector; scrolling
// produces no click at all, so there is nothing to suppress and no flag whose
// staleness could swallow a real one.
document.addEventListener("click", e => {
  const a = e.target.closest(".agent[data-sid]");
  // Clicking is worth doing even in --read-only: seeing the conversation is
  // the more common reason to click an agent than messaging it.
  if (a) openModal(a.dataset.sid, a.dataset.name, "figure");
});

// ---- the map key -----------------------------------------------------------
// All that remains of what was the camera's button cluster. Built with DOM
// APIs, never innerHTML, so map.html still assigns innerHTML exactly twice
// (FR-047). Lives in #wrap, as a sibling of the scroll container rather than
// inside it, so it does not scroll away from the reader who needs it.
//
// The zoom-out / zoom-in / fit buttons and the "zoom 2x - mid" readout went
// with the camera. There is nothing left for them to do: the browser's own
// scrollbar is the position indicator, and there is no zoom to be at.
const boardctl = document.createElement("div");
boardctl.id = "boardctl";
const keyBtn = document.createElement("button");
keyBtn.id = "keyhelp"; keyBtn.type = "button"; keyBtn.textContent = "?";
keyBtn.className = "ghost";
keyBtn.setAttribute("aria-label", "map key — what the figures mean");

$("keyclose").addEventListener("click", () => $("keymodal").close());

// ---- the board -------------------------------------------------------------
// Rebuilt from the payload each tick by reconciliation \u2014 create/update/remove
// by identity key, nothing rebuilt wholesale \u2014 level by level, each level
// reconciled into its own parent so a district's disappearance takes its
// buildings with it without a second pass.
//
// There are no stored coordinates and no stored viewport. Both records the
// camera needed (ccwatch.map.plots.v1 and ccwatch.map.view.v1) are gone, and
// with them every failure mode reading and writing them had: a private-mode
// localStorage that throws, a full origin quota, a stored rectangle that no
// longer intersects anything placed. Flow layout needs none of it, and the
// order is derived from names, which the payload already carries.
function drawBoard(s) {
  const model = buildWorldModel(s);
  const inner = $("boardinner");

  const districtWanted = {};
  model.tree.forEach((d, i) => { districtWanted[d.key] = {...d, ord: i}; });
  reconcile(inner, districtWanted, "district", makeDistrict, updateDistrict);

  let buildingCount = 0;
  for (const d of model.tree) {
    const dEl = inner._reconcileIndex.district[d.key];
    const buildingWanted = {};
    d.buildings.forEach((b, i) => { buildingWanted[b.key] = {...b, ord: i}; });
    buildingCount += d.buildings.length;
    const buildingsEl = dEl.querySelector(".buildings");
    reconcile(buildingsEl, buildingWanted, "building", makeBuilding, updateBuilding);

    for (const b of d.buildings) {
      const bEl = buildingsEl._reconcileIndex.building[b.key];
      const zoneWanted = {};
      b.zones.forEach((z, i) => { zoneWanted[z.key] = {...z, ord: i}; });
      const zonesEl = bEl.querySelector(".zones");
      reconcile(zonesEl, zoneWanted, "zone", makeZone, updateZone);

      for (const z of b.zones) {
        const zEl = zonesEl._reconcileIndex.zone[z.key];
        const figureWanted = {};
        z.figures.forEach((f, i) => { figureWanted[f.key] = {ord: i, row: f.row}; });
        reconcile(zEl.querySelector(".figures"), figureWanted,
                  "figure", makeFigure, updateFigure);
      }
    }
  }
  return {buildingCount};
}

// ---- draw ------------------------------------------------------------------
// data-model.md §5 — the page's trust model. Computed fresh every tick from
// the read outcome and the payload fields it produced, and from nothing
// else: there is no flag to latch and no reload needed to clear one
// (FR-032, R7). `fetchFailure` is the thrown message when the read itself
// failed (a network error or `!res.ok`); otherwise it is null and `s` is a
// parsed body.
function computeFeedCondition(s, fetchFailure) {
  const ca = (s && s.collected_at) || {};
  const dataAge = ca.snapshot != null ? (Date.now() / 1000 - ca.snapshot) : null;
  const unreadable = s ? s.parse_failed : null;
  if (fetchFailure)
    return {trust: "feed_down", reason: fetchFailure, dataAge, unreadable, empty: false};
  if (s.warming)
    return {trust: "warming", reason: null, dataAge: null, unreadable, empty: false};
  if (s.snapshot_ok === false)
    return {trust: "feed_down", reason: s.snapshot_error || s.error || "snapshot failed",
            dataAge, unreadable, empty: false};
  return {
    trust: "ok", reason: null, dataAge, unreadable,
    empty: !s.error && (s.sessions || []).length === 0,
  };
}

// Built once, updated in place (FR-016/V1): sentence (a)/(b) share one node
// because only one of them can be true at a time; (c) and (d) are separate,
// additive nodes (R1) — `renderTrust` toggles each independently rather than
// replacing the whole panel.
const trustEls = (function () {
  const root = $("trust");
  const main = document.createElement("span"); main.className = "main";
  const unreadable = document.createElement("span"); unreadable.className = "unreadable";
  const emptyMsg = document.createElement("span"); emptyMsg.className = "emptymsg";
  root.append(main, unreadable, emptyMsg);
  return {root, main, unreadable, emptyMsg};
})();
function renderTrust(cond) {
  const {root, main, unreadable, emptyMsg} = trustEls;
  if (cond.trust === "feed_down") {
    main.className = "main down";
    main.textContent = `the feed is down: ${cond.reason} — is \`ccwatch serve\` still running? `
      + `showing session data from ${dur(cond.dataAge)} ago`;
  } else if (cond.trust === "warming") {
    main.className = "main warming";
    main.textContent = "taking the first snapshot — no session data has been collected yet";
  } else {
    main.className = "main"; main.textContent = "";
  }
  // R5: absent or null prints nothing, never `0`.
  unreadable.textContent = cond.unreadable > 0
    ? `${cond.unreadable} registry file(s) could not be read — run: ccwatch doctor` : "";
  // (d), verbatim (contracts/page-render.md §1) — never printed alongside
  // (a) or (c) since `empty` is only ever true when `trust === "ok"` (R6).
  emptyMsg.textContent = cond.empty
    ? "No live sessions. After a reboot, run ccwatch resume." : "";
  root.className = (main.textContent || unreadable.textContent || emptyMsg.textContent) ? "on" : "";
}

// The age of the data, not the age of the request: computed from the
// absolute collected_at instants in the body we hold, never from a stored
// `ages` value, so a repaint after a 304 or a resumed collection still shows
// the true elapsed time rather than freezing it at the moment the body
// arrived.
// Built once, updated in place (FR-016/V1): four persistent nodes — the
// three normal bits (updated-at, staleness, edge count) each with their own
// leading " · " separator so an absent bit leaves no dangling dot.
const footEls = (function () {
  const root = $("foot");
  const updated = document.createTextNode("");
  const staleSep = document.createTextNode("");
  const stale = document.createElement("span"); stale.className = "stale";
  const edgesSep = document.createTextNode("");
  const edges = document.createElement("span");
  root.append(updated, staleSep, stale, edgesSep, edges);
  return {root, updated, staleSep, stale, edgesSep, edges};
})();
function repaintFooter(cond) {
  // Nothing has ever been collected: the trust banner (b) says so and there
  // is nothing else to state here.
  if (cond.trust === "warming") {
    footEls.updated.textContent = "";
    footEls.staleSep.textContent = ""; footEls.stale.textContent = "";
    footEls.edgesSep.textContent = ""; footEls.edges.textContent = "";
    return;
  }
  footEls.updated.textContent = "updated " + new Date().toLocaleTimeString();
  // R3: marked stale with the measured age, recomputed every repaint —
  // shared with the (a)/(c) trust sentences' own `dataAge`.
  if (cond.dataAge > 10) {
    footEls.staleSep.textContent = " · ";
    footEls.stale.textContent = `sessions ${dur(cond.dataAge)} behind`;
  } else {
    footEls.staleSep.textContent = "";
    footEls.stale.textContent = "";
  }
  const total = (lastBody && lastBody.peers && lastBody.peers.edges)
    ? lastBody.peers.edges.length : 0;
  const drawn = lastDrawn;
  if (total > drawn) {
    footEls.edgesSep.textContent = " · ";
    footEls.edges.textContent = `${drawn}/${total} message edges drawn — the rest involve sessions`
            + ` that have exited (see the table view)`;
  } else {
    footEls.edgesSep.textContent = "";
    footEls.edges.textContent = "";
  }
}

// The row primitive, split make/update the same way makeFigure/updateFigure
// is (web/map.html:791-814): reconcile() creates the node once by `sid` and
// writes to the SAME node on every later tick, so focus/selection anchored to
// it survives a reorder.
function makeRow(sid) {
  const el = document.createElement("div");
  el.className = "rrow";
  el.dataset.sid = sid;
  el.setAttribute("role", "option");
  el.tabIndex = -1;
  el.setAttribute("aria-selected", "false");
  el.appendChild(spanChild("rname"));
  el.appendChild(spanChild("rwhere"));
  el.appendChild(spanChild("rstatus"));
  el.appendChild(spanChild("rmeta"));
  el.appendChild(spanChild("rasks"));
  el.appendChild(spanChild("rsel"));
  el.querySelector(".rsel").textContent = "selected";
  return el;
}
function spanChild(cls) {
  const s = document.createElement("span");
  s.className = cls;
  return s;
}
// The status word and its measurement are the pair FR-034 protects from
// truncation at any width — joined into one `.rstatus` node so the two
// never separate under the `flex:none` rule that keeps them whole.
function updateRow(el, {fields}) {
  el.querySelector(".rname").textContent = fields.name;
  el.querySelector(".rwhere").textContent = fields.where;
  el.querySelector(".rstatus").textContent = fields.measure != null
    ? `${fields.word} · ${fields.measure}` : fields.word;
  const meta = [];
  if (fields.pipeline != null) meta.push(fields.pipeline);
  if (fields.age != null) meta.push(`age ${fields.age}`);
  if (fields.ctx != null) meta.push(fields.ctx);
  if (fields.mem != null) meta.push(fields.mem);
  el.querySelector(".rmeta").textContent = meta.join(" · ");
  el.querySelector(".rasks").textContent = fields.asks != null ? `ASKS: ${fields.asks}` : "";
}

// contracts/page-roster.md §3. The body is filled in incrementally by this
// entry's user stories (US1's order and wording, US4's condition sentences,
// US3/US5's selection and width writes) — present now, guarded, only so every
// call site below already exists at the position FR-028 depends on.
function renderRoster(sessions, cond) {
  if (!window.CCWATCH_ROSTER) return;
  // data-model.md §5, C-B: while the first snapshot is still warming there is
  // no session data to trust yet, so the panel lists nothing — the retained
  // rows during a feed_down tick are the one case rows are kept (FR-025(b)).
  const rows = cond && cond.trust === "warming" ? [] : sessions;
  const st = CCWATCH_ROSTER.statements(cond);
  rosterEls.condMain.className = "main" + (st.mainKind ? " " + st.mainKind : "");
  rosterEls.condMain.textContent = st.main;
  rosterEls.condUnreadable.textContent = st.unreadable;
  rosterEls.condEmpty.textContent = st.empty;

  const keys = CCWATCH_ROSTER.keysOf(rows);
  const wanted = {};
  for (const r of rows) {
    if (r.sid == null) continue;
    wanted[r.sid] = {row: r, fields: CCWATCH_ROSTER.rowFields(r, {volatile: VOLATILE})};
  }
  const list = rosterEls.list;
  reconcile(list, wanted, "row", (sid) => makeRow(sid), updateRow);
  // Post-reconcile order (research.md D4): create/remove has already run, so
  // every wanted sid is attached — a freshly appended row sits at the end
  // until reorderPlan's insertBefore moves put it where `keys` wants it.
  const currentKeys = [];
  for (const child of list.children) currentKeys.push(child.dataset.sid);
  for (const move of CCWATCH_ROSTER.reorderPlan(currentKeys, keys)) {
    const el = list._reconcileIndex.row[move.key];
    const beforeEl = move.before != null ? list._reconcileIndex.row[move.before] : null;
    list.insertBefore(el, beforeEl);
  }
  rosterEls.title.textContent = "agents · " + keys.length;

  // Roving tabindex, restored by sid rather than position (FR-014, D4): a
  // reorder or a removal must not silently drop focus out of the listbox.
  // aria-selected is written here, in the same pass, from the page-level
  // selectedSid — never from a second read of the payload.
  const hadFocus = list.contains(document.activeElement);
  focusedSid = CCWATCH_ROSTER.focusTarget(focusedSid, keys) ?? (keys.length ? keys[0] : null);
  for (const child of list.children) {
    const sid = child.dataset.sid;
    child.tabIndex = sid === focusedSid ? 0 : -1;
    child.setAttribute("aria-selected", sid === selectedSid ? "true" : "false");
  }
  if (hadFocus && focusedSid != null) {
    const focusEl = list._reconcileIndex.row[focusedSid];
    if (focusEl) focusEl.focus();
  }

  // The tombstone (data-model.md §6, contracts/page-roster.md §3): resolved
  // from the same cond object the banner reads, never latched, so a good
  // snapshot that brings the sid back clears it on that same repaint.
  for (const r of sessions) if (r.sid != null && r.name != null) knownNames[r.sid] = r.name;
  const resolved = window.CCWATCH_ROSTER
    ? CCWATCH_ROSTER.resolveSelection(selectedSid, sessions, cond) : {state: "none"};
  if (resolved.state === "gone") {
    rosterEls.goneMsg.textContent = CCWATCH_ROSTER.goneText(resolved.sid, knownNames[resolved.sid]);
    rosterEls.gone.classList.add("on");
  } else {
    rosterEls.gone.classList.remove("on");
  }

  const focusedRow = rows.find(r => r.sid === focusedSid) || null;
  rosterEls.open.disabled = !focusedRow;
  rosterEls.open.textContent = focusedRow ? `open ${focusedRow.name}` : "no agents to open";
}
// Names seen in any trusted tick, kept for the tombstone sentence even after
// the sid it belongs to disappears from a later payload.
let knownNames = {};

// The two stored records (data-model.md §8), and now the only two: the plot
// record and the viewport record retired with the camera. Storage calls are
// injected (contracts roster-js.md §7) so a throwing localStorage cannot take
// the map down.
const SELECTION_KEY = "ccwatch.map.selection.v1";
function getSelectionItem() { return localStorage.getItem(SELECTION_KEY); }
function setSelectionItem(v) { localStorage.setItem(SELECTION_KEY, v); }
const WIDTH_KEY = "ccwatch.map.width.v1";
function getWidthItem() { return localStorage.getItem(WIDTH_KEY); }
function setWidthItem(v) { localStorage.setItem(WIDTH_KEY, v); }

// The roster's own state, read by every call site above renderRoster's own
// definition needs — kept here rather than re-derived, since applyFeed is the
// only place a fresh `sessions`/`cond` pair arrives.
let lastSessions = [], lastCond = null;
// Restored at load (contracts/page-roster.md §6/§8, D7): the initial mark does
// not scroll the board, because lastRevealedSid starts null only after the
// first real selectRow — see markInitialSelection below.
let selectedSid = window.CCWATCH_ROSTER
  ? (CCWATCH_ROSTER.loadSelection(getSelectionItem)?.sid ?? null) : null;
// Exactly one scroll per selection (D7): a restored selection, or a reselect
// of the sid already revealed, must not move the board again under the reader.
let lastRevealedSid = null;
// The row currently reachable by Tab (roving tabindex, FR-014). Restored by
// sid, not position, across every renderRoster call — see the pass at the
// end of renderRoster itself.
let focusedSid = null;

// The selection-change handler (contracts/page-roster.md §3/§6): sets the
// page-level selectedSid, persists it, re-renders the roster (row marker),
// emphasises the matching figure, and scrolls to it iff sid !== the last one
// revealed.
function selectRow(sid) {
  selectedSid = sid;
  CCWATCH_ROSTER.saveSelection(setSelectionItem, sid);
  renderRoster(lastSessions, lastCond);
  applySelectionEmphasis();
  revealSelection();
}

// The figure emphasis is a class on the outer <button class="agent"> node,
// never inside .figart which updateFigure rebuilds wholesale every tick
// (contracts/page-roster.md §6).
function applySelectionEmphasis() {
  for (const b of $("boardinner").querySelectorAll(".agent[data-sid]")) {
    b.classList.toggle("selected", b.dataset.sid === selectedSid);
  }
}

// What "fly to the selection" becomes without a camera: bring the figure into
// the scroll container. scrollIntoView does the arithmetic, including the case
// where the figure is already visible and nothing should move.
//
// ⚠️ reducedMotion is read here, at the moment of the scroll, rather than left
// to the stylesheet: `scroll-behavior` in CSS would animate this one, and the
// setting has to be able to turn a specific movement off, not a rule.
function revealSelection() {
  if (selectedSid == null || selectedSid === lastRevealedSid) return;
  const fig = $("boardinner").querySelector(`.agent[data-sid="${selectedSid}"]`);
  if (!fig) return;
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  fig.scrollIntoView({
    behavior: reducedMotion ? "auto" : "smooth",
    block: "center", inline: "nearest",
  });
  lastRevealedSid = selectedSid;
}

// FR-021: selecting a row never opens the inspector — the existing .agent
// click handler (web/map.html:1339-1345 area) is untouched.
rosterEls.list.addEventListener("click", (e) => {
  const row = e.target.closest(".rrow");
  if (row) selectRow(row.dataset.sid);
});
// A double click is a shortcut to the same open the button/`o` key give
// (FR-003, FR-004) — it never changes the row's own single-click selection.
rosterEls.list.addEventListener("dblclick", (e) => {
  const row = e.target.closest(".rrow");
  if (row && lastRows[row.dataset.sid]) {
    openModal(row.dataset.sid, lastRows[row.dataset.sid].name, "row");
  }
});
// The roster's own pointer opener (page-modal.md §5): a real <button>, kept
// outside #rosterlist for the same reason the tombstone's dismiss button is.
rosterEls.open.addEventListener("click", () => {
  if (focusedSid != null && lastRows[focusedSid]) {
    openModal(focusedSid, lastRows[focusedSid].name, "row");
  }
});

// The tombstone's dismiss button (data-model.md §6): clears the selection
// and its stored record; the remaining rows keep rendering.
rosterEls.goneDismiss.addEventListener("click", () => {
  selectedSid = null;
  CCWATCH_ROSTER.saveSelection(setSelectionItem, null);
  renderRoster(lastSessions, lastCond);
});

// The row-focus handler (contracts/page-roster.md §3/§4): a row reached by
// Tab (rather than by an arrow key, which sets focusedSid itself below)
// becomes the roving-tabindex target too, so Tab and the arrows never
// disagree about which row is "current".
rosterEls.list.addEventListener("focusin", (e) => {
  const row = e.target.closest(".rrow");
  if (row) focusedSid = row.dataset.sid;
  renderRoster(lastSessions, lastCond);
});

// contracts/page-roster.md §4: bound to #rosterlist, never document, so the
// roster's arrows can never pan the map and the map's own keydown (bound to
// #world) can never move roster focus (FR-017).
rosterEls.list.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Home" || e.key === "End") {
    e.preventDefault();
    const keys = CCWATCH_ROSTER.keysOf(lastSessions);
    const next = CCWATCH_ROSTER.nextFocus(keys, focusedSid, e.key);
    if (next == null) return;
    focusedSid = next;
    renderRoster(lastSessions, lastCond);
    const el = rosterEls.list._reconcileIndex && rosterEls.list._reconcileIndex.row[next];
    if (el) el.focus();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (focusedSid != null) selectRow(focusedSid);
  } else if (e.key === "o" || e.key === "O") {
    // ⚠️ The opener the list advertises with aria-keyshortcuts="o". A declared
    // shortcut that does nothing is worse than an undeclared one: it is a
    // promise in the accessibility tree that the page does not keep. Enter
    // selects (and flies the camera); `o` opens the panel, so selecting and
    // inspecting stay separate actions.
    e.preventDefault();
    if (focusedSid != null) {
      const r = lastRows[focusedSid];
      if (r) openModal(r.sid, r.name, "roster");
    }
  }
});

// The width/viewport-change path (contracts/page-roster.md §3/§6). The board
// reflows itself — that is what flow layout is — so all this owes the map is a
// wire redraw, since the figures the wires connect have just moved.
function setWidth(w) {
  if (!window.CCWATCH_ROSTER) return;
  rosterEls.stage.style.setProperty("--roster-w", w + "px");
  rosterEls.divider.setAttribute("aria-valuenow", Math.round(w));
  rosterEls.divider.setAttribute("aria-valuemin", CCWATCH_ROSTER.WIDTH_MIN);
  rosterEls.divider.setAttribute("aria-valuemax", Math.round(
    Math.min(CCWATCH_ROSTER.WIDTH_MAX_PX, CCWATCH_ROSTER.WIDTH_MAX_FRAC * innerWidth)));
  CCWATCH_ROSTER.saveWidth(setWidthItem, w);
  relayoutWires();
  renderRoster(lastSessions, lastCond);
}

// #rdivider — pointer drag (contracts/page-roster.md §4): setPointerCapture,
// clamped per movement tick against the current window width. The drag base
// is the panel's width at pointerdown, not the running value, so repeated
// small moves cannot accumulate drift.
const rdrag = {active: false, id: null, x: 0, w: 0};
rosterEls.divider.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !window.CCWATCH_ROSTER) return;
  rdrag.active = true; rdrag.id = e.pointerId; rdrag.x = e.clientX;
  rdrag.w = rosterEls.roster.getBoundingClientRect().width;
  rosterEls.divider.setPointerCapture(e.pointerId);
});
rosterEls.divider.addEventListener("pointermove", e => {
  if (!rdrag.active || e.pointerId !== rdrag.id) return;
  const dx = e.clientX - rdrag.x;
  setWidth(CCWATCH_ROSTER.clampWidth(rdrag.w + dx, innerWidth));
});
function endRDrag(e) {
  if (!rdrag.active || e.pointerId !== rdrag.id) return;
  rdrag.active = false;
}
rosterEls.divider.addEventListener("pointerup", endRDrag);
rosterEls.divider.addEventListener("pointercancel", endRDrag);
rosterEls.divider.addEventListener("lostpointercapture", endRDrag);

// #rdivider — keyboard control (FR-032): ArrowLeft/ArrowRight by WIDTH_STEP
// (Shift = WIDTH_STEP_BIG), Home/End to the clamped extremes.
rosterEls.divider.addEventListener("keydown", e => {
  if (!window.CCWATCH_ROSTER) return;
  const cur = rosterEls.roster.getBoundingClientRect().width;
  let w;
  if (e.key === "ArrowLeft") w = cur - (e.shiftKey ? CCWATCH_ROSTER.WIDTH_STEP_BIG : CCWATCH_ROSTER.WIDTH_STEP);
  else if (e.key === "ArrowRight") w = cur + (e.shiftKey ? CCWATCH_ROSTER.WIDTH_STEP_BIG : CCWATCH_ROSTER.WIDTH_STEP);
  else if (e.key === "Home") w = CCWATCH_ROSTER.WIDTH_MIN;
  else if (e.key === "End") w = CCWATCH_ROSTER.WIDTH_MAX_PX;
  else return;
  e.preventDefault();
  setWidth(CCWATCH_ROSTER.clampWidth(w, innerWidth));
});

// Draws (or redraws) from whatever body is currently trusted enough to show —
// a fresh one on a successful tick, or the retained one on a failed/warming
// tick — with `VOLATILE` set first so every primitive it calls withholds (or
// restores) the same readings this same tick (FR-032, R4, R7).
function applyFeed(s, cond) {
  VOLATILE = cond.trust === "ok";
  lastSessions = s.sessions || [];
  lastCond = cond;
  renderRoster(lastSessions, cond);
  CAN_KILL = !!s.can_kill;

  // Keyed by identity (data-model.md §2), not by project/severity, so the
  // map does not reorder or reshape itself for any reason other than an
  // identity actually appearing or disappearing.
  lastRows = {};
  for (const r of (s.sessions || [])) lastRows[r.sid] = r;
  // The modal stays current without being rebuilt (FR-014, FR-040): a
  // question answered elsewhere, a stat that changed, a session that vanished
  // all reach the open panel on the very next tick.
  renderModal();

  // R2/R8: districts/buildings/zones stay drawn through (a)/(b)/(c) — a
  // failure never presents as an empty city. In (b) there is nothing yet to
  // have drawn, which `buildWorldModel`'s `s.sessions || []` already covers.
  const {buildingCount} = drawBoard(s);
  updateGauges(s.usage);
  hostwarn(s.host);
  // After drawBoard, never before: the wires are measured from the figures'
  // boxes, so they have to be laid out before anything reads them.
  const drawn = wires(s.peers) || 0;

  updateCounts(s, buildingCount);

  lastDrawn = drawn;
  renderTrust(cond);
  repaintFooter(cond);
}

let lastEtag = null, lastBody = null, lastDrawn = 0;
async function tick() {
  try {
    const res = await fetch("/api/state", lastEtag ? {headers: {"If-None-Match": lastEtag}} : {});
    if (res.status === 304) {
      if (lastBody) applyFeed(lastBody, computeFeedCondition(lastBody, null));
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastEtag = res.headers.get("ETag");
    const s = await res.json();
    lastBody = s;
    applyFeed(s, computeFeedCondition(s, null));
  } catch (e) {
    // A dead feed is stated, not left to look like an empty city (R2): the
    // last trusted body, if any, is redrawn with every VOLATILE reading
    // withheld rather than dropped from the page entirely.
    const cond = computeFeedCondition(lastBody, e.message);
    if (lastBody) applyFeed(lastBody, cond);
    else { VOLATILE = false; renderTrust(cond); }
  }
}
// A page that becomes visible fires once immediately rather than waiting out
// whatever was left of the old interval. A hidden (backgrounded) tab does no
// periodic work of any kind — including the open conversation's own cadence.
function resume() {
  if (document.hidden) {
    clearEvery("tick");
    clearEvery("convo");
    return;
  }
  tick();
  every("tick", 3000, tick);
  // The transcript inspector, if open, follows the same visibility rule.
  if (subject) every("convo", 5000, loadConvo);
}
// What a resize owes the map, now that the layout reflows itself: the wires,
// and only the wires. Their endpoints are measured from the figures' boxes,
// and a resize moves every one of those — a wire still pointing where a figure
// used to be is worse than no wire. Not while hidden: a backgrounded tab does
// not resize, and measuring a display:none subtree returns zeroes.
// Shared by the resize listener, the roster's width change (US5) and the
// load-time call below (contracts/page-roster.md §7).
function relayoutWires() {
  if (document.hidden) return;
  wires(lastPeers);
}
document.addEventListener("visibilitychange", resume);
// Load-time width (contracts/page-roster.md §8, data-model.md §7 W4): below
// STACK_BREAKPOINT the stored width is not applied at all — the stacked
// layout is CSS's @media rule (T008), and #roster's flex-basis in that mode
// is "auto", so writing --roster-w there would just be a value nothing reads.
if (window.CCWATCH_ROSTER && !CCWATCH_ROSTER.stacked(innerWidth)) {
  const storedWidth = CCWATCH_ROSTER.loadWidth(getWidthItem)?.w ?? CCWATCH_ROSTER.WIDTH_DEFAULT;
  setWidth(CCWATCH_ROSTER.clampWidth(storedWidth, innerWidth));
}
// Before the first tick() (contracts/page-roster.md §8): a no-op while there
// are no wires to draw, but the position a later window resize needs to have
// always been able to rely on this function existing at.
relayoutWires();
resume();
addEventListener("resize", relayoutWires);
</script>
</body>
</html>
