<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccwatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%234ec9a5'/%3E%3C/svg%3E">
<style>
  /* Deliberately restrained. This is an instrument panel: it is read at a
     glance, from across a room, while you are doing something else. Every
     severity carries a WORD as well as a colour, matching the terminal
     output exactly, so the two cannot tell you different things. */
  :root {
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --ink:#e6e9ef; --dim:#8b93a3;
    --ok:#4ec9a5; --warn:#e3b341; --bad:#f07171; --block:#c586e8; --info:#5fa8e8;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --line:#e3e6ec; --ink:#1a1d23; --dim:#6b7280;
            --ok:#0f8a63; --warn:#9a6b00; --bad:#c0392b; --block:#7c3aed; --info:#1f6fb2; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  /* Two columns, as on the map and for the same two reasons: the meter sits
     level with the title, and the header's height cannot depend on whether a
     usage reading arrived. See the note in web/map.html. */
  header { display:grid; grid-template-columns:minmax(0, 1fr) auto;
           align-items:start; gap:1rem;
           padding:1rem 1.25rem; border-bottom:1px solid var(--line); }
  .hleft { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
           min-width:0; }
  /* 1000px, not the 720px the rest of the page uses: the meter's column
     reserves 45em, and below 1000px that would squeeze the title's column to
     a few hundred pixels. See the note in web/map.html. */
  @media (max-width:1000px) {
    header { grid-template-columns:minmax(0, 1fr); }
    /* The reservation goes with the columns: 45em is wider than a phone, and
       a header wider than the window is content nobody can reach. */
    /* ⚠️ `header .gauges`, not `.gauges`. The plain selector lost to the
       `.gauges` rule further down the stylesheet — same specificity, later
       wins — so the reservation stayed in force at 420px and the header
       measured 603px of content in a 420px window. Specificity rather than
       source order, so moving either rule cannot bring the bug back. */
    header .gauges { min-width:0; }
  }
  /* The alert control. Identical in behaviour and wording to the map's, from
     the same module (web/alerts.js), because one condition with two phrasings
     is two things to learn and two things to keep in sync.
     ⚠️ `flex:1 1 0` rather than a width: the slot asks for nothing and grows
     into the header's leftover space, so its size does not depend on whether
     it holds a trigger and the trigger's arrival cannot re-wrap the header.
     A fixed reservation was tried first and wrapped the header by itself — see
     the note in web/map.html for the measurement. */
  #alertslot { flex:1 1 0; min-width:12ch; display:flex; align-items:baseline; }
  #alertslot.quiet #alertbtn { visibility:hidden; }
  #alertbtn { max-width:100%; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; background:none; font:inherit; font-size:12px;
              line-height:1.2; padding:.1rem .45rem; border-radius:4px;
              cursor:pointer; border:1px solid currentColor; }
  #alertbtn.bad { color:var(--bad); }
  #alertbtn.warn { color:var(--warn); }
  #alertbtn.info { color:var(--dim); }
  /* left:auto so only `right` positions it: the UA's `left:0; right:0` would
     leave the box stretched from the left edge (see web/map.html's note). */
  dialog#alertmodal { position:fixed; left:auto; margin:0; max-width:min(560px, 92vw);
           background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:.7rem; color:var(--ink);
           box-shadow:0 8px 40px rgba(0,0,0,.5); overflow:auto; }
  dialog#alertmodal[open] { display:flex; flex-direction:column; gap:.5rem; }
  #alertmodal::backdrop { background:rgba(0,0,0,.35); }
  #alerthead { display:flex; align-items:baseline; justify-content:space-between;
               gap:.6rem; padding-bottom:.4rem; border-bottom:1px solid var(--line); }
  #alertmodal button.ghost { background:none; border:1px solid var(--line);
               color:var(--dim); font:inherit; font-size:12px; padding:.1rem .45rem;
               border-radius:4px; cursor:pointer; }
  #alertlist { display:flex; flex-direction:column; gap:.45rem; font-size:13px; }
  .alertitem { overflow-wrap:anywhere; }
  .alertitem.bad { color:var(--bad); }
  .alertitem.warn { color:var(--warn); }
  .alertitem.info { color:var(--dim); }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--dim); font-weight:400; }
  /* ⚠️ Height reserved whether or not there is a reading, so a withheld
     usage reading cannot move the table underneath it — measured on the map
     at 37px of shift before this. See the note in web/map.html. */
  /* Own header row always, and a reserved height: between them the header's
     height does not depend on whether a usage reading arrived. See the note
     in web/map.html for what each of the two fixes was measured to cost. */
  /* Both reservations, height and width: a withheld reading must not change
     the column's size in either direction, or whatever sits beside it
     re-wraps and the header changes height anyway. See web/map.html. */
  .gauges { display:flex; gap:1.25rem; align-items:flex-start;
            flex-wrap:wrap; justify-content:flex-end;
            min-height:4.8em; min-width:45em; }
  .g-label { color:var(--dim); }
  .g-val { font-weight:600; }
  .g-reset { color:var(--dim); font-size:12px; }
  /* The same instrument as the map's, from the same module: the consumption
     bar and the clock bar stacked to one scale, because 41% used says nothing
     until you can see whether 41% of the window went with it. */
  .g-gauge { display:flex; flex-direction:column; gap:2px; }
  .g-head { display:flex; gap:.4rem; align-items:baseline; }
  .g-barrow { display:flex; align-items:center; gap:.4rem; }
  .g-bars { display:flex; flex-direction:column; gap:2px; width:78px; flex:none; }
  .g-bar { height:4px; border-radius:2px; overflow:hidden;
           background:color-mix(in srgb, var(--ink) 14%, transparent); }
  .g-bar > i { display:block; height:100%; }
  .g-used.ok > i   { background:var(--ok); }
  .g-used.warn > i { background:var(--warn); }
  .g-used.bad > i  { background:var(--bad); }
  /* Neutral on purpose: the clock is a reference, not a verdict. */
  .g-time > i { background:var(--dim); }
  .g-elapsed { color:var(--dim); }
  .g-pace { color:var(--warn); font-weight:600; }
  main { padding:1.25rem; display:grid; gap:1.25rem; max-width:1500px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
       margin:0; padding:.75rem 1rem; border-bottom:1px solid var(--line); font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:.4rem 1rem; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.06em; }
  tbody tr { border-top:1px solid var(--line); }
  tbody tr:first-child { border-top:0; }
  .name { font-weight:600; }
  .dim { color:var(--dim); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sev4 { color:var(--block); } .sev3 { color:var(--bad); }
  .sev2 { color:var(--ok); }    .sev1 { color:var(--info); } .sev0 { color:var(--dim); }
  .badge { display:inline-block; padding:0 .4rem; border-radius:3px; font-size:12px;
           border:1px solid currentColor; }
  .sub td { padding-top:0; color:var(--dim); font-size:13px; }
  .sub .crash { color:var(--bad); }
  .empty { padding:1rem; color:var(--dim); }
  .err { padding:.6rem 1rem; color:var(--bad); border-top:1px solid var(--line); }
  /* The peer graph. An adjacency list, not a force-directed blob: with a
     handful of sessions a node-and-spring diagram is harder to read than the
     list it is drawn from, and it moves every time you look at it. */
  .edge { display:grid; grid-template-columns:1fr auto 1fr; gap:.6rem; align-items:center;
          padding:.5rem 1rem; border-top:1px solid var(--line); }
  .edge:first-of-type { border-top:0; }
  .edge .to { text-align:left; }
  .edge .from { text-align:right; }
  .arrow { color:var(--info); white-space:nowrap; }
  .edge .sample { grid-column:1/-1; color:var(--dim); font-size:12px;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer { padding:0 1.25rem 2rem; color:var(--dim); font-size:12px; }
  .stale { color:var(--warn); }
  /* Replying from the page. Kept visually quiet until you open it: this is a
     monitoring view first, and a row that shouts an input box at you on every
     repaint is a row you stop reading. */
  .act { background:none; border:1px solid var(--line); color:var(--dim);
         font:inherit; font-size:12px; padding:0 .45rem; border-radius:3px;
         cursor:pointer; }
  .act:hover { color:var(--ink); border-color:var(--dim); }
  .act.blocked { color:var(--block); border-color:var(--block); }
  .replyrow td { padding-top:0; }
  .reply { display:flex; gap:.5rem; align-items:center; }
  .reply input { flex:1; background:var(--bg); border:1px solid var(--line);
                 color:var(--ink); font:inherit; padding:.35rem .5rem; border-radius:3px; }
  .reply input:focus { outline:none; border-color:var(--info); }
  .reply button { background:var(--info); border:0; color:#fff; font:inherit;
                  padding:.35rem .8rem; border-radius:3px; cursor:pointer; }
  .reply button:disabled { opacity:.5; cursor:default; }
  .outcome { font-size:12px; }
  .outcome.delivered { color:var(--ok); }
  .outcome.queued { color:var(--warn); }
  .outcome.failed { color:var(--bad); }
  nav a { color:var(--dim); text-decoration:none; margin-right:.75rem; font-size:12px; }
  nav a.on { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="hleft">
  <h1>ccwatch <span id="counts"></span></h1>
  <nav><a href="/" class="on">table</a><a href="/map">map</a></nav>
  <!-- role="status" so a condition arriving while you are reading the table is
       announced once, politely; renderAlerts only writes the trigger's text
       when it changes, so a 3-second repaint does not re-announce it. -->
  <div id="alertslot" class="quiet" role="status">
    <button type="button" id="alertbtn" aria-haspopup="dialog"
            aria-expanded="false" aria-controls="alertmodal"></button>
  </div>
  </div>
  <div class="gauges" id="gauges"></div>
</header>
<dialog id="alertmodal" aria-labelledby="alerttitle">
  <div id="alerthead">
    <strong id="alerttitle">alerts</strong>
    <button type="button" id="alertclose" class="ghost">close</button>
  </div>
  <div id="alertlist"></div>
</dialog>
<main>
  <section><h2>Sessions</h2><div id="sessions"></div></section>
  <section><h2>Unfinished runs</h2><div id="unfinished"></div></section>
  <section><h2>Deploys</h2><div id="deploys"></div></section>
  <section><h2>Who is talking to whom</h2><div id="peers"></div></section>
</main>
<footer id="foot"></footer>
<script src="/alerts.js"></script>
<script src="/usage.js"></script>
<script>
const $ = id => document.getElementById(id);
// Injected by the server into the page it serves. A page that cannot read this
// HTML cannot obtain it, which is what stops a drive-by POST from another site
// injecting prompts into your agents.
const SEND_TOKEN = "__CCWATCH_SEND_TOKEN__";
const CAN_SEND = SEND_TOKEN && !SEND_TOKEN.startsWith("__");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => { if (s == null) return "-"; s = Math.max(0, s);
  return s < 60 ? Math.floor(s)+"s" : s < 3600 ? Math.floor(s/60)+"m"
       : s < 86400 ? Math.floor(s/3600)+"h" : Math.floor(s/86400)+"d"; };

// ---- the alert control -----------------------------------------------------
// Every condition that says this page cannot be believed, in one header
// control: the host-pressure banner that used to sit between the header and
// the table and push it down, and the feed-down sentence that used to be in
// the footer — below the fold on any machine with more than a screenful of
// sessions, which is when you most need to know the numbers above it are old.
// Both sentences come from web/alerts.js, the same module the map uses.
//
// Built with DOM APIs rather than this page's usual innerHTML: a condition's
// reason is a server string, and an escaping question is not worth having in
// the one element whose job is to be believed.
let lastTriggerText = null;
function renderAlerts(model) {
  const slot = $("alertslot"), btn = $("alertbtn"), modal = $("alertmodal");
  const list = $("alertlist"), title = $("alerttitle");
  const {items, trigger} = model;
  list.textContent = "";
  for (const it of items) {
    const div = document.createElement("div");
    div.className = "alertitem " + it.sev;
    div.textContent = it.text;
    list.appendChild(div);
  }
  title.textContent = items.length === 1 ? "1 alert" : `${items.length} alerts`;
  if (!trigger) {
    // Nothing is wrong: the control is absent, not green (principle XII), and
    // an open panel closes rather than going on stating a cleared condition.
    if (modal.open) closeAlerts();
    slot.className = "quiet";
    btn.className = "";
    if (lastTriggerText !== null) { btn.textContent = ""; lastTriggerText = null; }
    btn.removeAttribute("aria-label");
    return;
  }
  slot.className = "";
  btn.className = trigger.sev;
  // Written only on a change, so role="status" does not re-announce an
  // unchanged condition on every 3-second repaint.
  if (trigger.text !== lastTriggerText) {
    btn.textContent = trigger.text;
    lastTriggerText = trigger.text;
  }
  btn.setAttribute("aria-label", trigger.label);
  btn.title = trigger.label;
}
// Anchored under the trigger at open time, not at a guessed header height —
// this header wraps at narrow widths — and clamped so the panel is always
// fully on screen.
function openAlerts() {
  const btn = $("alertbtn"), modal = $("alertmodal");
  const r = btn.getBoundingClientRect();
  const top = Math.round(r.bottom + 6);
  modal.style.top = top + "px";
  modal.style.right = Math.max(8, Math.round(innerWidth - r.right)) + "px";
  modal.style.maxHeight = Math.max(80, innerHeight - top - 12) + "px";
  modal.showModal();
  btn.setAttribute("aria-expanded", "true");
}
function closeAlerts() {
  $("alertmodal").close();
  $("alertbtn").setAttribute("aria-expanded", "false");
}
$("alertbtn").addEventListener("click",
  () => ($("alertmodal").open ? closeAlerts() : openAlerts()));
$("alertmodal").addEventListener("click", e => {
  // With showModal() a backdrop click targets the dialog itself.
  if (e.target === $("alertmodal")) closeAlerts();
});
// Escape is the browser's own and bypasses the button's handler, so
// aria-expanded is corrected from the dialog's own close event.
$("alertmodal").addEventListener("close",
  () => $("alertbtn").setAttribute("aria-expanded", "false"));
$("alertclose").addEventListener("click", closeAlerts);

// ⚠️ Built with DOM APIs rather than this page's usual innerHTML, because the
// bars carry inline widths: a percentage interpolated into a style attribute
// is the one place in this file where a payload value would reach CSS, and a
// number is easy to be sure of only when it never touches markup at all.
// The shaping is web/usage.js's, shared with the map so the two headers cannot
// disagree about how much of a window has gone (principle XI).
function gaugeNode(g) {
  const wrap = document.createElement("span");
  wrap.className = "g-gauge";
  const head = document.createElement("span"); head.className = "g-head";
  const label = document.createElement("span"); label.className = "g-label";
  label.textContent = g.name;
  const val = document.createElement("span");
  val.className = "g-val " + CCWATCH_USAGE.band(g.usedPct);
  val.textContent = g.usedText + " used";
  head.append(label, val);
  // ⚠️ Appended here, not at the end. An earlier version of this function
  // built `head`, filled it, and never attached it: the table view rendered
  // the two bars and the reset line with no window name and no percentages
  // above them. Every assertion was green — verify-ui only drives /map, so
  // nothing in a browser looked at this page until a screenshot did.
  wrap.appendChild(head);
  const barrow = document.createElement("span"); barrow.className = "g-barrow";
  const bars = document.createElement("span"); bars.className = "g-bars";
  const used = document.createElement("span");
  used.className = "g-bar g-used " + CCWATCH_USAGE.band(g.usedPct);
  used.setAttribute("role", "img");
  used.setAttribute("aria-label", g.usedLabel);
  used.title = g.usedLabel;
  const usedFill = document.createElement("i");
  usedFill.style.width = Math.min(100, Math.max(0, g.usedPct)) + "%";
  used.appendChild(usedFill);
  bars.appendChild(used);
  // Absent, not zero, when the elapsed fraction cannot be known: a bar at 0%
  // would read as "the window just started", which is nobody's measurement.
  if (g.elapsedPct != null) {
    const elapsed = document.createElement("span");
    elapsed.className = "g-elapsed";
    elapsed.textContent = "· " + g.elapsedText + " elapsed";
    head.appendChild(elapsed);
    const time = document.createElement("span");
    time.className = "g-bar g-time";
    time.setAttribute("role", "img");
    time.setAttribute("aria-label", g.elapsedLabel);
    time.title = g.elapsedLabel;
    const timeFill = document.createElement("i");
    timeFill.style.width = Math.min(100, Math.max(0, g.elapsedPct)) + "%";
    time.appendChild(timeFill);
    bars.appendChild(time);
  }
  barrow.appendChild(bars);
  if (g.pace === "ahead") {
    const pace = document.createElement("span");
    pace.className = "g-pace";
    pace.textContent = "ahead of the clock";
    barrow.appendChild(pace);
  }
  wrap.appendChild(barrow);
  if (g.resetIn != null) {
    const reset = document.createElement("span");
    reset.className = "g-reset";
    // The relative time to act on, and the wall clock to put in a calendar,
    // in one fixed zone so two readers say the same thing.
    reset.textContent = g.resetClock
      ? "resets " + g.resetIn + " · " + g.resetClock
      : "resets " + g.resetIn;
    wrap.appendChild(reset);
  }
  return wrap;
}
function renderGauges(u) {
  const el = $("gauges");
  el.textContent = "";
  const note = (cls, text) => {
    const s = document.createElement("span");
    s.className = cls; s.textContent = text;
    el.appendChild(s);
  };
  if (!u) {
    note("dim", "usage not reporting — run ccwatch install-statusline");
    return;
  }
  // Withheld rather than annotated past the staleness limit. A percentage on
  // screen is read as current whatever is printed beside it — a fixture left
  // over from an earlier run showed 52% while the real figure was 7%.
  // ⚠️ Withheld when the reporters do not agree, and BEFORE the staleness
  // check, because a disagreement is not a gap: several sessions each wrote a
  // fresh figure and at most one of them is true. Measured on a real machine —
  // four sessions reporting 12%, 14%, 15% and nothing inside one minute, and a
  // menu bar cycling 101% / 88% / 62%. Showing the newest would make the wrong
  // number stable rather than make it right (constitution I and III).
  if (u.disagree) {
    note("stale", `usage: ${u.disagree.count} sessions report different` +
      ` figures (${Math.floor(u.disagree.lo)}%\u2013${Math.floor(u.disagree.hi)}%)` +
      ` \u2014 not shown`);
    return;
  }
  if (u.age > (u.stale_after || 600)) {
    note("stale", `usage: last reading ${dur(u.age)} old — not shown`);
    return;
  }
  for (const g of CCWATCH_USAGE.gauges(u, Date.now() / 1000)) el.appendChild(gaugeNode(g));
  if (u.age > 60) note("stale", `[${dur(u.age)} old]`);
}

function sessions(rows) {
  if (!rows.length) return '<p class="empty">No live sessions. After a reboot, run <b>ccwatch resume</b>.</p>';
  let h = '<table><thead><tr><th>Name</th><th>Project</th><th>Status</th><th class="num">Age</th>'
        + '<th class="num">Ctx</th><th>Last</th><th></th></tr></thead><tbody>';
  for (const r of rows) {
    const sev = Math.max(r.sev, r.psev || 0);
    const last = r.waited != null ? `${r.note} ${dur(r.waited)}`
               : r.note === "quiet" ? `quiet ${dur(r.quiet)}`
               : r.note ? r.note : r.quiet != null ? `${dur(r.quiet)} ago` : "-";
    const ctx = r.context && r.context.used_percentage != null
              ? Math.floor(r.context.used_percentage) + "%" : "";
    const ctxColour = !ctx ? "" : (parseInt(ctx) >= 80 ? "color:var(--bad)"
                                 : parseInt(ctx) >= 60 ? "color:var(--warn)" : "");
    // The reply affordance is emphasised only on a row that is actually
    // blocked on you — that is the row you came to this page for.
    const act = CAN_SEND
      ? `<button class="act${r.sev === 4 ? " blocked" : ""}" data-sid="${esc(r.sid)}"`
        + ` data-name="${esc(r.name)}">${r.sev === 4 ? "reply" : "say"}</button>`
      : "";
    h += `<tr><td class="name">${esc(r.name)}</td><td class="dim">${esc(r.project)}</td>`
       + `<td class="sev${r.sev}"><span class="badge">${esc(r.token)}</span></td>`
       + `<td class="num dim">${dur(r.age)}</td>`
       + `<td class="num" style="${ctxColour}">${ctx}</td>`
       + `<td class="dim">${esc(last)}</td><td>${act}</td></tr>`;
    if (r.pipeline) {
      const p = r.pipeline, st = p.crashed ? "CRASHED" : p.status;
      const cls = (p.crashed || /interrupted|failed|needs_input/.test(p.status)) ? "crash" : "";
      h += `<tr class="sub"><td></td><td colspan="6">&#8627; ${esc(p.feature)} `
         + `<span class="${cls}">${esc(p.phase)}/${esc(st)}</span> `
         + `${esc(p.model||"")} $${(p.cost||0).toFixed(2)}</td></tr>`;
    }
  }
  return h + "</tbody></table>";
}

function unfinished(rows, older) {
  if (!rows.length) return '<p class="empty">Nothing unfinished recently.'
    + (older ? ` <span class="dim">(${older} older — see <b>ccwatch resume</b>)</span>` : "") + '</p>';
  let h = "<table><tbody>";
  for (const r of rows)
    h += `<tr><td class="sev3">${esc(r.phase)}/${esc(r.status)}</td>`
       // The project, which the first version omitted entirely — so two runs
       // from different repos were indistinguishable.
       + `<td class="name">${esc(r.project||"")}</td>`
       + `<td class="dim">${esc(r.feature)}</td><td class="dim">${esc(r.model||"")}</td>`
       + `<td class="num dim">$${(r.cost||0).toFixed(2)}</td>`
       + `<td class="dim">${r.age!=null?dur(r.age)+" ago":""}</td>`
       + `<td class="dim">claude --resume ${esc((r.sid||"").slice(0,8))}</td></tr>`;
  return h + "</tbody></table>"
    + (older ? `<div class="err dim">+${older} older — see ccwatch resume</div>` : "");
}

function deploys(d) {
  if (!d) return '<p class="empty">Not checked.</p>';
  let h = "";
  if (d.error) h += `<div class="err">${esc(d.error)}</div>`;
  if (!d.runs || !d.runs.length)
    return (h || "") + '<p class="empty">No deploy-shaped runs in the last 24h.</p>';
  const now = Date.now()/1000;
  let t = "<table><tbody>";
  for (const r of d.runs) {
    const state = r.live ? "RUNNING" : String(r.conclusion||"?").toUpperCase();
    const cls = state === "SUCCESS" ? "sev2" : state === "RUNNING" ? "" : "sev3";
    t += `<tr><td class="${cls}" style="${state==='RUNNING'?'color:var(--warn)':''}">`
       + `<span class="badge">${esc(state)}</span></td>`
       + `<td class="name">${esc(r.workflowName)}</td><td class="dim">${esc(r.repo)}</td>`
       + `<td class="dim">${esc(r.headBranch)}</td>`
       + `<td class="dim">${r.live ? "started "+dur(now-Date.parse(r.createdAt)/1000)+" ago"
                                  : dur(now-r.ended)+" ago"}</td>`
       + `<td><a href="${esc(r.url)}" style="color:var(--info)">run</a></td></tr>`;
  }
  return h + t + "</tbody></table>";
}

function peers(p) {
  if (!p || !p.edges || !p.edges.length)
    return '<p class="empty">No messages between sessions yet.</p>';
  let h = "";
  for (const e of p.edges)
    h += `<div class="edge"><div class="from name">${esc(e.from)}</div>`
       + `<div class="arrow">${e.count>1?"&#8658;&#8658;":"&#8658;"} `
       + `<span class="dim">${e.count}</span></div>`
       + `<div class="to name">${esc(e.to)}</div>`
       + `<div class="sample">${esc(e.sample)}</div></div>`;
  return h;
}

// An open reply box must survive the 3-second repaint, or you could never
// finish typing into it. So the row being replied to is tracked and re-opened
// after each render.
let replyingTo = null, lastOutcome = null;

function openReply(sid, name) {
  replyingTo = {sid, name};
  render_reply();
}

function render_reply() {
  document.querySelectorAll(".replyrow").forEach(el => el.remove());
  if (!replyingTo) return;
  const btn = document.querySelector(`.act[data-sid="${replyingTo.sid}"]`);
  if (!btn) return;   // that session is gone; drop the box rather than orphan it
  const tr = btn.closest("tr");
  const row = document.createElement("tr");
  row.className = "replyrow";
  row.innerHTML = `<td></td><td colspan="6"><div class="reply">`
    + `<input id="replyText" placeholder="message to ${esc(replyingTo.name)}…" autocomplete="off">`
    + `<button id="replySend">send</button>`
    + `<button class="act" id="replyCancel">cancel</button>`
    + `<span class="outcome" id="replyOut"></span></div></td>`;
  tr.after(row);
  const input = row.querySelector("#replyText");
  if (lastOutcome) {
    const o = row.querySelector("#replyOut");
    o.className = "outcome " + lastOutcome.state;
    o.textContent = lastOutcome.text;
  }
  input.value = (replyingTo.draft || "");
  input.focus();
  input.addEventListener("input", () => { replyingTo.draft = input.value; });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") doSend();
    if (e.key === "Escape") { replyingTo = null; lastOutcome = null; render_reply(); }
  });
  row.querySelector("#replySend").addEventListener("click", doSend);
  row.querySelector("#replyCancel").addEventListener("click",
    () => { replyingTo = null; lastOutcome = null; render_reply(); });
}

async function doSend() {
  const row = document.querySelector(".replyrow");
  if (!row || !replyingTo) return;
  const input = row.querySelector("#replyText");
  const btn = row.querySelector("#replySend");
  const out = row.querySelector("#replyOut");
  const message = input.value.trim();
  if (!message) return;
  btn.disabled = true;
  out.className = "outcome";
  // Named, because the wait is the delivery check: ccwatch watches the
  // receiver's transcript rather than reporting success on a socket write.
  out.textContent = "sending, then checking it arrived…";
  try {
    const res = await fetch("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CCWatch-Token": SEND_TOKEN},
      body: JSON.stringify({target: replyingTo.sid, message}),
    });
    const j = await res.json();
    lastOutcome = {state: j.state || "failed",
                   text: j.state === "delivered" ? "delivered — it has the message"
                       : j.state === "queued" ? "queued — it is mid-turn, will read it next turn"
                       : (j.error || j.detail || "failed")};
    if (j.state === "delivered" || j.state === "queued") {
      replyingTo.draft = "";
      input.value = "";
    }
  } catch (e) {
    lastOutcome = {state: "failed", text: e.message};
  }
  btn.disabled = false;
  out.className = "outcome " + lastOutcome.state;
  out.textContent = lastOutcome.text;
}

document.addEventListener("click", e => {
  const b = e.target.closest(".act[data-sid]");
  if (b) { lastOutcome = null; openReply(b.dataset.sid, b.dataset.name); }
});

// The age of the data, not the age of the request: computed from the
// absolute collected_at instants in the body we hold, never from a stored
// `ages` value, so a repaint after a 304 or a resumed collection still shows
// the true elapsed time rather than freezing it at the moment the body
// arrived.
function repaintFooter() {
  if (!lastBody) return;
  const s = lastBody;
  if (s.warming) {
    // The sentence itself is the alert control's (b) — stated once, in one
    // place, rather than here as well.
    $("foot").textContent = "";
    $("counts").innerHTML = '<span>warming up</span>';
    return;
  }
  const ca = s.collected_at || {};
  const ageOf = k => ca[k] != null ? (Date.now() / 1000 - ca[k]) : null;
  const snapAge = ageOf("snapshot"), depAge = ageOf("deploys"), peerAge = ageOf("peers");
  const bits = ["updated " + new Date().toLocaleTimeString()];
  if (snapAge > 10) bits.push(`<span class="stale">sessions ${dur(snapAge)} behind</span>`);
  if (depAge != null) bits.push(`deploys ${dur(depAge)} ago`);
  if (peerAge != null) bits.push(`peers ${dur(peerAge)} ago`);
  // `s.error` is the failed-collection reason, and it is what makes
  // feedCondition say `feed_down` — so it is stated by the alert control, at
  // the top of the page, rather than here as a second copy at the bottom.
  if (!CAN_SEND) bits.push('<span class="dim">read-only</span>');
  $("foot").innerHTML = bits.join(" &middot; ");
}

let lastEtag = null, lastBody = null;
async function tick() {
  try {
    const res = await fetch("/api/state", lastEtag ? {headers: {"If-None-Match": lastEtag}} : {});
    if (res.status === 304) {
      // ⚠️ The alerts are re-rendered here too, not only on a fresh body. A
      // tick that failed leaves "the feed is down" on screen, and the read
      // that proves the feed is back is very often a 304 — the payload has
      // not changed, only our ability to fetch it. Skipping this leaves a
      // failure latched on a healthy feed, which nothing but a reload clears.
      const cond = CCWATCH_ALERTS.feedCondition(lastBody, null);
      renderAlerts(CCWATCH_ALERTS.alerts(
        {cond, host: lastBody && lastBody.host, volatile: cond.trust === "ok"}));
      repaintFooter();
      return;
    }
    lastEtag = res.headers.get("ETag");
    const s = await res.json();
    lastBody = s;
    // One judgement of the feed, from the module the map reads too
    // (principle XI) — this page used to decide it a second way, in the
    // try/catch below, and two renderings that decide independently whether
    // the feed can be believed will eventually disagree.
    const cond = CCWATCH_ALERTS.feedCondition(s, null);
    renderAlerts(CCWATCH_ALERTS.alerts(
      {cond, host: s.host, volatile: cond.trust === "ok"}));
    if (s.warming) {
      repaintFooter();
      return;
    }
    renderGauges(s.usage);
    $("sessions").innerHTML = sessions(s.sessions || []);
    $("unfinished").innerHTML = unfinished(s.unfinished || [], s.unfinished_old || 0);
    $("deploys").innerHTML = deploys(s.deploys);
    $("peers").innerHTML   = peers(s.peers);
    const w = (s.sessions||[]).filter(r => r.sev === 4).length;
    const q = (s.sessions||[]).filter(r => r.sev === 3).length;
    $("counts").innerHTML = `<span>${(s.sessions||[]).length} live`
      + (w ? ` &middot; <b style="color:var(--block)">${w} waiting on you</b>` : "")
      + (q ? ` &middot; <b style="color:var(--bad)">${q} suspect</b>` : "") + `</span>`;
    document.title = (w ? `(${w}) ` : "") + "ccwatch";
    repaintFooter();
    render_reply();
  } catch (e) {
    // A dashboard that silently stops updating is the failure this whole tool
    // exists to prevent, so a dead feed is stated in the page — at the top of
    // it now, next to the readings it invalidates, rather than in the footer
    // under a table that may be longer than the screen. `host` is null rather
    // than retained: a memory reading from a feed that just failed is the
    // stale number principle III forbids.
    const cond = CCWATCH_ALERTS.feedCondition(lastBody, e.message);
    renderAlerts(CCWATCH_ALERTS.alerts({cond, host: null, volatile: false}));
  }
}
// The one and only setInterval in this file: everything periodic routes
// through here so a page that is hidden (backgrounded tab) does no work at
// all, and a page that becomes visible fires once immediately rather than
// waiting out whatever was left of the old interval.
let timer = null;
function every(ms, fn) {
  if (timer) clearInterval(timer);
  timer = setInterval(fn, ms);
}
function resume() {
  if (document.hidden) {
    if (timer) { clearInterval(timer); timer = null; }
    return;
  }
  tick();
  every(3000, tick);
}
document.addEventListener("visibilitychange", resume);
resume();
</script>
</body>
</html>
